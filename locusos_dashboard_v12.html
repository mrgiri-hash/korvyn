<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORVYN</title>
<style>
/* ============================================================
   KORVYN — "Instrument" design system
   Structured monochrome slate · single capital-blue accent ·
   engineered numerics · light + dark. Signature: the spine ribbon.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* ---- structural slate (light) ---- */
  --bg:#F6F7F9; --bg2:#EEF0F4; --surface:#FFFFFF; --surface2:#FBFCFD;
  --ink:#101623; --muted:#5A6474; --hint:#8A93A3; --faint:#B4BCC9;
  --line:#E7EAF0; --line2:#D6DBE4; --rail:#0E1521; --rail-ink:#C4CCDA; --rail-hint:#727E92;

  /* ---- single accent (capital blue) + one supporting depth ---- */
  --accent:#2563C9; --accent-ink:#1D4FA8; --accent-bg:#EAF1FD; --accent-line:#BFD5F5;
  --accent-2:#0E7C86; /* teal-slate, used only for "incurred/actual" measure */

  /* ---- four disciplined semantic states ---- */
  --pos:#1E7F52; --pos-bg:#E6F3EC; --pos-ink:#125A2B;
  --warn:#9A6510; --warn-bg:#FBF0DD;
  --neg:#B3382F; --neg-bg:#FBEAE8;
  --neu:#5A6474; --neu-bg:#EEF0F4;

  /* ---- measure hues (mapped to old vars so render code is untouched) ---- */
  --blue:#2563C9; --blue-bg:#EAF1FD;
  --teal:#0E7C86; --teal-bg:#E1F1F2;
  --coral:#B3382F; --coral-bg:#FBEAE8;
  --amber:#9A6510; --amber-bg:#FBF0DD;
  --red:#B3382F; --red-bg:#FBEAE8;
  --green:#1E7F52; --green-bg:#E6F3EC;
  --purple:#2563C9; --purple-bg:#EAF1FD;   /* accent collapses onto blue */

  /* ---- FILL vs TEXT split ----------------------------------------------------
     --accent / --neg are the TEXT hues (links, labels on page surfaces).
     --accent-fill / --neg-fill are the BACKGROUND hues used behind --on-* text.
     In light mode one value serves both; in dark they must diverge, because a hue
     light enough to read as text on a dark surface is too light to carry white text. */
  --accent-fill:#2563C9; --neg-fill:#B3382F;
  --on-accent:#FFFFFF; --on-neg:#FFFFFF;
  /* the assistant sits on its own barely-cooler surface so the two windows
     read as separate planes without a hard colour break */
  --surface-ai:#EEF3FA;
  --shadow-sm:0 1px 2px rgba(16,22,35,.03),0 1px 3px rgba(16,22,35,.05);
  --shadow-md:0 2px 4px rgba(16,22,35,.04),0 8px 24px rgba(16,22,35,.06);
  --shadow-rail:0 0 0 1px rgba(255,255,255,.03) inset;
  --radius:12px; --radius-sm:8px; --radius-pill:20px;
  /* ---- shell geometry (single source of truth for the rail + topbar) ---- */
  --rail-w:212px; --rail-w-collapsed:60px; --ribbon-h:56px;
  /* ---- density scale ---- */
  --pad-card:22px; --pad-content:26px; --row-h:44px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --num:"Inter",var(--sans); /* Inter has excellent tabular figures */
}
[data-theme="dark"]{
  --bg:#0B1018; --bg2:#0E141E; --surface:#141B27; --surface2:#111823;
  --ink:#EAEEF5; --muted:#9CA6B6; --hint:#6E7889; --faint:#4B5568;
  --line:#222C3B; --line2:#2C384A; --rail:#080C13; --rail-ink:#AEB8C8; --rail-hint:#616C7E;

  --accent:#5B93F0; --accent-ink:#7FACF5; --accent-bg:#16233A; --accent-line:#2A436B;
  --accent-2:#3FB0BA;

  --pos:#4FBF88; --pos-bg:#12281E; --pos-ink:#7FD9A0;
  --warn:#D6A24E; --warn-bg:#2A2213;
  --neg:#E8756B; --neg-bg:#2C1613;
  --neu:#9CA6B6; --neu-bg:#1A2331;

  --blue:#5B93F0; --blue-bg:#16233A;
  --teal:#3FB0BA; --teal-bg:#122A2C;
  --coral:#E8756B; --coral-bg:#2C1613;
  --amber:#D6A24E; --amber-bg:#2A2213;
  --red:#E8756B; --red-bg:#2C1613;
  --green:#4FBF88; --green-bg:#12281E;
  --purple:#5B93F0; --purple-bg:#16233A;

  /* Dark --accent/--neg are deliberately light so they read as TEXT on dark surfaces
     (5.66:1). That makes them unusable as fills -- white on #5B93F0 is only 3.05:1.
     So fills diverge here: white on --accent-fill = 5.01:1, on --neg-fill = 4.96:1. */
  --accent-fill:#2E6BD6; --neg-fill:#C4443A;
  --on-accent:#FFFFFF; --on-neg:#FFFFFF;
  --surface-ai:#161F30;

  --shadow-sm:0 1px 2px rgba(0,0,0,.28);
  --shadow-md:0 2px 4px rgba(0,0,0,.28),0 12px 32px rgba(0,0,0,.38);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
  display:grid;
  grid-template-columns:var(--rail-w) 1fr var(--copilot-w,380px);
  grid-template-rows:auto 1fr;
  grid-template-areas:"ribbon ribbon ribbon" "rail main copilot";
  min-height:100vh;
}
::selection{background:var(--accent-bg);color:var(--accent-ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================ APP SHELL: TOP RIBBON ============================ */
.ribbon{
  grid-area:ribbon;position:sticky;top:0;z-index:30;
  background:var(--rail);color:var(--rail-ink);
  display:flex;align-items:center;gap:22px;padding:0 20px;height:56px;
  /* no bottom shadow: it would score a seam across the rail, which shares this surface */
}
/* The wordmark is the Home control, so Home is not repeated in the section nav. */
.ribbon-brand{display:flex;align-items:center;flex:none;padding:6px 26px 6px 0;
  border:none;background:none;cursor:pointer;border-radius:10px;transition:.14s}
.ribbon-brand:hover .brand-lockup{opacity:.82}
.ribbon-brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand-lockup{transition:opacity .14s}
body.at-home .ribbon-brand{cursor:default}
body.at-home .ribbon-brand:hover .brand-lockup{opacity:1}
/* Brand lockup is the supplied artwork, keyed off its black background.
   Do not substitute a redrawn mark — this is the trademark. */
.brand-lockup{height:30px;width:auto;display:block;flex:none}

.rail-name{font-size:15px;font-weight:600;letter-spacing:.18em;color:#fff;line-height:1}
.rail-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-hint);margin-top:3px}

/* horizontal section nav (was the vertical rail role list; #railRoles / .railrole preserved) */
.ribbon-nav{display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto}
.ribbon-nav::-webkit-scrollbar{height:0}
.railrole{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;white-space:nowrap;
  color:var(--rail-ink);font:inherit;font-size:12.5px;padding:8px 13px;border-radius:8px;transition:.13s;position:relative}
.railrole:hover{background:rgba(255,255,255,.06);color:#fff}
.railrole .ic{width:15px;height:15px;flex:none;opacity:.68}
.railrole.on{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
.railrole.on .ic{opacity:1}

.ribbon-scope{flex:none;text-align:right;font-size:10.5px;color:var(--rail-hint);line-height:1.4;
  padding-left:20px;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:1px}
.ribbon-scope-port{opacity:.85}
.ribbon-scope b{color:var(--rail-ink);font-weight:600;font-size:11px}

/* legacy rail sub-nav classes kept in case any render path references them (secnav uses its own styles) */
.railtab{display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;
  color:var(--rail-ink);font:inherit;font-size:12.5px;padding:8px 10px;border-radius:8px;transition:.13s;position:relative}

/* ============================ APP SHELL: LEFT RAIL ============================ */
body.rail-collapsed{--rail-w:var(--rail-w-collapsed)}
.rail{
  grid-area:rail;position:sticky;top:var(--ribbon-h);align-self:start;
  height:calc(100vh - var(--ribbon-h));z-index:20;
  background:var(--rail);border-right:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;overflow:hidden;transition:width .16s ease;
}
.rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.rail-scroll::-webkit-scrollbar{width:0}
.rail-grouplbl{
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--rail-hint);
  padding:14px 10px 6px;white-space:nowrap;overflow:hidden}
body.rail-collapsed .rail-grouplbl{opacity:0;height:14px;padding:8px 0 0}
.rail-div{height:1px;background:rgba(255,255,255,.07);margin:10px 8px}
.rail .railrole{width:100%}
.rail .railrole .lbl{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
body.rail-collapsed .rail .railrole{justify-content:center;padding:9px 0}
body.rail-collapsed .rail .railrole .lbl{display:none}

/* ---- ribbon right-side utilities ---- */
.ribbon-util{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto;padding-left:14px;
  border-left:1px solid rgba(255,255,255,.08);position:relative}
.ribicon{position:relative;width:32px;height:32px;border:none;background:none;border-radius:var(--radius-sm);
  color:var(--rail-ink);cursor:pointer;display:grid;place-items:center;transition:.13s}
.ribicon:hover{background:rgba(255,255,255,.09);color:#fff}
.ribicon svg{width:16px;height:16px}
.ribdot{position:absolute;top:2px;right:1px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--neg-fill);color:var(--on-neg);font-size:9px;font-weight:700;display:grid;place-items:center;
  line-height:1;box-shadow:0 0 0 2px var(--rail)}
.ribuser{display:flex;align-items:center;gap:3px;border:none;background:none;cursor:pointer;
  padding:3px 4px 3px 3px;border-radius:var(--radius-pill);color:var(--rail-ink);transition:.13s;margin-left:2px}
.ribuser:hover{background:rgba(255,255,255,.09)}
.ribuser .chev{width:14px;height:14px}
.avatar.av-solid{background:var(--accent-fill);color:var(--on-accent)}

.ribbon-more{position:relative;flex:none;margin-left:2px}
.rib-more-btn{padding:8px 10px}
.more-menu{position:absolute;top:calc(100% + 10px);left:0;min-width:186px;z-index:60;
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);padding:6px;display:none}
.more-menu.open{display:block}
.usermenu{position:absolute;top:calc(100% + 8px);right:0;min-width:210px;z-index:60;
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);padding:6px;display:none}
.usermenu.open{display:block}
.um-hd{display:flex;align-items:center;gap:10px;padding:9px 10px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.um-nm{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2}
.um-rl{font-size:11px;color:var(--hint);margin-top:2px}
.um-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);padding:9px 10px;border-radius:6px;text-align:left;transition:.12s}
.um-item:hover{background:var(--accent-bg);color:var(--accent-ink)}
.um-item svg{width:15px;height:15px;flex:none;color:var(--muted)}
.um-item:hover svg{color:var(--accent)}


/* ---- rail: nesting + badges ---- */
.railrole .rbadge{margin-left:auto;min-width:19px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--neg-fill);color:var(--on-neg);font-size:9.5px;font-weight:700;
  display:grid;place-items:center;line-height:1;flex:none}
.railrole .rbadge.mut{background:rgba(255,255,255,.12);color:var(--rail-ink)}
body.rail-collapsed .rail .railrole .rbadge{display:none}
.railrole .rchev{margin-left:auto;width:13px;height:13px;flex:none;opacity:.6;transition:transform .15s}
.railrole.exp .rchev{transform:rotate(180deg)}
body.rail-collapsed .rail .railrole .rchev{display:none}
.railkids{display:none;flex-direction:column;gap:1px;margin:1px 0 3px}
.railkids.open{display:flex}
body.rail-collapsed .rail .railkids{display:none!important}
.railkid{display:flex;align-items:center;border:none;background:none;cursor:pointer;width:100%;
  color:var(--rail-hint);font:inherit;font-size:12px;padding:6px 11px 6px 38px;border-radius:var(--radius-sm);
  transition:.13s;text-align:left;white-space:nowrap}
.railkid:hover{background:rgba(255,255,255,.06);color:var(--rail-ink)}
.railkid.on{color:#fff;background:rgba(255,255,255,.09);font-weight:600}
.rail-foot{flex:none;border-top:1px solid rgba(255,255,255,.07);padding:8px 10px}
.rail-collapse{
  display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  color:var(--rail-hint);font:inherit;font-size:11.5px;padding:8px 11px;border-radius:var(--radius-sm);transition:.13s}
.rail-collapse:hover{background:rgba(255,255,255,.06);color:var(--rail-ink)}
.rail-collapse svg{width:15px;height:15px;flex:none;transition:transform .16s}
body.rail-collapsed .rail-collapse{justify-content:center;padding:8px 0}
body.rail-collapsed .rail-collapse .lbl{display:none}
body.rail-collapsed .rail-collapse svg{transform:rotate(180deg)}

/* ============================ MAIN COLUMN ============================ */
.main{grid-area:main;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:56px;z-index:15;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line);
  padding:12px 26px;display:flex;align-items:center;gap:16px}
.tb-title{min-width:0}
.tb-title h1{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.2;display:flex;align-items:center;gap:9px}
.tb-title .crumbline{font-size:11.5px;color:var(--hint);margin-top:2px;letter-spacing:.01em}
.tb-title .crumbline b{color:var(--muted);font-weight:500}
.topbar-spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.13s}
.iconbtn:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-bg)}
.iconbtn svg{width:16px;height:16px}
.env-chip{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--warn);background:var(--warn-bg);padding:5px 10px;border-radius:20px;white-space:nowrap}

.content{padding:22px var(--pad-content) 40px;max-width:1360px;width:100%;margin:0 auto}

/* ---- global command bar (spotlight style) ---- */
.cmdwrap{margin-bottom:18px}
.cmd{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line2);
  border-radius:12px;padding:13px 16px;box-shadow:var(--shadow-sm);transition:.15s}
.cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.cmd .spark-ic{flex:none;color:var(--accent)}
.cmd input{flex:1;border:none;outline:none;font:inherit;font-size:14.5px;background:none;color:var(--ink)}
.cmd input::placeholder{color:var(--hint)}
.cmd .kbd{font-size:10.5px;color:var(--hint);border:1px solid var(--line2);border-radius:6px;padding:3px 7px;font-family:var(--mono)}
.cmd-sug{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cmd-chip{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface);
  color:var(--muted);cursor:pointer;transition:.13s}
.cmd-chip:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-ink)}
.cmd-chip .q{color:var(--accent);font-weight:600;margin-right:5px}

/* ---- role question line ---- */
.lensq{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--muted);
  margin:2px 0 18px;padding-left:14px;border-left:2px solid var(--accent-line);line-height:1.45}

/* ---- AI answer panel ---- */
.ai{background:var(--surface);border:1px solid var(--accent-line);border-left:3px solid var(--accent);
  border-radius:12px;padding:16px 18px;margin-bottom:16px;display:none;box-shadow:var(--shadow-sm)}
.ai.show{display:block}
.ai-head{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--accent-ink);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.ai-head .close{margin-left:auto;font-size:18px}
.ai-q{font-family:var(--serif);font-size:15px;color:var(--muted);font-style:italic;margin-bottom:11px}
.ai-body{font-size:14px;line-height:1.6}
.ai-body b{color:var(--ink);font-weight:600}
.ai-action{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
.ai-hits{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.ai-hit{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:9px;
  cursor:pointer;font-size:13px;transition:.13s;background:var(--surface2)}
.ai-hit:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.ai-hit .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:3px 8px;border-radius:6px;flex:none}
.ai-hit .amt{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.badge-acct{background:var(--accent-bg);color:var(--accent-ink)}.badge-vendor{background:var(--teal-bg);color:var(--teal)}
.badge-po{background:var(--warn-bg);color:var(--warn)}.badge-site{background:var(--neu-bg);color:var(--neu)}
.badge-je{background:var(--accent-bg);color:var(--accent-ink)}.badge-hall{background:var(--pos-bg);color:var(--pos)}

/* ---- filter bar ---- */
.bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.barlabel{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:11px;display:flex;align-items:center;gap:7px;font-weight:600}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));
  gap:16px 18px;align-items:end}
@media(max-width:640px){.ctrls{grid-template-columns:1fr 1fr}}
.grp{display:flex;flex-direction:column;gap:5px}
.grp label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none}
select,input[type=date]{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line2);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);cursor:pointer;transition:.13s}
/* filter-panel selects fill their grid cell and carry a chevron */
.ctrls .grp{min-width:0}
.ctrls .grp .seg{width:fit-content}
.ctrls .grp .seg button{white-space:nowrap}
.ctrls .grp select{width:100%;appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;color:var(--ink)}
select:hover{border-color:var(--line2)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12.5px;padding:7px 13px;border:none;background:var(--surface);
  color:var(--muted);cursor:pointer;border-right:1px solid var(--line2);transition:.12s}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--bg2)}
.seg button.on{background:var(--accent-fill);color:var(--on-accent)}
.lenshint{font-size:11px;color:var(--accent-ink);background:var(--accent-bg);padding:5px 11px;border-radius:8px;margin-left:auto;align-self:flex-end;font-weight:500}

.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- KPI cards ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;
  box-shadow:var(--shadow-sm);transition:.15s;position:relative;overflow:hidden}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;font-weight:600}
.kpi .v{font-family:var(--num);font-size:27px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .d{font-size:11.5px;color:var(--hint);margin-top:6px;line-height:1.4}
.kpi.flag .v{color:var(--neg)}.kpi.good .v{color:var(--pos)}.kpi.warn .v{color:var(--warn)}
.kpi.lenshi{border-color:var(--accent-line)}
.kpi.lenshi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi .lenstag{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);
  font-weight:700;margin-top:8px;display:flex;align-items:center;gap:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad-card);margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card h2 .note{font-size:12px;color:var(--hint);font-weight:400}
.card .subhead{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.55;max-width:80ch}
.lenspin{font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--accent-bg);color:var(--accent-ink);font-weight:700}

/* ---- measure bars ---- */
.measures{display:flex;flex-direction:column;gap:12px}
.m-row{display:grid;grid-template-columns:100px 1fr 90px;align-items:center;gap:12px;font-size:13px}
.m-label{color:var(--muted)}
.m-track{background:var(--bg2);border-radius:7px;height:24px;overflow:hidden;position:relative}
.m-fill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.m-val{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.gap-note{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:12.5px;line-height:1.5}
.gap-note.warn{background:var(--warn-bg);color:var(--warn)}
.gap-note.good{background:var(--pos-bg);color:var(--pos)}

/* ---- ledger rows ---- */
.lrows{display:flex;flex-direction:column;font-size:13.5px}
.l-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:16px}
.l-row.total{border-bottom:none;font-weight:600;padding-top:12px;border-top:2px solid var(--line2);margin-top:2px}
.l-row .amt{font-family:var(--num);font-variant-numeric:tabular-nums}
.l-row.sub{color:var(--muted);font-size:12.5px;padding:6px 0 6px 16px}
.residual{margin-top:11px;padding:13px;border-radius:9px;font-size:14px;font-weight:600;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:9px}
.residual.clean{background:var(--pos-bg);color:var(--pos)}
.residual.flag{background:var(--neg-bg);color:var(--neg)}

/* ---- tables ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line2);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.tbl tfoot td{border-top:2px solid var(--line2);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2)}
.row-click{cursor:pointer;transition:.1s}.row-click:hover td{background:var(--surface2)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.pill.service,.pill.good{background:var(--pos-bg);color:var(--pos)}
.pill.build,.pill.info{background:var(--accent-bg);color:var(--accent-ink)}
.pill.ready,.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.flag{background:var(--neg-bg);color:var(--neg)}
.pill.own{background:var(--accent-bg);color:var(--accent-ink)}
.pill.lease{background:var(--warn-bg);color:var(--warn)}
.pill.sm{font-size:10px;padding:2px 7px}

/* ---- burn bars ---- */
.burn{position:relative;height:18px;border-radius:9px;background:var(--bg2);overflow:hidden;min-width:130px}
/* vendor commitment bar: fill length = share of largest commitment; overlays = invoiced/paid progress */
.vbar{position:relative;height:16px;border-radius:8px;background:var(--bg2);overflow:hidden;width:100%;min-width:110px}
.vbar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.24;border-radius:8px}
.vbar-fill .inv{position:absolute;left:0;top:0;bottom:0;background:var(--accent-2);opacity:.7;border-radius:8px}
.vbar-fill .paid{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:1;border-radius:8px}
.burn .committed{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.22;border-radius:9px}
.burn .inv{position:absolute;left:0;top:0;bottom:0;background:var(--accent-2);opacity:.55;border-radius:9px}
.burn .paid{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px}
.burn-lbl{font-size:10.5px;color:var(--hint);margin-top:4px;font-family:var(--num);font-variant-numeric:tabular-nums}

.legend{display:flex;gap:18px;margin:2px 0 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:var(--faint)}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.note{font-size:12px;color:var(--hint);margin-top:12px;line-height:1.6;max-width:88ch}
.btn-x{font:inherit;font-size:12.5px;padding:8px 14px;border:1px solid var(--line2);border-radius:9px;
  background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn-x:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-ink)}

/* ---- pivot ---- */
.pivwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;overflow-x:auto;margin-bottom:18px;box-shadow:var(--shadow-sm)}
table.piv{border-collapse:collapse;width:100%;font-size:13px}
table.piv th,table.piv td{padding:10px 13px;text-align:right;white-space:nowrap}
table.piv th.rowhdr,table.piv td.rowhdr{text-align:left;font-weight:600}
table.piv thead th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line2);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
table.piv tbody td{border-bottom:1px solid var(--line);font-family:var(--num);font-variant-numeric:tabular-nums;cursor:pointer;transition:.1s}
table.piv tbody tr:hover td{background:var(--surface2)}
table.piv tfoot td{border-top:2px solid var(--line2);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2)}
.cell-c{color:var(--accent)}.cell-i{color:var(--accent-2);font-weight:600}.cell-p{color:var(--muted)}
.m3{display:flex;flex-direction:column;line-height:1.35}
.m3 .sub-c{color:var(--accent);font-size:11px}.m3 .sub-p{color:var(--muted);font-size:11px}

.drill{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);padding:20px;margin-top:4px;display:none;box-shadow:var(--shadow-md)}
.drill.show{display:block;animation:fade .2s ease}
.drill h3{font-size:14.5px;font-weight:600;margin-bottom:4px}
.drill .ctx{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.close{float:right;cursor:pointer;color:var(--hint);font-size:20px;border:none;background:none;line-height:1;transition:.13s}
.close:hover{color:var(--ink)}

.expander{display:inline-block;width:14px;color:var(--faint);cursor:pointer;user-select:none;transition:.13s;transform-origin:center}
.expander.open{color:var(--accent);transform:rotate(90deg)}
.tbl td.indent1,.indent1{padding-left:26px}.tbl td.indent2,.indent2{padding-left:48px}.tbl td.indent3,.indent3{padding-left:70px}
.tbl td.indent4,.indent4{padding-left:92px}.tbl td.indent5,.indent5{padding-left:114px}.tbl td.indent6,.indent6{padding-left:136px}
/* trending tree: a left guide rail + level accents so deep nesting reads clearly */
.tree-row td:first-child{position:relative}
.tree-row .tw{display:inline-flex;align-items:center;gap:7px}
.tree-row .rail{display:inline-block;width:0;border-left:1px dashed var(--line2);align-self:stretch}
.tree-l0>td:first-child{font-weight:600}
.tree-l1>td:first-child{font-weight:600}
.tree-l2>td:first-child{font-weight:500}
.tree-l3>td:first-child{color:var(--muted)}
.tree-l4>td:first-child,.tree-l5>td:first-child{color:var(--muted);font-size:12.5px}
.tree-row>td:first-child .lvtag{display:inline-block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--hint);background:var(--bg2);border-radius:4px;padding:1px 5px;margin-right:2px;font-weight:600;vertical-align:1px}
.tree-row .dep{display:inline-block;width:14px;text-align:center;color:var(--line2);user-select:none}
.tree-row.open-row>td{background:var(--accent-bg)}
.tree-row.open-row>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.trend-leaf>td{background:var(--surface2)}
.trend-leaf>td:first-child{box-shadow:inset 3px 0 0 var(--accent-2)}
.subrow td{background:var(--surface2)}

footer{margin-top:24px;font-size:11px;color:var(--hint);text-align:center;padding:16px;line-height:1.7;border-top:1px solid var(--line)}
footer b{color:var(--muted)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:6px;background:var(--accent-2);border-radius:2px 2px 0 0;display:inline-block;opacity:.8}

.tb-var-ok{color:var(--pos);font-weight:600}.tb-var-flag{color:var(--neg);font-weight:600}
.recon-box{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}

/* section sub-header strip (top-level sub-navigation per section) */
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:5px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.secnav button{font:inherit;font-family:var(--sans);font-size:13px;padding:9px 16px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-radius:9px;display:flex;align-items:center;gap:8px;transition:all .13s;font-weight:500}
.secnav button:hover{color:var(--ink);background:var(--surface)}
.secnav button.on{color:var(--accent-ink);background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600}
.secnav button .ic{width:15px;height:15px;flex:none}
.secnav button .n{font-size:10px;background:var(--neg-fill);color:var(--on-neg);border-radius:10px;padding:1px 6px;font-weight:700;font-family:var(--num)}
.secnav button .n.q{background:var(--warn)}

/* ---- unified bar: a section tab's sub-views render inline in the SAME strip ---- */
/* One bar, never two rows. The divider separates a tab from its own sub-views;
   sub-views reuse the identical .secnav button styling for full consistency. */
.secnav .sn-div{width:1px;align-self:stretch;margin:4px 4px;background:var(--line2);flex:none}

/* ---- second-row sub-header strip (the active tab's sub-views) ---- */
/* Renders directly below the section tab strip. Subordinate but same visual language. */
.subnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 10px;padding:4px 6px}
.subnav .sn-lead{font-size:9px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;color:var(--hint);padding:0 6px 0 4px;white-space:nowrap}
.subnav2{margin-top:-6px;padding-left:14px}
.subnav2 button{font-size:12px;padding:6px 12px}
.subnav button{font:inherit;font-family:var(--sans);font-size:12.5px;padding:7px 13px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:7px;transition:all .13s;font-weight:500}
.subnav button:hover{color:var(--ink);background:var(--surface2)}
.subnav button.on{color:var(--accent-ink);background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600}
.subnav button .n{font-size:9.5px;background:var(--neg-fill);color:var(--on-neg);border-radius:10px;padding:1px 5px;font-weight:700;font-family:var(--num)}
.subnav button .n.q{background:var(--warn)}

/* collapsible global-filter bar (sits under the sub-nav) */
.filterbar{margin-bottom:18px}
.filterbar-hd{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-family:var(--sans);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;
  color:var(--muted);transition:.13s;box-shadow:var(--shadow-sm)}
.filterbar-hd:hover{border-color:var(--line2);color:var(--ink)}
.filterbar.open .filterbar-hd{border-radius:10px 10px 0 0;border-bottom-color:transparent}
.filterbar-hd .ic{flex:none;opacity:.7}
.filterbar-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--hint)}
.filterbar-state{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:var(--ink);
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:2px 11px}
.filterbar-caret{margin-left:auto;font-size:10px;color:var(--hint);transition:transform .15s}
.filterbar-caret.open{transform:rotate(90deg)}
.filterbar .bar{margin-bottom:0;border-radius:0 0 10px 10px;border-top:none}

/* ---- filter panel footer (Reset / Done) ---- */
.filter-foot{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;
  border-top:1px solid var(--line)}
.filter-foot .spacer{flex:1}
.filter-foot .lenshint{font-size:11.5px;color:var(--hint);max-width:60ch}

/* ---- filings index / workspace ---- */
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--accent-bg);color:var(--accent-ink);font-size:9.5px;font-weight:700;
  letter-spacing:.02em;flex:none;vertical-align:middle}
.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th.sortable .caret{opacity:.35;font-size:9px;margin-left:4px}
.tbl th.sortable.act .caret{opacity:1;color:var(--accent)}
.linkish{color:var(--accent);font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pager .cnt{margin-right:auto;font-size:12px;color:var(--hint)}
.pgbtn{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;font:inherit;font-size:12px;transition:.13s}
.pgbtn:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent)}
.pgbtn.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600}
.pgbtn:disabled{opacity:.4;cursor:default}
.mini-bar{height:5px;border-radius:3px;background:var(--bg2);overflow:hidden;min-width:70px}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.segbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.segbar button{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--line2);background:var(--surface);color:var(--muted);cursor:pointer;transition:.13s}
.segbar button:hover{border-color:var(--accent-line);color:var(--accent)}
.segbar button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600}
.segbar button .ct{opacity:.75;margin-left:6px;font-variant-numeric:tabular-nums}
.fhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.fhead .ttl{font-size:19px;font-weight:600;letter-spacing:-.01em}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:14px;margin-bottom:18px}
.donut{display:flex;align-items:center;gap:14px}
.donut svg{flex:none}
.kv{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:12.5px}
.kv .kvk{color:var(--hint);min-width:96px;flex:none}
.person{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.person .pn{font-size:12.5px;font-weight:600;line-height:1.2}
.person .pr{font-size:11px;color:var(--hint)}

/* ---- filing page chrome ---- */
.crumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;margin-bottom:10px}
.crumbs a{color:var(--accent);cursor:pointer;font-weight:500}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{color:var(--faint);font-size:11px}
.crumbs .cur{color:var(--muted)}
.fpage-hd{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.fpage-hd .grow{flex:1;min-width:240px}
.fpage-ttl{font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fpage-meta{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fpage-meta .dot{color:var(--faint)}
.btn-icon{width:34px;height:34px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);
  border-radius:var(--radius-sm);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.13s}
.btn-icon:hover{border-color:var(--accent-line);color:var(--accent)}
.btn-out{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;
  padding:9px 14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  border-radius:var(--radius-sm);cursor:pointer;transition:.13s}
.btn-out:hover{border-color:var(--accent-line);color:var(--accent)}
.btn-out svg,.btn-primary svg{width:14px;height:14px}
.btn-primary{display:inline-flex;align-items:center;gap:7px}
.ftabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.ftabs button{font:inherit;font-size:13px;padding:11px 14px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s;white-space:nowrap}
.ftabs button:hover{color:var(--ink)}
.ftabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.ftabs button .ct{font-size:10.5px;color:var(--hint);margin-left:5px}

/* overview card grid: 5 across on wide screens */
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px;margin-bottom:18px}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:7px}
.legend .sw{width:8px;height:8px;border-radius:50%;flex:none}
.legend .n{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.kdate{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}
.kdate svg{width:15px;height:15px;flex:none;color:var(--hint);margin-top:1px}
.kdate .kl{font-size:11.5px;color:var(--hint)}
.kdate .kv2{font-size:12.5px;font-weight:600}
.stackbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bg2);margin:12px 0 14px}
.stackbar i{display:block;height:100%}
.viewall{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.viewall:hover{text-decoration:underline}
.avstack{display:inline-flex;align-items:center}
.avstack .avatar{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.avstack .avatar:first-child{margin-left:0}
.avmore{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg2);border-radius:20px;padding:3px 7px;margin-left:4px}

/* ---- two-column work area ---- */
.fwork{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.fwork{grid-template-columns:1fr}}
.tree-grp{border-bottom:1px solid var(--line)}
.tree-grp:last-child{border-bottom:none}
.tree-hd{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink);padding:11px 4px;text-align:left;transition:.13s}
.tree-hd:hover{color:var(--accent)}
.tree-hd .tchev{width:12px;height:12px;flex:none;color:var(--hint);transition:transform .15s}
.tree-hd.open .tchev{transform:rotate(90deg)}
.tree-hd .st{margin-left:auto;font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tree-hd .st .ring{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;flex:none}
.tree-kid{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--muted);padding:8px 4px 8px 26px;text-align:left;
  border-radius:var(--radius-sm);transition:.13s}
.tree-kid:hover{background:var(--bg2);color:var(--ink)}
.tree-kid.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.tree-kid .st{margin-left:auto;font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tree-kid .st .ring{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;flex:none}
.tree-kid .fic{width:13px;height:13px;flex:none;opacity:.6}

/* ---- document cards ---- */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin:12px 0 18px}
.doc{border:1px solid var(--line2);border-radius:var(--radius-sm);padding:13px;position:relative;transition:.13s;background:var(--surface)}
.doc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.doc .dtop{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
.doc .dic{width:26px;height:26px;border-radius:6px;background:var(--accent-bg);color:var(--accent);
  display:grid;place-items:center;flex:none}
.doc .dic svg{width:14px;height:14px}
.doc .dnm{font-size:12.5px;font-weight:600;line-height:1.3}
.doc .dsub{font-size:11px;color:var(--hint);margin-top:2px}
.doc .dfoot{display:flex;align-items:center;gap:8px;margin-top:10px}
.doc .dfoot .sp{flex:1}
.doc .dact{color:var(--hint);cursor:pointer;display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.doc .dact:hover{background:var(--bg2);color:var(--accent)}
.doc .dact svg{width:14px;height:14px}

/* ---- comment stream ---- */
.ptabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.ptabs button{font:inherit;font-size:12.5px;padding:9px 12px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s}
.ptabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.ctoolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.ctoolbar .sp{flex:1}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
.tgl .track{width:32px;height:18px;border-radius:10px;background:var(--line2);position:relative;transition:.15s;flex:none}
.tgl .track i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);
  transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on .track{background:var(--accent-fill)}
.tgl.on .track i{left:16px}
.cmt{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:none}
.cmt .cbody{flex:1;min-width:0}
.cmt .chd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.cmt .cnm{font-size:12.5px;font-weight:600}
.cmt .crole{font-size:11px;color:var(--hint)}
.cmt .ctime{font-size:11px;color:var(--hint)}
.cmt .ctxt{font-size:12.5px;line-height:1.5;color:var(--muted)}
.cmt .cst{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ---- GL: KPI cards with icon chips ---- */
.kpi-ic{display:flex;align-items:center;gap:13px}
.kpi-chip{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi-chip svg{width:20px;height:20px}
.chip-blue{background:var(--accent-bg);color:var(--accent)}
.chip-green{background:var(--pos-bg);color:var(--pos)}
.chip-purple{background:var(--purple-bg);color:var(--purple)}
.chip-amber{background:var(--warn-bg);color:var(--warn)}
.chip-teal{background:var(--teal-bg);color:var(--teal)}
.delta{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--pos)} .delta.dn{color:var(--neg)}
.gl-hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.gl-hd .grow{flex:1;min-width:220px}
.gl-hd h1{font-size:21px;font-weight:600;letter-spacing:-.02em}
.gl-hd .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.grid2gl{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:18px}
@media(max-width:1100px){.grid2gl{grid-template-columns:1fr}}
.erp-ini{width:22px;height:22px;border-radius:5px;background:var(--bg2);color:var(--muted);
  font-size:8.5px;font-weight:700;display:inline-grid;place-items:center;flex:none;letter-spacing:-.02em}
.cardlink{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;margin-left:auto}
.cardlink:hover{text-decoration:underline}
.cardfoot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--hint)}
.cardfoot .sp{flex:1}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:var(--radius-sm);
  padding:8px 12px;background:var(--surface);flex:1;min-width:180px}
.searchbox svg{width:15px;height:15px;color:var(--hint);flex:none}
.searchbox input{border:none;background:none;font:inherit;font-size:12.5px;color:var(--ink);width:100%;outline:none}
.extlink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;cursor:pointer}
.extlink:hover{text-decoration:underline}
.extlink svg{width:11px;height:11px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px}
.stat .sl{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.stat .sv{font-family:var(--num);font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sd{font-size:11px;color:var(--hint);margin-top:3px}
.spark{width:100%;height:170px}
.progline{display:flex;align-items:center;gap:9px}
.progline .mini-bar{flex:1;min-width:60px}

/* ---- FP&A ---- */
.fp-hd{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.fp-hd .grow{flex:1;min-width:230px}
.fp-hd h1{font-size:21px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.fp-hd .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.infoi{width:14px;height:14px;border-radius:50%;border:1.3px solid var(--faint);color:var(--faint);
  font-size:9px;font-weight:700;display:inline-grid;place-items:center;flex:none;cursor:help}
.selpill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);
  border-radius:var(--radius-sm);padding:8px 11px;font-size:12.5px;color:var(--ink);cursor:pointer;transition:.13s}
.selpill:hover{border-color:var(--accent-line);color:var(--accent)}
.selpill svg{width:14px;height:14px;color:var(--hint);flex:none}
.selpill .cv{color:var(--hint)}
.fpkpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 17px 8px;box-shadow:var(--shadow-sm);overflow:hidden}
.fpkpi .top{display:flex;align-items:flex-start;gap:10px}
.fpkpi .lb{font-size:11.5px;color:var(--muted);font-weight:600}
.fpkpi .vv{font-family:var(--num);font-size:25px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15;margin-top:5px}
.fpkpi .bg{font-size:11.5px;color:var(--hint);margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fpkpi .chip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;margin-left:auto}
.fpkpi .chip svg{width:17px;height:17px}
.fpkpi .spk{display:block;width:calc(100% + 34px);margin:8px -17px -8px;height:44px}
.trend-cell{width:74px;height:22px;display:block}
.alert{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:none}
.alert .aic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.alert .at{font-size:12.5px;font-weight:600;line-height:1.3}
.alert .ad{font-size:11.5px;color:var(--hint);margin-top:2px}
.alert .aw{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap;flex:none}
.grid3fp{display:grid;grid-template-columns:1.25fr 1fr .85fr;gap:16px;align-items:start;margin-bottom:18px}
@media(max-width:1240px){.grid3fp{grid-template-columns:1fr}}
.grid3eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start;margin-bottom:18px}
.grid2fp{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;margin-bottom:18px}
@media(max-width:1100px){.grid2fp{grid-template-columns:1fr}}
.mbar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;min-width:64px;flex:1}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg-pill{display:inline-flex;gap:0;border:1px solid var(--line2);border-radius:var(--radius-sm);overflow:hidden}
.seg-pill button{font:inherit;font-size:12px;padding:7px 14px;border:none;background:var(--surface);
  color:var(--muted);cursor:pointer;transition:.13s;border-right:1px solid var(--line2)}
.seg-pill button:last-child{border-right:none}
.seg-pill button.on{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
.neg{color:var(--neg)} .pos{color:var(--pos)}
/* Grid children default to min-width:auto, so a wide table stops its cell from
   shrinking and pushes the page sideways. Let cells shrink, and let the table
   scroll inside its own card rather than overflowing the viewport. */
.grid3fp>*,.grid3eq>*,.grid2fp>*,.grid2gl>*,.fwork>*,.kpis>*{min-width:0}
.grid3fp>.card,.grid3eq>.card,.grid2fp>.card,.grid2gl>.card,.fwork>.card{overflow-x:auto}
.rpt-detail dt{font-size:11px;color:var(--hint);margin-top:11px}
.rpt-detail dd{font-size:12.5px;font-weight:600;margin-top:2px}




.btn-ghost{font:inherit;font-size:12.5px;font-weight:600;color:var(--accent);background:none;
  border:none;cursor:pointer;padding:8px 12px;border-radius:var(--radius-sm);transition:.13s}
.btn-ghost:hover{background:var(--accent-bg)}
.btn-primary{font:inherit;font-size:12.5px;font-weight:600;color:var(--on-accent);
  background:var(--accent-fill);border:none;cursor:pointer;padding:9px 18px;
  border-radius:var(--radius-sm);transition:.13s}
.btn-primary:hover{filter:brightness(1.08)}
.filterbar-toggle{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:5px}
.filterbar-caret{font-size:10px;color:var(--accent);transition:transform .15s}


/* CIP → PIS workspace */
.cipsub{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:2px}
.cipsub button{font:inherit;font-size:12.5px;font-family:var(--sans);padding:8px 13px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px}
.cipsub button:hover{color:var(--ink);background:var(--surface2)}
.cipsub button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.cipsub button .n{font-size:10px;background:var(--neg-fill);color:var(--on-neg);border-radius:10px;padding:1px 6px;font-weight:700;font-family:var(--num)}
.cipsub button .n.q{background:var(--warn)}
.radar-card{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:9px;cursor:pointer;transition:all .13s;background:var(--surface);box-shadow:var(--shadow-sm)}
.radar-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow-md)}
.radar-card .agecol{flex:none;width:66px;text-align:center}
.radar-card .agecol .big{font-size:23px;font-weight:700;line-height:1;font-family:var(--num);font-variant-numeric:tabular-nums}
.radar-card .agecol .lbl{font-size:9.5px;color:var(--hint);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.radar-card .main{flex:1;min-width:0}
.radar-card .main .nm{font-size:14.5px;font-weight:600}
.radar-card .main .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.radar-card .main .rnote{font-size:11px;color:var(--hint);margin-top:3px}
.radar-card .capcol{flex:none;text-align:right}
.radar-card .capcol .amt{font-size:15px;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums}
.radar-card .capcol .sub{font-size:10.5px;color:var(--hint)}
.evid-check{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px}
.evid-check .box{width:19px;height:19px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.evid-check .box.yes{background:var(--pos-bg);color:var(--pos)}
.evid-check .box.no{background:var(--neg-bg);color:var(--neg)}
.cip-metric{display:inline-flex;flex-direction:column;padding:11px 15px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;margin:0 9px 9px 0;min-width:124px}
.cip-metric .m-l{font-size:10.5px;color:var(--hint);text-transform:uppercase;letter-spacing:.03em}
.cip-metric .m-v{font-size:19px;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums;margin-top:3px}
.capint-panel{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface2);border-radius:10px;padding:13px 15px;margin:0 0 16px}
.capint-hd{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:4px}
.capint-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:6px}

/* ---- capital lifecycle tab ---- */
.cl-rail{display:flex;gap:7px;margin:0 0 16px;flex-wrap:wrap}
.cl-step{flex:1;min-width:104px;display:flex;flex-direction:column;gap:2px;text-align:left;
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface2);cursor:pointer;transition:all .13s;font-family:inherit}
.cl-step:hover{border-color:var(--line2)}
.cl-step.on{border-color:var(--accent);background:var(--accent-bg)}
.cl-step.done{background:var(--surface)}
.cl-step .cl-k{font-size:10.5px;color:var(--hint);font-variant-numeric:tabular-nums}
.cl-step .cl-nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2}
.cl-step.on .cl-nm{color:var(--accent-ink)}
.cl-step .cl-src{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
.cl-detail{border:1px solid var(--line);border-radius:12px;padding:15px 17px;background:var(--surface2);margin-bottom:4px}
.cl-dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.cl-srctag{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:auto}
.cl-dsub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.cl-trig{font-size:12.5px;color:var(--accent-ink);display:flex;align-items:center;gap:6px;margin-bottom:14px}
.cl-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.cl-cols{grid-template-columns:1fr}}
.cl-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin-bottom:6px}
.cl-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.cl-row:last-child{border-bottom:none}
.cl-row .a{color:var(--muted)}
.cl-row .b{font-variant-numeric:tabular-nums;font-weight:600}
.cl-entry{font-family:var(--num);font-size:12px;line-height:1.75;background:var(--surface);border-radius:8px;padding:10px 12px;border-left:2px solid var(--accent)}
.cl-entry.none{color:var(--hint);border-left-color:var(--line2)}
.cl-entry .cr{color:var(--muted);padding-left:18px}
.cl-note{font-size:11.5px;color:var(--hint);margin-top:8px;line-height:1.5}
.flagtext{color:var(--warn);font-weight:600}

/* forecast · cash-flow phasing bars */
.fc-phase{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.fc-qrow{display:flex;align-items:center;gap:12px}
.fc-qlbl{font-size:12px;color:var(--muted);width:52px;flex:none;font-variant-numeric:tabular-nums}
.fc-bar-track{flex:1;height:22px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fc-bar{height:100%;background:var(--accent);border-radius:6px;min-width:2px;transition:width .2s}
.fc-qamt{font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600;width:76px;text-align:right;flex:none}
.sub-detail td{border-bottom:1px solid var(--line)}

/* flux review comments */
.flux-addbtn{font:inherit;font-size:12px;padding:3px 9px;border:1px dashed var(--line2);background:none;color:var(--muted);border-radius:6px;cursor:pointer}
.flux-addbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.flux-addbtn.need{border-color:var(--warn);color:var(--warn)}
.flux-cmt{font-size:12.5px;color:var(--ink);line-height:1.4}
.flux-cmt>span[onclick]{cursor:pointer}
.flux-cmt>span[onclick]:hover{color:var(--accent-ink)}
.flux-cmt.locked{color:var(--muted)}
.flux-cmt .lockmark{font-size:11px}
.flux-meta{font-size:10.5px;color:var(--hint);margin-top:2px}
.flux-lockbtn{font-size:11px;color:var(--accent-ink);cursor:pointer;margin-left:4px;white-space:nowrap}
.flux-edit{display:flex;flex-direction:column;gap:5px}
.flux-period{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.flux-ta{width:100%;min-width:180px;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--ink);resize:vertical;box-sizing:border-box}
.flux-edit-btns{display:flex;gap:6px}
.flux-save{font:inherit;font-size:12px;padding:3px 12px;border:none;border-radius:6px;background:var(--accent-fill);color:var(--on-accent);cursor:pointer}
.flux-cancel{font:inherit;font-size:12px;padding:3px 10px;border:1px solid var(--line2);border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.flux-lockbtn:hover{text-decoration:underline}
.flux-unlock{color:var(--blue);cursor:pointer;margin-left:6px}
.flux-unlock:hover{text-decoration:underline}
.flux-tbl tr.flux-tot td{font-weight:600;border-top:1px solid var(--line2);background:var(--surface2)}
.flux-tbl tr.flux-gl td{font-size:12px;background:var(--bg2);color:var(--muted)}
.flux-status{display:inline-block;margin-left:8px;font-size:11.5px;padding:2px 9px;border-radius:10px;font-weight:600}
.flux-status.ok{background:var(--pos-bg,rgba(30,158,117,.14));color:var(--pos)}
.flux-status.pending{background:var(--warn-bg,rgba(186,117,23,.14));color:var(--warn)}
.fr-disc{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.fr-disc-row{border-left:2px solid var(--accent);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0}
.fr-disc-line{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:2px}
.fr-disc-text{font-size:12.5px;color:var(--muted);line-height:1.5}

/* SEC filing presentation */
.fr-title{font-size:14px;font-weight:600;margin:22px 0 8px;padding-bottom:4px;border-bottom:1.5px solid var(--ink);color:var(--ink)}
.tbl.fr-filing{font-variant-numeric:tabular-nums}
.tbl.fr-filing th.num{text-align:right;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl.fr-filing td{padding:5px 10px;font-size:12.5px}
.tbl.fr-filing td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl.fr-filing tr.fr-bold td{font-weight:600}
.tbl.fr-filing tr.fr-rule td{border-top:1px solid var(--line2)}
.tbl.fr-filing tr.fr-sec td{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:12px}
.tbl.fr-filing tbody tr:nth-of-type(even):not(.fr-sec) td{background:var(--bg2)}
.tbl.fr-filing tbody tr.fr-sec td{background:transparent}
.pipe-allbtn.on{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent)}
.gaap-tag{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent-ink);font-weight:600}

/* ---- lifecycle pipeline board ---- */
.pipeboard{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px}
.pipecol{flex:0 0 210px;min-width:210px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px}
.pipecol-hd{padding:6px 6px 9px;border-bottom:1px solid var(--line);margin-bottom:9px}
.pipecol-hd .st{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.pipecol-hd .sub{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.pipecol-hd .tot{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--num);font-variant-numeric:tabular-nums}
.pipecol-hd .treat{font-size:10.5px;color:var(--hint);margin-top:6px;line-height:1.45;font-style:italic}
.stagedot{width:8px;height:8px;border-radius:50%;flex:none}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.13s}
.pcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.pcard .pn{font-size:13px;font-weight:600}
.pcard .pm{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.pcard .pnote{font-size:10.5px;color:var(--hint);margin-top:5px;line-height:1.4}
.pcard .pcap{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.pipecol.empty{opacity:.55}
.pipecol.empty .pcard-none{font-size:11px;color:var(--hint);text-align:center;padding:14px 4px;font-style:italic}
/* collapsible pipeline hierarchy: Stage → Market → Site */
.pipecol.open{flex:0 0 250px;min-width:250px;background:var(--surface)}
.pipecol-hd.clickable{cursor:pointer;border-radius:8px;margin:-4px -2px 5px;padding:10px 8px 9px;transition:.12s}
.pipecol-hd.clickable:hover{background:var(--bg2)}
.pipecol-hd .tot.rollup{color:var(--ink);font-weight:600;font-size:12px;margin-top:3px}
.pipe-exp{display:inline-block;width:11px;font-size:9px;color:var(--hint);transition:transform .14s;flex:none;transform:rotate(0)}
.pipe-exp.open{transform:rotate(90deg)}
.pipe-exp.ghost{visibility:hidden}
.pipe-exp.sm{font-size:8px;width:10px}
.pipe-allbtn{margin-left:auto;font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:7px;padding:3px 9px;cursor:pointer;transition:.12s}
.pipe-allbtn:hover{background:var(--accent-fill);color:var(--on-accent)}
.pipe-markets{display:flex;flex-direction:column;gap:7px}
.mktgrp{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.mktgrp.open{background:var(--bg2);border-color:var(--line2)}
.mkt-hd{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink)}
.mkt-hd:hover .mkt-name{color:var(--accent)}
.mkt-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-meta{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:10px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:none}
.mkt-roll{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);font-weight:600;margin:3px 0 2px 16px}
.mktgrp.open .pcard{margin-top:7px;margin-bottom:0}
.mktgrp.open .pcard+.pcard{margin-top:7px}
/* PIS table: collapsible Campus → Hall */
.pis-region{cursor:pointer}
.pis-region>td{background:var(--bg2);border-top:1px solid var(--line2);font-size:13px}
.pis-region:hover>td{background:var(--accent-bg)}
.pis-region.open>td{background:var(--accent-bg)}
.pis-region .pipe-exp{margin-right:2px}
.pis-camp{cursor:pointer}
.pis-camp>td{background:var(--surface2);border-top:1px solid var(--line)}
.pis-camp:hover>td{background:var(--bg2)}
.pis-camp.open>td{background:var(--accent-bg)}
.pis-camp .pipe-exp{margin-right:2px}
.pis-camp-name{padding-left:26px !important}
.pis-hcount{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:10px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 7px;margin-left:4px}
.pis-hall>td{background:var(--surface);font-size:12px}
.pis-hall-name{padding-left:50px !important;color:var(--muted);font-weight:500}
.pis-hall:hover>td{background:var(--bg2)}
/* PO tracing: Vendor → PO → invoice */
.po-vendor{cursor:pointer}
.po-vendor>td{background:var(--bg2);border-top:1px solid var(--line2);font-size:13px}
.po-vendor:hover>td{background:var(--accent-bg)}
.po-vendor.open>td{background:var(--accent-bg)}
.po-vendor .pipe-exp{margin-right:2px}
.po-row{cursor:pointer}
.po-row>td{background:var(--surface2);border-top:1px solid var(--line)}
.po-row:hover>td{background:var(--bg2)}
.po-row-name{padding-left:26px !important}
/* Trial balance: Type → Account → JE */
.tb-type{cursor:pointer}
.tb-type>td{background:var(--bg2);border-top:1px solid var(--line2);font-size:13px}
.tb-type:hover>td{background:var(--accent-bg)}
.tb-type.open>td{background:var(--accent-bg)}
.tb-type .pipe-exp{margin-right:2px}
.tb-acct{cursor:pointer}
.tb-acct>td{background:var(--surface2);border-top:1px solid var(--line)}
.tb-acct:hover>td{background:var(--bg2)}
.tb-acct-name{padding-left:26px !important}
/* Top vendors: expandable per-site rows */
.vend-row{cursor:pointer}
.vend-row:hover>td{background:var(--bg2)}
.vend-row.open>td{background:var(--accent-bg)}
.vend-trace{font-size:10px;font-weight:600;color:var(--accent);margin-left:7px;opacity:0;transition:.12s;cursor:pointer;white-space:nowrap}
.vend-row:hover .vend-trace{opacity:1}
.vend-trace:hover{text-decoration:underline}
.vend-site>td{background:var(--surface);font-size:11.5px}
.vend-site-name{padding-left:28px !important;color:var(--muted);font-weight:500}
.vend-site:hover>td{background:var(--bg2)}
.vend-tail{margin-top:9px;font-size:11.5px;color:var(--muted);font-family:var(--num);font-variant-numeric:tabular-nums;padding:7px 10px;background:var(--surface2);border:1px dashed var(--line2);border-radius:8px}
/* vendor category mix */
.catmix{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.catmix-row{display:grid;grid-template-columns:120px 1fr 150px;align-items:center;gap:14px;font-size:12.5px}
.catmix-lbl{display:flex;align-items:center;gap:8px;font-weight:500}
.catmix-lbl .dot{width:9px;height:9px;border-radius:3px;flex:none}
.catmix-track{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}
.catmix-fill{height:100%;border-radius:6px;transition:width .3s}
.catmix-val{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:640px){.catmix-row{grid-template-columns:90px 1fr;gap:8px}.catmix-val{grid-column:2;text-align:left;font-size:11px}}
/* financial reporting statements */
.fr-stmt{margin:6px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fr-sec{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--hint);background:var(--surface2);padding:8px 14px;border-top:1px solid var(--line)}
.fr-sec:first-child{border-top:none}
/* collapsible statement section */
.fr-secgrp{border-top:1px solid var(--line)}
.fr-secgrp:first-child{border-top:none}
.fr-sec-hd{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;background:var(--surface2);transition:.12s}
.fr-sec-hd:hover{background:var(--bg2)}
.fr-secgrp.open .fr-sec-hd{border-bottom:1px solid var(--line)}
.fr-sec-name{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.fr-sec-sub{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--ink)}
.fr-sec-body .fr-row:first-child{border-top:none}
.fr-row{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;font-size:13px;border-top:1px solid var(--line)}
.fr-lbl{color:var(--muted)}
.fr-val{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);white-space:nowrap}
.fr-row.sub{background:var(--surface2);font-weight:600}
.fr-row.sub .fr-lbl{color:var(--ink);font-weight:600}
.fr-row.sub .fr-val{font-weight:700}
.fr-row.tot{background:var(--accent-bg);border-top:1.5px solid var(--accent-line)}
.fr-row.tot .fr-lbl{color:var(--accent-ink);font-weight:700}
.fr-row.tot .fr-val{color:var(--accent-ink);font-weight:700;font-size:14px}
.fr-tie{margin-top:10px;font-size:12px;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--pos);background:var(--pos-bg);border:1px solid var(--pos);border-radius:8px;padding:8px 12px;font-weight:600}
.fr-metrics{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.fr-metric{flex:1;min-width:130px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.frm-k{display:block;font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px}
.frm-v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--accent-ink)}
/* card-level collapse (whole section folds to header + summary) */
.card.folded{padding-bottom:14px}
.card-hd{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:8px;margin:-4px -6px;padding:4px 6px;transition:.12s}
.card-hd:hover{background:var(--bg2)}
.card-fold{display:inline-block;width:12px;font-size:10px;color:var(--hint);transition:transform .14s;flex:none;transform:rotate(0)}
.card-fold.open{transform:rotate(90deg)}
.card-sum{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:3px 11px;white-space:nowrap}
.card.folded .card-hd:hover .card-sum{color:var(--accent);border-color:var(--accent-line)}

/* spine ribbon signature */
.spine-ribbon{display:flex;align-items:stretch;height:6px;border-radius:4px;overflow:hidden;margin-top:2px;min-width:120px;gap:1px}
.spine-ribbon i{flex:1;background:var(--accent);opacity:.28;border-radius:2px;transition:.4s}
.spine-ribbon i.lit{opacity:1}

/* responsive: ribbon wraps on narrow screens */
@media(max-width:860px){
  body{grid-template-columns:1fr;grid-template-areas:"ribbon" "main"}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  /* rail slides over the content instead of taking a column */
  .rail{position:fixed;top:var(--ribbon-h);left:0;width:var(--rail-w-collapsed-off,240px);
        transform:translateX(-100%);transition:transform .18s ease;z-index:22}
  body.nav-open .rail{transform:translateX(0)}
  body.rail-collapsed .rail{--rail-w:240px}
  body.rail-collapsed .rail .railrole{justify-content:flex-start;padding:9px 11px}
  body.rail-collapsed .rail .railrole .lbl{display:inline}
  body.rail-collapsed .rail-grouplbl{opacity:1;height:auto;padding:14px 10px 6px}
  .rail-foot{display:none}
  .menu-btn{display:grid!important}
}
.menu-btn{display:none;width:34px;height:34px;flex:none;border-radius:var(--radius-sm);border:none;
  background:rgba(255,255,255,.08);color:var(--rail-ink);cursor:pointer;place-items:center;margin-right:2px}
.menu-btn:hover{background:rgba(255,255,255,.15);color:#fff}
.menu-btn svg{width:17px;height:17px}
.scrim{position:fixed;inset:0;background:rgba(8,12,19,.5);z-index:18;display:none}
body.nav-open .scrim{display:block}

/* ============================ KORVYN AI COPILOT ============================ */
body.copilot-collapsed{--copilot-w:0px!important}
.copilot{
  grid-area:copilot;
  position:sticky;top:56px;height:calc(100vh - 56px);background:var(--surface-ai);border-left:1px solid var(--line2);
  display:flex;flex-direction:column;overflow:hidden;z-index:16;transition:width .2s}
body.copilot-collapsed .copilot{width:0;border:none}
.cp-head{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.cp-mark{width:24px;height:24px;flex:none;display:grid;place-items:center;border:none;background:none;padding:0;cursor:default;border-radius:7px;transition:.13s}
body.copilot-rail .cp-mark{cursor:pointer;width:34px;height:34px}
body.copilot-full .cp-mark{cursor:pointer}
body.copilot-full .cp-mark:hover{background:var(--accent-bg)}
body.copilot-rail .cp-mark:hover{background:var(--accent-bg)}
body.copilot-rail .cp-mark img{width:22px;height:22px}
.cp-mark img{width:24px;height:24px;display:block}
.cp-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.cp-ground{margin-left:auto;font-size:10px;color:var(--pos);background:var(--pos-bg);padding:3px 8px;border-radius:20px;
  display:flex;align-items:center;gap:4px;font-weight:600}
.cp-collapse{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.13s}
.cp-collapse:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-bg)}

.cp-thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.cp-thread::-webkit-scrollbar{width:7px}.cp-thread::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

.cp-msg-u{align-self:flex-end;max-width:88%;background:var(--accent-fill);color:var(--on-accent);padding:9px 13px;
  border-radius:14px 14px 3px 14px;font-size:13.5px;line-height:1.5;box-shadow:var(--shadow-sm)}
.cp-msg-a{align-self:flex-start;max-width:97%;display:flex;flex-direction:column;gap:9px}
.cp-think{font-size:11.5px;color:var(--hint);display:flex;align-items:center;gap:7px;font-family:var(--mono)}
.cp-think .sp{width:12px;height:12px;border:1.6px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:cpspin .7s linear infinite;flex:none}
@keyframes cpspin{to{transform:rotate(360deg)}}
.cp-think.done .sp{border:none;background:none;color:var(--pos)}
.cp-body{font-family:var(--serif);font-size:14px;line-height:1.62;color:var(--ink)}
.cp-body b{font-family:var(--sans);font-weight:600}
.cp-body .fig{font-family:var(--num);font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.cp-cursor::after{content:"▍";color:var(--accent);animation:blink 1s step-end infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}

/* grounded artifact card in-thread */
.cp-art{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface2)}
.cp-art-h{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line);
  font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cp-art-h .ai-badge{margin-left:auto;font-size:9px;color:var(--accent-ink);background:var(--accent-bg);padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.cp-art table{width:100%;border-collapse:collapse;font-size:12.5px}
.cp-art th{text-align:left;color:var(--hint);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:7px 12px;border-bottom:1px solid var(--line)}
.cp-art td{padding:7px 12px;border-bottom:1px solid var(--line)}
.cp-art tr:last-child td{border-bottom:none}
.cp-art td.n,.cp-art th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.cp-art tfoot td{font-weight:600;border-top:1.5px solid var(--line2);background:var(--surface)}
.cp-recon{padding:11px 13px;font-size:12.5px}
.cp-recon .rr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.cp-recon .rr:last-child{border:none}
.cp-recon .rr .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}
.cp-chart{padding:12px}
.cp-bars{display:flex;align-items:flex-end;gap:7px;height:96px}
.cp-bars .b{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.cp-bars .b.alt{background:var(--accent-2)}
.cp-bars .b .cap{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--muted);font-family:var(--num)}
.cp-xlabels{display:flex;gap:7px;margin-top:5px}.cp-xlabels span{flex:1;text-align:center;font-size:10px;color:var(--hint)}

.cp-cites{font-size:10.5px;color:var(--hint);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cp-cite{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent-line)}
.cp-cite:hover{background:var(--accent-bg);border-radius:3px}
.cp-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:1px}
.cp-act{font-size:11.5px;padding:6px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);
  color:var(--ink);cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:5px}
.cp-act:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-ink)}
.cp-act.pri{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg)}
.cp-hit{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
  cursor:pointer;font-size:12.5px;transition:.12s;background:var(--surface)}
.cp-hit:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.cp-hit .badge{font-size:9px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:2px 6px;border-radius:5px;flex:none}
.cp-hit .amt{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600}

.cp-foot{flex:none;padding:12px 14px;border-top:1px solid var(--line)}
.cp-input{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:11px;padding:9px 12px;background:var(--surface2);transition:.13s}
.cp-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:var(--surface)}
.cp-input input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:13.5px;color:var(--ink)}
.cp-input input::placeholder{color:var(--hint)}
.cp-input .send{width:28px;height:28px;border-radius:7px;border:none;background:var(--accent-fill);color:var(--on-accent);cursor:pointer;display:grid;place-items:center;flex:none;transition:.12s}
.cp-input .send:hover{background:var(--accent-ink)}
.cp-input .kbd{font-size:10px;color:var(--hint);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;font-family:var(--mono)}
.cp-sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.cp-sug{font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
  color:var(--muted);cursor:pointer;transition:.12s}
.cp-sug:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-ink)}

/* floating reopen tab when collapsed */
.cp-reopen{position:fixed;right:20px;bottom:20px;top:auto;z-index:40;display:none;align-items:center;gap:8px;
  background:var(--accent-fill);color:var(--on-accent);border:none;padding:11px 16px;border-radius:24px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(37,99,201,.4),var(--shadow-md)}
body.copilot-collapsed .cp-reopen{display:flex}
.cp-reopen:hover{background:var(--accent-ink);transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,201,.5)}

/* toast when pinning */
.cp-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
