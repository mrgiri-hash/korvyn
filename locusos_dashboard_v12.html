  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;
  z-index:50;transition:.25s;box-shadow:var(--shadow-md);pointer-events:none;display:flex;align-items:center;gap:8px}
.cp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* pinned artifacts strip on views */
.pinned-strip{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.pinned-card{border:1px solid var(--accent-line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm)}
.pinned-card .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent-bg);border-bottom:1px solid var(--accent-line);font-size:12px;font-weight:600;color:var(--accent-ink)}
.pinned-card .ph .unpin{margin-left:auto;cursor:pointer;color:var(--accent-ink);opacity:.6;border:none;background:none;font-size:16px}
.pinned-card .ph .unpin:hover{opacity:1}

@media(max-width:1200px){
  body{grid-template-columns:1fr!important;grid-template-areas:"ribbon" "main"!important}
  .copilot{position:fixed;right:0;top:0;bottom:0;width:380px;box-shadow:var(--shadow-md);transform:translateX(100%);transition:transform .22s;z-index:40}
  body:not(.copilot-collapsed) .copilot{transform:none}
  body.copilot-collapsed{--copilot-w:0px!important}
}
@media(max-width:860px){.copilot{width:100vw;max-width:380px}}

/* ---- NetSuite deep-link chip ---- */
.ns-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--pos-ink);
  background:var(--pos-bg);border:1px solid color-mix(in srgb,var(--pos) 34%,transparent);border-radius:20px;padding:2px 8px 2px 7px;cursor:pointer;
  margin-left:8px;vertical-align:baseline;transition:.12s;white-space:nowrap}
.ns-chip:hover{background:var(--pos);color:var(--on-accent);border-color:var(--pos)}
.ns-chip .ns-id{opacity:.7;font-family:var(--mono);font-size:9.5px}
.ns-chip:hover .ns-id{opacity:.9}

.ns-legend{font-size:11px;color:var(--hint);margin:2px 0 10px;display:inline-flex;align-items:center;gap:6px}

/* ---- back button + drill escape ---- */
.backbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.13s;flex:none}
.backbtn:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent);background:var(--accent-bg)}
.backbtn:disabled{opacity:.4;cursor:default}
.backbtn svg{width:16px;height:16px}

/* ---- copilot header controls ---- */
.cp-head .cp-tool{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.13s;flex:none}
.cp-head .cp-tool:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-bg)}

/* ---- Korvyn AI: redesigned shell ---- */
.cp-status{display:flex;align-items:center;gap:7px;padding:10px 16px;font-size:11.5px;color:var(--muted);
  border-bottom:1px solid var(--line);flex:none}
.cp-status .ok{width:14px;height:14px;color:var(--pos);flex:none}
.cp-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.cp-tabs button{font:inherit;font-size:12.5px;padding:10px 12px;border:none;background:none;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s;display:flex;align-items:center;gap:6px}
.cp-tabs button:hover{color:var(--ink)}
.cp-tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.cp-tabs .ct{font-size:9.5px;font-weight:700;background:var(--accent-bg);color:var(--accent-ink);
  border-radius:9px;padding:1px 6px;line-height:1.5}
.cp-scroll{flex:1;overflow-y:auto;padding:14px 16px}
.cp-scroll::-webkit-scrollbar{width:6px}
.cp-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.cp-hello{background:var(--accent-bg);color:var(--accent-ink);border-radius:10px;padding:12px 14px;
  font-size:12.5px;line-height:1.5;margin-bottom:18px}
.cp-lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint);
  font-weight:700;margin:4px 0 9px;display:flex;align-items:center;gap:6px}
.cp-lbl .sp{flex:1}
.cp-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.13s;
  font:inherit;margin-bottom:8px}
.cp-card:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.cp-card .ci{width:26px;height:26px;border-radius:7px;background:var(--bg2);color:var(--muted);
  display:grid;place-items:center;flex:none}
.cp-card:hover .ci{background:var(--surface);color:var(--accent)}
.cp-card .ci svg{width:14px;height:14px}
.cp-card .cb{flex:1;min-width:0}
.cp-card .ct2{display:block;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3}
.cp-card .cs{display:block;font-size:11px;color:var(--hint);margin-top:2px;line-height:1.3}
.cp-card .cv{width:13px;height:13px;color:var(--faint);flex:none}
.cp-recent{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);padding:8px 2px;text-align:left;transition:.13s;border-radius:6px}
.cp-recent:hover{color:var(--accent)}
.cp-recent .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-recent .rw{font-size:11px;color:var(--faint);flex:none}
.cp-viewall{font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:8px;display:inline-block}
.cp-viewall:hover{text-decoration:underline}
.cp-disc{font-size:10.5px;color:var(--faint);text-align:center;margin-top:8px}
.cp-input .send{border-radius:50%!important;width:30px;height:30px}
/* insights */
.cp-ins{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.13s}
.cp-ins:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.cp-ins .ih{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cp-ins .idot{width:7px;height:7px;border-radius:50%;flex:none}
.cp-ins .it{font-size:12.5px;font-weight:600;line-height:1.3}
.cp-ins .id2{font-size:11.5px;color:var(--hint);line-height:1.45}
/* expanded (full-width) mode */
/* Full screen fills the CONTENT area only. The ribbon and the left rail stay put and
   stay usable, so navigation continues to work with the assistant open. `left` tracks
   --rail-w so the panel follows the rail as it collapses. */
body.copilot-full .copilot{position:fixed;top:var(--ribbon-h);left:var(--rail-w);right:0;bottom:0;
  width:auto!important;height:auto;z-index:25;border-left:1px solid var(--line2);box-shadow:none}
body.copilot-full .cp-resize{display:none}
body.copilot-full .cp-scroll,body.copilot-full .cp-foot{max-width:900px;margin:0 auto;width:100%}
body.copilot-full .cp-head,body.copilot-full .cp-status,body.copilot-full .cp-tabs{
  padding-left:26px;padding-right:26px}
/* below the grid breakpoint the rail is off-canvas, so reclaim its width */
@media(max-width:1200px){ body.copilot-full .copilot{left:0} }

/* ---- Korvyn AI: collapsed icon rail (mirrors the left nav) ---- */

/* drag handle: sits on the panel's leading edge */
/* Straddles the panel edge so it is easy to grab from either side, with a visible grip. */
.cp-resize{position:absolute;left:-5px;top:0;bottom:0;width:11px;cursor:col-resize;z-index:25;
  background:transparent;display:flex;align-items:center;justify-content:center}
.cp-resize::before{content:'';width:3px;height:38px;border-radius:2px;background:var(--line2);
  opacity:0;transition:opacity .13s,background .13s}
.cp-resize:hover::before,body.cp-resizing .cp-resize::before{opacity:1;background:var(--accent)}
body.cp-resizing{cursor:col-resize;user-select:none}
body.cp-resizing .copilot{transition:none}
body.copilot-collapsed .cp-resize{display:none}
body.copilot-rail .cp-resize{left:-6px;width:12px}
body.copilot-rail .cp-resize::before{opacity:.55;background:var(--line2)}
.copilot{position:sticky}
body.copilot-rail{--copilot-w:56px!important}
body.copilot-rail .cp-status,
body.copilot-rail .cp-tabs,
body.copilot-rail .cp-scroll,
body.copilot-rail .cp-saved,
body.copilot-rail .cp-foot,
body.copilot-rail .cp-title,
body.copilot-rail .cp-head .cp-tool{display:none}
body.copilot-rail .cp-head{padding:14px 0;justify-content:center;border-bottom:1px solid var(--line)}
body.copilot-rail .cp-strip{display:flex}
.cp-strip{display:none;flex-direction:column;align-items:center;gap:4px;padding:10px 0;flex:1}
.cp-sbtn{width:38px;height:38px;border-radius:10px;border:none;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;position:relative;transition:.13s}
.cp-sbtn:hover{background:var(--accent-bg);color:var(--accent)}
.cp-sbtn.on{background:var(--accent-bg);color:var(--accent)}
.cp-sbtn svg{width:17px;height:17px}
.cp-sbtn .sb{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--neg-fill);color:var(--on-neg);font-size:8.5px;font-weight:700;display:grid;place-items:center;line-height:1}
/* collapse control, styled like the rail's */
.cp-collapse-foot{flex:none;border-top:1px solid var(--line);padding:8px 10px}
.cp-collapse-btn{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  color:var(--hint);font:inherit;font-size:11.5px;padding:8px 11px;border-radius:var(--radius-sm);transition:.13s}
.cp-collapse-btn:hover{background:var(--bg2);color:var(--muted)}
.cp-collapse-btn svg{width:15px;height:15px;flex:none;transition:transform .16s}
body.copilot-rail .cp-collapse-btn{justify-content:center;padding:8px 0}
body.copilot-rail .cp-collapse-btn .lbl{display:none}
body.copilot-rail .cp-collapse-btn svg{transform:rotate(180deg)}
/* a rail-width panel must not also be pushed off-canvas on narrow screens */
@media(max-width:1200px){ body.copilot-rail .copilot{width:56px} }

/* floating launcher */
.cp-reopen{position:fixed;right:20px;bottom:20px;top:auto;z-index:40;display:none;align-items:center;gap:0;
  background:none;border:none;padding:0;cursor:pointer;font:inherit}
body.copilot-collapsed .cp-reopen{display:flex}
/* Launcher: the brand ring on the dark surface rather than a generic gradient blob.
   The label is part of the resting state, so it reads as a control, not an orb. */
/* One pill, one border, one radius. The label and mark are borderless children so
   there is no seam where they meet. */
.cp-reopen{gap:0;align-items:stretch;height:34px;background:var(--rail);border:1px solid rgba(255,255,255,.11);
  border-radius:18px;box-shadow:0 2px 12px rgba(8,12,19,.30);overflow:hidden;transition:.18s}
.cp-reopen:hover{border-color:rgba(120,190,255,.36);box-shadow:0 5px 18px rgba(8,12,19,.40)}
.cp-fabl{color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.01em;
  padding:0 11px 0 15px;white-space:nowrap;display:flex;align-items:center;background:none;border:none}
.cp-fabb{width:34px;display:grid;place-items:center;flex:none;background:none;border:none;
  position:relative;transition:.18s}
.cp-fabb::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;
  background:rgba(255,255,255,.10)}
.cp-fabb img{width:15px;height:15px;display:block;transition:.18s}
.cp-reopen:hover .cp-fabb img{transform:scale(1.09)}
.cp-fabb .ai{display:none}
/* per-card Ask AI affordance */
.kpi .spk{display:block;width:calc(100% + 36px);margin:10px -18px 0;height:38px}
.askai{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--accent);
  cursor:pointer;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);width:100%}
.askai:hover{color:var(--accent-ink)}
.askai svg{width:12px;height:12px}

.cp-head .cp-tool svg{width:14px;height:14px}
.cp-head .cp-tool.on{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.cp-menu{position:relative}
.cp-drop{position:absolute;right:0;top:32px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;
  box-shadow:var(--shadow-md);padding:5px;min-width:210px;z-index:30;display:none}
.cp-drop.show{display:block}
.cp-drop button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);padding:8px 10px;border-radius:7px;text-align:left;transition:.1s}
.cp-drop button:hover{background:var(--bg2)}
.cp-drop button svg{width:14px;height:14px;flex:none;color:var(--muted)}
.cp-drop button.danger{color:var(--neg)}.cp-drop button.danger svg{color:var(--neg)}
.cp-drop .sep{height:1px;background:var(--line);margin:4px 6px}
.cp-drop .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);padding:6px 10px 3px;font-weight:600}

/* ---- per-message star + saved views ---- */
.cp-msg-a{position:relative}
.cp-star{position:absolute;top:-2px;right:-2px;width:22px;height:22px;border-radius:6px;border:none;background:none;
  cursor:pointer;color:var(--faint);display:grid;place-items:center;opacity:0;transition:.13s}
.cp-msg-a:hover .cp-star{opacity:1}
.cp-star:hover{color:var(--warn);background:var(--warn-bg)}
.cp-star.on{opacity:1;color:var(--warn)}
.cp-star svg{width:14px;height:14px}

.cp-saved{border-bottom:1px solid var(--line);background:var(--surface2);padding:0;overflow:hidden;max-height:0;transition:max-height .2s}
.cp-saved.show{max-height:320px;overflow-y:auto}
.cp-saved-in{padding:10px 14px}
.cp-saved h4{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--hint);font-weight:600;margin:6px 0 8px;display:flex;align-items:center;justify-content:space-between}
.cp-saved h4 .x{cursor:pointer;color:var(--hint);font-size:14px}
.cp-saved-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);margin-bottom:6px;font-size:12.5px;cursor:pointer;transition:.12s}
.cp-saved-item:hover{border-color:var(--accent-line);background:var(--accent-bg)}
.cp-saved-item .meta{margin-left:auto;font-size:10.5px;color:var(--hint)}
.cp-saved-item .del{color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px}
.cp-saved-item .del:hover{color:var(--neg)}
.cp-saved-empty{font-size:11.5px;color:var(--hint);font-style:italic;padding:6px 2px}
.cp-savedmsg{border-left:2px solid var(--warn);padding-left:10px;margin-bottom:8px}
.cp-savedmsg .sm-body{font-family:var(--serif);font-size:12.5px;color:var(--muted);line-height:1.5}

</style>
</head>

function invoicesForTx(r,idx){
  const i=r[IDX.incurred], p=r[IDX.paid];
  const n=2+(idx%2);  // 2 or 3 invoices
  const invs=[]; let remI=i, remP=p;
  for(let k=0;k<n;k++){
    const share=k===n-1?remI:+(i/n).toFixed(1);
    const pd=Math.min(share,remP); remP-=pd; remI-=share;
    const acct=CAT_META[txCat(r)].acct;
    invs.push({ inv:'INV-'+(9000+idx*10+k), amt:+share.toFixed(1), paid:+pd.toFixed(1),

      status: pd>=share-0.001?'paid' : pd>0?'part' : 'unpaid' });
  }
  return invs;
}

// group halls by campus, rolling up CIP, depreciating basis, and carve progress
function hallsByCampus(hs){
  const m={};
  hs.forEach(h=>{ (m[h.campus]=m[h.campus]||[]).push(h); });
  const order={service:0,ready:1,build:2};
  return Object.entries(m).map(([campus,halls])=>{
    const pool=halls.reduce((a,h)=>a+h.cip,0);
    const dep=halls.filter(h=>h.status==='service').reduce((a,h)=>a+h.cip,0);
    const ready=halls.filter(h=>h.status==='ready').reduce((a,h)=>a+h.cip,0);
    return {campus, region:halls[0].region,
      halls:halls.slice().sort((a,b)=>(order[a.status]-order[b.status])|| b.cip-a.cip),
      pool, dep, ready, inCip:pool-dep,
      carvedPct: pool>0?Math.round(dep/pool*100):0};
  }).sort((a,b)=> b.pool-a.pool);
}

// group a stage's properties by market, sorted by capital desc within/among markets
function propsByMarket(props){
  const m={};
  props.forEach(p=>{ (m[p.market]=m[p.market]||[]).push(p); });
  return Object.entries(m)
    .map(([market,sites])=>({
      market, sites: sites.slice().sort((a,b)=>b.capital-a.capital),
      capital: sites.reduce((a,s)=>a+s.capital,0),
      mw: sites.reduce((a,s)=>a+s.mw,0),
    }))
    .sort((a,b)=> b.capital-a.capital || b.sites.length-a.sites.length);
}

// derive per-line loaded cost + capitalized amount
function capLaborRows(){
  const projName={}; CIP_PROJECTS.forEach(p=>projName[p.id]=p.name);
  return CAPLABOR
    .filter(l=>F.region==='all'||l.region===F.region)
    .map(l=>{
      const loaded=+(l.hours*l.rate/1000*1000).toFixed(2); // hours*rate already $ thousands→keep $M scale
      const cost=+(l.hours/1000*l.rate).toFixed(2);        // $M loaded cost
      const cap=+(cost*l.capPct).toFixed(2);               // capitalized portion
      const exp=+(cost-cap).toFixed(2);                    // expensed portion
      return {...l, projectName:projName[l.project]||l.project, cost, cap, exp};
    });
}
function capLaborByRegion(rows){
  const REG_ORDER=['Americas','EMEA','APAC'];
  const m={};
  rows.forEach(r=>{ (m[r.region]=m[r.region]||[]).push(r); });
  return Object.keys(m).sort((a,b)=>{
    const ia=REG_ORDER.indexOf(a),ib=REG_ORDER.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);
  }).map(region=>{
    const lines=m[region];
    // group region's lines by project
    const pm={};
    lines.forEach(l=>{ (pm[l.project]=pm[l.project]||[]).push(l); });
    const projects=Object.entries(pm).map(([pid,ls])=>({
      project:pid, name:ls[0].projectName, lines:ls.slice().sort((a,b)=>b.cap-a.cap),
      cost:ls.reduce((a,x)=>a+x.cost,0), cap:ls.reduce((a,x)=>a+x.cap,0), exp:ls.reduce((a,x)=>a+x.exp,0),
    })).sort((a,b)=>b.cap-a.cap);
    return {region, projects,
      cost:lines.reduce((a,x)=>a+x.cost,0), cap:lines.reduce((a,x)=>a+x.cap,0), exp:lines.reduce((a,x)=>a+x.exp,0),
      lineCount:lines.length};
  });
}

let capRegionOpen={}, capProjectOpen={};

function expandAllCapLabor(open){
  const rows=capLaborRows();
  capLaborByRegion(rows).forEach(rg=>{ capRegionOpen[rg.region]=open; rg.projects.forEach(p=>{ capProjectOpen[p.project]=open; }); });

}
function renderCapLabor(){
  const el=$('view-caplabor'); if(!el)return;
  const rows=capLaborRows();
  const regions=capLaborByRegion(rows);
  const totCost=rows.reduce((a,r)=>a+r.cost,0);
  const totCap=rows.reduce((a,r)=>a+r.cap,0);
  const totExp=rows.reduce((a,r)=>a+r.exp,0);
  const capRate=totCost>0?totCap/totCost*100:0;
  // department mix
  const byDept={};
  rows.forEach(r=>{ byDept[r.dept]=(byDept[r.dept]||0)+r.cap; });
  const anyOpen=regions.some(rg=>capRegionOpen[rg.region]);

  let h=`<div class="kpis">
    <div class="kpi lenshi"><div class="k">Capitalized labor</div><div class="v">${money0(totCap)}</div><div class="d">to CIP / software this period</div><div class="lenstag">▸ Fixed Assets · internal payroll</div></div>
    <div class="kpi"><div class="k">Loaded labor cost</div><div class="v">${money0(totCost)}</div><div class="d">${rows.length} team-charges</div></div>
    <div class="kpi ${capRate>90?'warn':''}"><div class="k">Capitalization rate</div><div class="v">${pct(capRate)}</div><div class="d">${capRate>90?'high — review support':'of loaded cost'}</div></div>
    <div class="kpi"><div class="k">Expensed portion</div><div class="v">${money0(totExp)}</div><div class="d">preliminary / non-attributable</div></div>
  </div>`;

  // department / standard mix
  h+=`<div class="card"><h2>Capitalized labor by standard<span class="note">what's being capitalized, and under which rule</span></h2>
    <div class="subhead">Capitalized labor is one of the most scrutinized fixed-asset judgments: internal-use software follows ASC 350-40 (only the application-development stage capitalizes), while construction supervision and owner engineering follow ASC 360 (directly attributable cost of readying the asset). The split below is the first thing an auditor tests.</div>
    <div class="catmix">`;
  Object.entries(byDept).sort((a,b)=>b[1]-a[1]).forEach(([d,v])=>{
    const std=CAPLABOR_STD[d]; const share=totCap>0?v/totCap*100:0;
    const col={software:'var(--accent-2)',construction:'var(--accent)',engineering:'var(--pos)'}[d]||'var(--neu)';
    h+=`<div class="catmix-row">
      <span class="catmix-lbl"><span class="dot" style="background:${col}"></span>${std?std.label:d}</span>
      <div class="catmix-track"><div class="catmix-fill" style="width:${Math.max(2,share)}%;background:${col}"></div></div>
      <span class="catmix-val">${money(v)} <span style="color:var(--hint)">· ${std?std.asc:''}</span></span></div>`;
  });
  h+=`</div></div>`;

  // Region → Project → line table
  h+=`<div class="card"><h2>Capitalized labor detail<span class="note">Region → Project → team · loaded cost, capitalized %, basis</span>
      <button class="pipe-allbtn" onclick="expandAllCapLabor(${anyOpen?'false':'true'})">${anyOpen?'Collapse all':'Expand all'}</button></h2>
    <div class="subhead">${regions.length} regions · ${rows.length} team-charges in scope — folded to region rollups; expand a region to its projects, and a project to each team's capitalized time.</div>
    <table class="tbl caplabor-tbl"><thead><tr><th>Region / project / team</th><th>Basis</th><th class="num">Loaded cost</th><th class="num">Cap %</th><th class="num">Capitalized</th><th class="num">Expensed</th></tr></thead><tbody>`;
  regions.forEach(rg=>{
    const ropen=!!capRegionOpen[rg.region];
    const rRate=rg.cost>0?rg.cap/rg.cost*100:0;
    h+=`<tr class="pis-region${ropen?' open':''}" onclick="toggleCapRegion('${rg.region}')">
      <td><span class="pipe-exp ${ropen?'open':''}">▸</span> <b>${rg.region}</b> <span class="pis-hcount">${rg.projects.length} projects · ${rg.lineCount} charges</span></td>
      <td></td>
      <td class="num">${money(rg.cost)}</td>
      <td class="num">${pct(rRate)}</td>
      <td class="num cell-i">${money(rg.cap)}</td>
      <td class="num" style="color:var(--muted)">${money(rg.exp)}</td></tr>`;
    if(!ropen) return;
    rg.projects.forEach(p=>{
      const popen=!!capProjectOpen[p.project];
      const pRate=p.cost>0?p.cap/p.cost*100:0;
      h+=`<tr class="pis-camp${popen?' open':''}" onclick="event.stopPropagation();toggleCapProject('${p.project}')">
        <td class="pis-camp-name"><span class="pipe-exp sm ${popen?'open':''}">▸</span> <b>${p.name}</b> <span class="pis-hcount">${p.lines.length} team${p.lines.length>1?'s':''}</span></td>
        <td></td>
        <td class="num">${money(p.cost)}</td>
        <td class="num">${pct(pRate)}</td>
        <td class="num cell-i">${money(p.cap)}</td>
        <td class="num" style="color:var(--muted)">${money(p.exp)}</td></tr>`;
      if(popen){
        p.lines.forEach(l=>{
          const std=CAPLABOR_STD[l.dept];
          h+=`<tr class="pis-hall"><td class="pis-hall-name">${l.team} <span style="color:var(--hint);font-size:10px">· ${l.hours.toLocaleString()} hrs</span></td>
            <td><span class="pill sm ${l.dept==='software'?'info':l.dept==='construction'?'good':'warn'}">${std?std.asc:l.dept}</span></td>
            <td class="num">${money(l.cost)}</td>
            <td class="num">${pct(l.capPct*100)}</td>
            <td class="num cell-i">${money(l.cap)}</td>
            <td class="num" style="color:var(--muted)">${money(l.exp)}</td></tr>`;
        });
      }
    });
  });
  h+=`</tbody><tfoot><tr><td>Total</td><td></td><td class="num">${money(totCost)}</td><td class="num">${pct(capRate)}</td><td class="num cell-i">${money(totCap)}</td><td class="num">${money(totExp)}</td></tr></tfoot></table>
    <div class="note">Capitalized labor flows into the CIP pool (ASC 360) or the software asset (ASC 350-40), then carves and depreciates with the rest of the project. A capitalization rate that drifts high is an audit flag — it suggests preliminary-stage or non-attributable time is being capitalized. This is the long-term home for time-tracking integration, rate substantiation, and the quarterly cap-rate review.</div></div>`;
  el.innerHTML=h;
}

// ============================================================ FILTER STATE
// Period model: periodType ∈ {itd, ytd, quarter, month}; periodVal names the specific
// quarter or month when applicable. The selected window is a set of months; every
// measure is summed over just those months, so month/quarter views are real windows.
const F={fund:'all',region:'all',own:'all',periodType:'itd',periodVal:null,ccy:'usd'};
const FY26_MONTHS=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];
function readFilters(){
  F.fund=$('fundScope').value; F.region=$('regionScope').value; F.own=$('ownType').value;
  F.periodType=$('periodType').value; F.periodVal=$('periodVal').value; F.ccy=$('ccyMode').dataset.v||'usd';
}
// which months are in scope for the current period selection
function windowMonths(){
  if(F.periodType==='itd')return MONTHS.slice();
  if(F.periodType==='ytd')return FY26_MONTHS.slice();
  if(F.periodType==='quarter')return (Q_MONTHS[F.periodVal]||[]).slice();
  if(F.periodType==='month')return F.periodVal?[F.periodVal]:[];
  return MONTHS.slice();
}
function periodLabel(){
  if(F.periodType==='itd')return 'inception-to-date';
  if(F.periodType==='ytd')return 'FY26 year-to-date';
  if(F.periodType==='quarter')return F.periodVal||'quarter';
  if(F.periodType==='month')return MONTH_LABEL[F.periodVal]||'month';
  return '';
}
function conv(v,ccy){ return F.ccy==='local'?v:v*(FX[ccy]||1); }
function ccyTag(){ return F.ccy==='local'?' (local)':' USD'; }
function ownMatch(site){ if(F.own==='all')return true; return siteOwn(site).type===F.own; }
function scoped(){
  return TX.filter(r=>
    (F.fund==='all'||r[IDX.fund]===F.fund) &&
    (F.region==='all'||r[IDX.region]===F.region) &&
    ownMatch(r[IDX.site]) );
}
// period-aware sum: sum monthly spread over the window's months, converted to display ccy
function sum(rows,measure){
  const wm=windowMonths();
  return rows.reduce((a,r)=>{
    let v=0; wm.forEach(m=>{ v+=monthVal(r,measure,m); });
    return a+conv(v,r[IDX.ccy]);
  },0);
}
// populate the period-value dropdown based on type
function onPeriodType(){
  const t=$('periodType').value, grp=$('periodValGrp'), sel=$('periodVal'), lab=$('periodValLabel');
  if(t==='quarter'){ grp.style.display=''; lab.textContent='Quarter';
    sel.innerHTML=QUARTERS.map(q=>`<option value="${q}">${q}</option>`).join(''); sel.value='2026-Q2'; }
  else if(t==='month'){ grp.style.display=''; lab.textContent='Month';
    sel.innerHTML=MONTHS.map(m=>`<option value="${m}">${MONTH_LABEL[m]}</option>`).join(''); sel.value='2026-06'; }
  else { grp.style.display='none'; sel.innerHTML=''; }
  renderAll();
}

// ============================================================ SHARED CALCS
function portfolio(){
  const rows=scoped();
  const committed=sum(rows,'committed'), incurred=sum(rows,'incurred'), paid=sum(rows,'paid');
  const budget=incurred*1.51; // illustrative budget anchor
  const openCommit=committed-incurred;
  // ceiling test legs (illustrative but reconciling): GL = paid + accruals + timing
  const accruals=+(incurred-paid).toFixed(1)*0.82;
  const timing=+(incurred-paid-accruals).toFixed(1);
  const residual=+(incurred-paid-accruals-timing).toFixed(1);
  return {rows,committed,incurred,paid,budget,openCommit,accruals,timing,residual};
}

// FP&A budget-vs-actual expand state (region and region|category keys)
let fpaExpand={};
function toggleFpa(k){ fpaExpand[k]=!fpaExpand[k]; renderBudget(); }
function expandAllBudget(open){
  if(!open){ fpaExpand={}; renderBudget(); return; }
  const P=portfolio();
  if(budgetGroupBy==='gl'){
    acctsInUse(P.rows).forEach(acct=>{ fpaExpand['acct|'+acct]=true; });
  } else {
    [...new Set(P.rows.map(r=>r[IDX.region]))].forEach(rg=>{ fpaExpand['reg|'+rg]=true; });
  }
  renderBudget();
}
let budgetGroupBy='gl';  // 'gl' (GL account first — default for FP&A review) or 'region'
function setBudgetGroup(g){ budgetGroupBy=g; fpaExpand={}; renderBudget(); }

// ============================================================ BUDGET VS. ACTUAL (own tab)
// Two grouping modes. Default 'gl' = GL account → category → region → PO (the FP&A review grain).
// 'region' = region → category → PO (the earlier view). Numbers tie under both by construction.
// ============================================================ FORECAST & SCENARIOS
// Forward-looking capital FP&A: estimate-at-completion (EAC), scenario cases that flex
// the forecast-to-complete via cost-pressure / contingency drivers, and cash-flow phasing.
// Data illustrative; a real build feeds forecast-to-complete from Procore/Adaptive.
let fcScenario='base';   // base | downside | board
let fcHorizon='quarter'; // phasing grain
function setFcScenario(s){ fcScenario=s; renderForecast(); }
function toggleFcProj(id){ fcProjOpen[id]=!fcProjOpen[id]; renderForecast(); }
let fcProjOpen={};

// scenario drivers applied to remaining forecast-to-complete (FTC) and contingency draw
const FC_SCENARIOS={
  base:    {label:'Base case',    ftcMult:1.00, contingency:0.05, note:'Approved plan · 5% contingency · vendor pricing holds.'},
  downside:{label:'Downside',     ftcMult:1.12, contingency:0.12, note:'12% cost pressure · 12% contingency draw · schedule slip on M&E/power.'},
  board:   {label:'Board (stress)',ftcMult:1.20, contingency:0.15, note:'20% cost pressure · full contingency · used for board sensitivity & covenant headroom.'},
};

// illustrative project book (amounts $M). ftc = base forecast-to-complete before scenario.
const FC_PROJECTS=[
  {id:'dc04',name:'Meridian DC-04', region:'Americas', budget:120.0, incurred:61.2, committedOpen:27.2, ftc:34.6, phase:[8,11,9,6]},
  {id:'dc02',name:'Aurora DC-02',   region:'Americas', budget:86.0,  incurred:69.2, committedOpen:9.1,  ftc:8.4,  phase:[5,3,1,0]},
  {id:'dub1',name:'Dublin DUB-01',  region:'EMEA',     budget:64.0,  incurred:22.8, committedOpen:18.4, ftc:23.1, phase:[6,7,6,4]},
  {id:'sng2',name:'Singapore SG-02',region:'APAC',     budget:48.0,  incurred:9.4,  committedOpen:11.2, ftc:29.8, phase:[4,7,9,9]},
];
const FC_QLABELS=['Q3 26','Q4 26','Q1 27','Q2 27'];

function renderForecast(){
  const el=$('view-forecast'); if(!el)return;
  const sc=FC_SCENARIOS[fcScenario];
  // per-project EAC under the selected scenario
  const rows=FC_PROJECTS.map(p=>{
    const ftcScen=p.ftc*sc.ftcMult;
    const contingency=(p.incurred+p.committedOpen+ftcScen)*sc.contingency;
    const eac=p.incurred+p.committedOpen+ftcScen+contingency;
    const vac=p.budget-eac;                    // variance at completion (+ = under)
    const pctC=p.budget>0?p.incurred/p.budget*100:0;
    return {...p, ftcScen, contingency, eac, vac, pctC};
  });
  const T=k=>rows.reduce((a,r)=>a+r[k],0);
  const tBudget=T('budget'), tInc=T('incurred'), tEac=T('eac'), tVac=tBudget-tEac, tOpen=T('committedOpen'), tFtc=T('ftcScen');

  // portfolio KPIs — forward-looking
  let h=`<div class="kpis">
    <div class="kpi lenshi"><div class="k">Estimate at completion</div><div class="v">${money0(tEac)}</div><div class="d">${fcScenario==='base'?'approved plan':sc.label.toLowerCase()} · vs ${money0(tBudget)} budget</div><div class="lenstag">▸ FP&A headline</div></div>
    <div class="kpi ${tVac>=0?'good':'flag'}"><div class="k">Variance at completion</div><div class="v">${money0(tVac)}</div><div class="d">${tVac>=0?'projected under budget':'projected overrun'}</div></div>
    <div class="kpi"><div class="k">Forecast to complete</div><div class="v">${money0(tFtc)}</div><div class="d">remaining spend to finish</div></div>
    <div class="kpi warn"><div class="k">Open commitment</div><div class="v">${money0(tOpen)}</div><div class="d">signed up, not yet incurred</div></div>
  </div>`;

  // scenario selector
  h+=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">Estimate at completion<span class="note">budget → incurred → open commitment → forecast-to-complete → EAC → variance at completion</span></h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em">Scenario</span>
        <div class="seg">`+Object.keys(FC_SCENARIOS).map(k=>
          `<button class="${fcScenario===k?'on':''}" onclick="setFcScenario('${k}')">${FC_SCENARIOS[k].label}</button>`).join('')+`</div>
      </div></div>
    <div class="subhead">EAC = incurred to date + open commitment + forecast-to-complete + contingency. The scenario flexes forecast-to-complete and contingency draw, so you see where the portfolio lands — not just where it's been. ${sc.note}</div>
    <table class="tbl"><thead><tr><th>Project</th><th class="num">Budget</th><th class="num">Incurred</th><th class="num">Open commit.</th><th class="num">FTC</th><th class="num">Contingency</th><th class="num">EAC</th><th class="num">VAC</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const over=r.vac<0;
    h+=`<tr class="row-click" onclick="toggleFcProj('${r.id}')">
      <td><span class="expander ${fcProjOpen[r.id]?'open':''}">▸</span> <b>${r.name}</b> <span style="color:var(--hint);font-size:11px">${r.region}</span></td>
      <td class="num">${money(r.budget)}</td>
      <td class="num">${money(r.incurred)}</td>
      <td class="num">${money(r.committedOpen)}</td>
      <td class="num">${money(r.ftcScen)}</td>
      <td class="num">${money(r.contingency)}</td>
      <td class="num"><b>${money(r.eac)}</b></td>
      <td class="num" style="color:${over?'var(--neg)':'var(--pos)'}">${over?'('+money(-r.vac)+')':money(r.vac)}</td></tr>`;
    if(fcProjOpen[r.id]){
      h+=`<tr class="sub-detail"><td colspan="8" style="background:var(--surface2);font-size:12px;padding:10px 14px;color:var(--muted)">
        <b>${r.name}</b> — ${pct(r.pctC)} of budget incurred. At ${sc.label.toLowerCase()}, forecast-to-complete is ${money(r.ftcScen)} (base ${money(r.ftc)} × ${sc.ftcMult.toFixed(2)}) plus ${money(r.contingency)} contingency. Completion estimate ${money(r.eac)} lands ${over?`<span style="color:var(--neg)">${money(-r.vac)} over budget — flag for reforecast</span>`:`<span style="color:var(--pos)">${money(r.vac)} under budget</span>`}. Cash-flow phasing below.
      </td></tr>`;
    }
  });
  h+=`</tbody><tfoot><tr><td>Portfolio</td><td class="num">${money(tBudget)}</td><td class="num">${money(tInc)}</td><td class="num">${money(tOpen)}</td><td class="num">${money(tFtc)}</td><td class="num">${money(T('contingency'))}</td><td class="num"><b>${money(tEac)}</b></td><td class="num" style="color:${tVac<0?'var(--neg)':'var(--pos)'}">${tVac<0?'('+money(-tVac)+')':money(tVac)}</td></tr></tfoot></table>
    <div class="note">Variance at completion is the number FP&A defends to the board — a projected overrun surfaced now, while there's still forecast-to-complete to manage, not after the money is spent. Switch scenarios to test covenant headroom and contingency adequacy.</div></div>`;

  // ---- cash-flow phasing ----
  const phaseTotals=FC_QLABELS.map((_,qi)=> rows.reduce((a,r)=>{
    const base=r.phase[qi]||0; return a+base*sc.ftcMult;
  },0));
  const maxPh=Math.max(...phaseTotals,1);
  h+=`<div class="card"><h2>Cash-flow phasing<span class="note">projected capital outflow over the next four quarters · ${sc.label.toLowerCase()}</span></h2>
    <div class="subhead">When the forecast-to-complete actually lands as cash — the view treasury and the board need for funding and covenant timing. Bars scale with the scenario.</div>
    <div class="fc-phase">`;
  FC_QLABELS.forEach((q,qi)=>{
    const v=phaseTotals[qi], w=v/maxPh*100;
    h+=`<div class="fc-qrow"><span class="fc-qlbl">${q}</span>
      <div class="fc-bar-track"><div class="fc-bar" style="width:${w}%"></div></div>
      <span class="fc-qamt">${money(v)}</span></div>`;
  });
  h+=`</div><div class="note" style="margin-top:10px">Total forecast outflow ${money(phaseTotals.reduce((a,b)=>a+b,0))} across the horizon. Front-loaded quarters (Shell, early fit-out) carry the most; M&E/power phases push later. A real build phases each project's forecast-to-complete from its Procore schedule.</div></div>`;

  el.innerHTML=h;
}

function renderBudget(){
  const P=portfolio(), el=$('view-budget');
  // helper: a budget/actual line for an arbitrary set of rows, grouping by category within
  function measure(rows){ return {com:sum(rows,'committed'), inc:sum(rows,'incurred')}; }
  function catBud(rows,cat){ // budget for a category across given rows, summing region×cat anchors
    const byReg=[...new Set(rows.map(r=>r[IDX.region]))];
    return byReg.reduce((a,rg)=>{ const crs=rows.filter(r=>r[IDX.region]===rg&&txCat(r)===cat); return a+catBudget(rg,cat,sum(crs,'incurred')); },0);
  }

  // portfolio KPI strip (same under both groupings)
  let gBud=0,gCom=0,gInc=0;
  [...new Set(P.rows.map(r=>r[IDX.region]))].forEach(rg=>{ const rs=P.rows.filter(r=>r[IDX.region]===rg);
    [...new Set(rs.map(txCat))].forEach(cat=>{ const crs=rs.filter(r=>txCat(r)===cat);
      const inc=sum(crs,'incurred'); gBud+=catBudget(rg,cat,inc); gInc+=inc; gCom+=sum(crs,'committed'); }); });
  const gVar=gBud-gInc, gCons=gBud>0?gInc/gBud*100:0;
  let h=`<div class="kpis">
    <div class="kpi lenshi"><div class="k">Budget</div><div class="v">${money0(gBud)}</div><div class="d">at region × GL-category grain</div><div class="lenstag">▸ FP&A headline</div></div>
    <div class="kpi"><div class="k">Incurred (actual)</div><div class="v">${money0(gInc)}</div><div class="d">${pct(gCons)} of budget used</div></div>
    <div class="kpi ${gVar>=0?'good':'flag'}"><div class="k">Variance to budget</div><div class="v">${money0(gVar)}</div><div class="d">${gVar>=0?'budget remaining':'over budget'}</div></div>
    <div class="kpi warn"><div class="k">Open commitment</div><div class="v">${money0(gCom-gInc)}</div><div class="d">forecast risk — signed up, not billed</div></div>
  </div>`;

  const groupLabel=budgetGroupBy==='gl'?'GL account':'Region';
  h+=`<div class="card">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">Budget vs. actual<span class="note">variance by ${groupLabel.toLowerCase()} · committed / incurred / paid</span></h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em">Group by</span>
        <div class="seg">
          <button class="${budgetGroupBy==='gl'?'on':''}" onclick="setBudgetGroup('gl')">GL account</button>
          <button class="${budgetGroupBy==='region'?'on':''}" onclick="setBudgetGroup('region')">Region</button>
        </div>
        <button class="pipe-allbtn" onclick="expandAllBudget(${Object.values(fpaExpand).some(Boolean)?'false':'true'})">${Object.values(fpaExpand).some(Boolean)?'Collapse all':'Expand all'}</button>
      </div></div>
    <div class="subhead">${budgetGroupBy==='gl'
      ? 'Grouped by GL account first — the grain FP&A reviews on. Expand an account to its cost categories, then to regions, then to POs. Where categories share an account (M&E and Power both post to 15300), the account line is the total.'
      : 'Grouped by region, then GL category. Variance = budget − incurred; % used = incurred / budget.'} Period: <b>${periodLabel()}</b>.</div>
    <table class="tbl"><thead><tr><th>${groupLabel} / drill</th><th class="num">Budget</th><th class="num">Committed</th><th class="num">Incurred</th><th class="num">Variance</th><th class="num">% used</th><th class="num">Open commit.</th></tr></thead><tbody>`;

  const line=(cells)=>{ // {label,indent,expander,open,bud,com,inc,onclick,pill,extra}
    const varr=cells.bud-cells.inc, cons=cells.bud>0?cells.inc/cells.bud*100:0, open=cells.com-cells.inc;
    const cls=cells.sub?'subrow ':'';
    const clickAttr=cells.onclick?`class="${cls}row-click" onclick="${cells.onclick}"`:`class="${cls}"`;
    return `<tr ${clickAttr}>
      <td class="${cells.indent||''}">${cells.expander!=null?`<span class="expander ${cells.open?'open':''}">▸</span> `:''}${cells.bold?'<b>'+cells.label+'</b>':cells.label}${cells.pill||''}${cells.extra||''}</td>
      <td class="num">${money(cells.bud)}</td>
      <td class="num cell-c">${money(cells.com)}</td>
      <td class="num cell-i">${money(cells.inc)}</td>
      <td class="num" style="color:${varr>=0?'var(--teal)':'var(--red)'};${cells.bold?'font-weight:600':''}">${varr>=0?'':'('}${money(Math.abs(varr))}${varr>=0?'':')'}</td>
      <td class="num">${pct(cons)}</td>
      <td class="num" style="color:var(--amber)">${money(open)}</td></tr>`;
  };

  let tBud=0,tCom=0,tInc=0;

  if(budgetGroupBy==='gl'){
    // GL account → category → region → PO
    const accts=acctsInUse(P.rows);
    accts.forEach(acct=>{
      const arows=P.rows.filter(r=>CAT_META[txCat(r)].acct===acct);
      const cats=catsForAcct(acct).filter(c=>arows.some(r=>txCat(r)===c));
      const aBud=cats.reduce((a,c)=>a+catBud(arows,c),0);
      const am=measure(arows); tBud+=aBud;tCom+=am.com;tInc+=am.inc;
      const aOver=(aBud-am.inc)<0, aKey='acct|'+acct, aOpen=fpaExpand[aKey];
      h+=line({label:`${acct} · ${GL_ACCT_NAME[acct]||''}`,bold:true,expander:true,open:aOpen,
        bud:aBud,com:am.com,inc:am.inc,onclick:`toggleFpa('${aKey}')`,
        pill:` <span class="pill ${aOver?'flag':'good'} sm">${aOver?'over':'under'}</span>`,
        extra:cats.length>1?` <span style="color:var(--hint);font-size:11px">${cats.length} categories</span>`:''});
      if(aOpen){
        cats.forEach(cat=>{
          const crows=arows.filter(r=>txCat(r)===cat);
          const cBud=catBud(crows,cat), cm=measure(crows);
          const cKey=aKey+'|'+cat, cOpen=fpaExpand[cKey], cOver=(cBud-cm.inc)<0;
          h+=line({label:CAT_META[cat].name,sub:true,indent:'indent1',expander:true,open:cOpen,
            bud:cBud,com:cm.com,inc:cm.inc,onclick:`toggleFpa('${cKey}')`,
            pill:` <span class="pill ${cOver?'flag':'good'} sm">${cOver?'over':'under'}</span>`});
          if(cOpen){
            const regs=[...new Set(crows.map(r=>r[IDX.region]))].sort();
            regs.forEach(rg=>{
              const rrows=crows.filter(r=>r[IDX.region]===rg);
              const rBud=catBudget(rg,cat,sum(rrows,'incurred')), rm=measure(rrows);
              const rKey=cKey+'|'+rg, rOpen=fpaExpand[rKey];
              const driver=CAT_DRIVER[rg+'|'+cat]||'';
              const rOver=(rBud-rm.inc)<0;
              h+=line({label:rg,sub:true,indent:'indent2',expander:true,open:rOpen,
                bud:rBud,com:rm.com,inc:rm.inc,onclick:`toggleFpa('${rKey}')`});
              h+=`<tr class="subrow"><td class="indent3" colspan="7" style="padding-top:0;padding-bottom:7px">
                <span style="color:${rOver?'var(--red)':'var(--teal)'};font-size:12px"><b>Why:</b> ${driver}</span></td></tr>`;
              if(rOpen){
                rrows.forEach(r=>{
                  const com2=conv(r[IDX.committed],r[IDX.ccy]), inc2=conv(r[IDX.incurred],r[IDX.ccy]);
                  h+=`<tr class="subrow"><td class="indent3" style="font-size:12px;padding-left:84px">
                    <span style="color:var(--blue);font-weight:600">PO-${1000+TX.indexOf(r)}</span> · ${r[IDX.vendor]} <span style="color:var(--hint)">${r[IDX.site]}</span></td>
                    <td class="num" style="font-size:12px;color:var(--hint)">—</td>
                    <td class="num cell-c" style="font-size:12px">${money(com2)}</td>
                    <td class="num cell-i" style="font-size:12px">${money(inc2)}</td>
                    <td colspan="3" style="text-align:right"><span style="color:var(--blue);font-size:11px;cursor:pointer" onclick="event.stopPropagation();gotoTab('po')">trace in PO register ›</span></td></tr>`;
                });
              }
            });
          }
        });
      }
    });
  } else {
    // region → category → PO  (original view)
    const regions=[...new Set(P.rows.map(r=>r[IDX.region]))].sort();
    regions.forEach(rg=>{
      const rs=P.rows.filter(r=>r[IDX.region]===rg);
      const cats=[...new Set(rs.map(txCat))];
      let rBud=0; const catRows=cats.map(cat=>{ const crs=rs.filter(r=>txCat(r)===cat);
        const bud=catBudget(rg,cat,sum(crs,'incurred')); rBud+=bud; return {cat,crs,bud}; });
      const rm=measure(rs); tBud+=rBud;tCom+=rm.com;tInc+=rm.inc;
      const rKey='reg|'+rg, open=fpaExpand[rKey];
      h+=line({label:rg,bold:true,expander:true,open,bud:rBud,com:rm.com,inc:rm.inc,onclick:`toggleFpa('${rKey}')`});
      if(open){
        catRows.forEach(({cat,crs,bud})=>{
          const cm=measure(crs), meta=CAT_META[cat], driver=CAT_DRIVER[rg+'|'+cat]||'';
          const cKey=rKey+'|'+cat, cOpen=fpaExpand[cKey], over=(bud-cm.inc)<0;
          h+=line({label:`${meta.name} <span style="color:var(--hint);font-size:11px">GL ${meta.acct}</span>`,sub:true,indent:'indent1',
            expander:true,open:cOpen,bud,com:cm.com,inc:cm.inc,onclick:`toggleFpa('${cKey}')`,
            pill:` <span class="pill ${over?'flag':'good'} sm">${over?'over':'under'}</span>`});
          h+=`<tr class="subrow"><td class="indent2" colspan="7" style="padding-top:0;padding-bottom:7px">
            <span style="color:${over?'var(--red)':'var(--teal)'};font-size:12px"><b>Why:</b> ${driver}</span></td></tr>`;
          if(cOpen){ crs.forEach(r=>{ const com2=conv(r[IDX.committed],r[IDX.ccy]), inc2=conv(r[IDX.incurred],r[IDX.ccy]);
            h+=`<tr class="subrow"><td class="indent3" style="font-size:12px">
              <span style="color:var(--blue);font-weight:600">PO-${1000+TX.indexOf(r)}</span> · ${r[IDX.vendor]} <span style="color:var(--hint)">${r[IDX.site]}</span></td>
              <td class="num" style="font-size:12px;color:var(--hint)">—</td>
              <td class="num cell-c" style="font-size:12px">${money(com2)}</td>
              <td class="num cell-i" style="font-size:12px">${money(inc2)}</td>
              <td colspan="3" style="text-align:right"><span style="color:var(--blue);font-size:11px;cursor:pointer" onclick="event.stopPropagation();gotoTab('po')">trace in PO register ›</span></td></tr>`; }); }
        });
      }
    });
  }

  const tVar=tBud-tInc, tCons=tBud>0?tInc/tBud*100:0, tOpen=tCom-tInc;
  h+=`</tbody><tfoot><tr><td>Portfolio</td><td class="num">${money(tBud)}</td><td class="num">${money(tCom)}</td><td class="num">${money(tInc)}</td><td class="num" style="color:${tVar>=0?'var(--teal)':'var(--red)'}">${money(tVar)}</td><td class="num">${pct(tCons)}</td><td class="num" style="color:var(--amber)">${money(tOpen)}</td></tr></tfoot></table>
    <div class="note">${budgetGroupBy==='gl'
      ? 'GL account → category → region → PO. The account line is the sum of its categories, which sum to their regions, which sum to the POs — so the review ties at every level back to the trial balance.'
      : 'Region → category → PO. Green = budget remaining, red = over budget.'}</div></div>`;
  el.innerHTML=h;
}
// ---- pipeline board collapse state (Stage → Market → Site) ----

// (also collapsed to rollups); expanding a market reveals its individual site cards.
const pipeOpenStage={};                 // stageId -> bool
const pipeOpenMarket={};                 // `${stageId}::${market}` -> bool
function togglePipeStage(id){ pipeOpenStage[id]=!pipeOpenStage[id]; renderLifecycle(); }
function togglePipeMarket(id,market){ const k=id+'::'+market; pipeOpenMarket[k]=!pipeOpenMarket[k]; renderLifecycle(); }
function expandAllPipe(open){
  LIFECYCLE.forEach(st=>{ pipeOpenStage[st.id]=open;
    propsByMarket(propsByStage(st.id)).forEach(g=>{ pipeOpenMarket[st.id+'::'+g.market]=open; }); });
  renderLifecycle();
}

const pisOpenCampus={};                 // campus name -> bool

function togglePisCampus(name){ pisOpenCampus[name]=!pisOpenCampus[name]; renderPIS(); }
function expandAllPis(open){
  const halls=HALLS.filter(h=>F.region==='all'||h.region===F.region);

// property lifecycle pipeline board — columns per stage, collapsible Stage → Market → Site
function pipelineBoardHTML(){
  const colFor={purple:'var(--purple)',blue:'var(--blue)',amber:'var(--amber)',teal:'var(--teal)',green:'var(--green)',coral:'var(--coral)'};
  const totalProps=PROPERTIES.filter(p=>(F.fund==='all'||p.fund===F.fund)&&(F.region==='all'||p.region===F.region)).length;
  const mw0=n=>n>0?n.toLocaleString()+' MW':'';

function pipelineDrill(name,stage){

}

// Top vendors card — aggregates the scoped rows by vendor, ranks by committed,
// shows committed / incurred / paid with a burn bar. Each vendor row expands to its

const VENDOR_TOP_N=10;
const vendorOpen={};                          // vendor name -> bool (per-site expanded)
let vendorTableOpen=false;                     // whole ranked table folded by default
function toggleVendorTable(){ vendorTableOpen=!vendorTableOpen; renderVendors(); }

// Vendors tab — capital concentration analytics: exposure headline, category mix,
// and the ranked top-N table with per-site drill and a long-tail summary.
function renderVendors(){
  const P=portfolio(), el=$('view-vendors'); if(!el)return;
  const byV={};
  P.rows.forEach(r=>{
    const v=r[IDX.vendor];
    const o=byV[v]||(byV[v]={vendor:v,committed:0,incurred:0,paid:0,cat:txCat(r),bySite:{}});
    const c=conv(r[IDX.committed],r[IDX.ccy]), inc=conv(r[IDX.incurred],r[IDX.ccy]), pd=conv(r[IDX.paid],r[IDX.ccy]);
    o.committed+=c; o.incurred+=inc; o.paid+=pd;
    const site=r[IDX.site];
    const s=o.bySite[site]||(o.bySite[site]={site,committed:0,incurred:0,paid:0});
    s.committed+=c; s.incurred+=inc; s.paid+=pd;
  });
  const all=Object.values(byV).sort((a,b)=>b.committed-a.committed);
  all.forEach(o=>{ o.sites=Object.values(o.bySite).sort((a,b)=>b.committed-a.committed); });
  if(!all.length){ el.innerHTML='<div class="card"><div class="subhead">No vendor commitments in the current scope.</div></div>'; return; }
  const rows=all.slice(0,VENDOR_TOP_N);
  const maxC=rows[0].committed||1;
  const tC=rows.reduce((a,r)=>a+r.committed,0), tI=rows.reduce((a,r)=>a+r.incurred,0), tP=rows.reduce((a,r)=>a+r.paid,0);
  const grandC=all.reduce((a,r)=>a+r.committed,0);
  const grandI=all.reduce((a,r)=>a+r.incurred,0);
  const tailN=all.length-rows.length, tailC=grandC-tC;
  const catName={shell:'Shell',mne:'M&E',power:'Power',soft:'Software'};

  // ---- concentration measures ----
  const top1=all[0].committed/grandC*100;
  const top5=all.slice(0,5).reduce((a,r)=>a+r.committed,0)/grandC*100;
  const top10=tC/grandC*100;
  // HHI on committed share (0–10,000); >2,500 is "highly concentrated" by DOJ/FTC convention
  const hhi=Math.round(all.reduce((a,r)=>{const s=r.committed/grandC*100;return a+s*s;},0));
  const hhiBand = hhi>=2500?['flag','Highly concentrated']:hhi>=1500?['warn','Moderately concentrated']:['good','Competitive'];

  // ---- category mix ----
  const byCat={};
  all.forEach(r=>{ byCat[r.cat]=(byCat[r.cat]||0)+r.committed; });
  const catRows=Object.entries(byCat).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
  const catColor={power:'var(--warn)',shell:'var(--accent)',mne:'var(--accent-2)',soft:'var(--pos)'};

  // ===== KPI strip: concentration headline =====
  let h=`<div class="kpis">
    <div class="kpi lenshi"><div class="k">Vendors in scope</div><div class="v">${all.length}</div><div class="d">${money0(grandC)} committed${ccyTag()}</div><div class="lenstag">▸ capital concentration</div></div>
    <div class="kpi"><div class="k">Top vendor share</div><div class="v">${pct(top1)}</div><div class="d">${all[0].vendor}</div></div>
    <div class="kpi"><div class="k">Top 5 share</div><div class="v">${pct(top5)}</div><div class="d">of committed capital</div></div>
    <div class="kpi ${hhiBand[0]}"><div class="k">Concentration (HHI)</div><div class="v">${hhi.toLocaleString()}</div><div class="d">${hhiBand[1]}</div></div>
  </div>`;

  // ===== category mix =====
  h+=`<div class="card"><h2>Committed capital by category<span class="note">where the commitment sits · current scope</span></h2>
    <div class="subhead">Concentration isn't only about vendors — it's about what you're buying. Power and shell dominate data-center capex; a swing in either moves the whole program.</div>
    <div class="catmix">`;
  catRows.forEach(cr=>{
    const share=cr.v/grandC*100;
    h+=`<div class="catmix-row">
      <span class="catmix-lbl"><span class="dot" style="background:${catColor[cr.c]||'var(--neu)'}"></span>${catName[cr.c]||cr.c}</span>
      <div class="catmix-track"><div class="catmix-fill" style="width:${Math.max(2,share)}%;background:${catColor[cr.c]||'var(--neu)'}"></div></div>
      <span class="catmix-val">${money(cr.v)} <span style="color:var(--hint)">· ${pct(share)}</span></span></div>`;
  });
  h+=`</div></div>`;

  // ===== ranked table with per-site drill — whole table folded by default =====
  const drillable=rows.filter(r=>r.sites.length>1).map(r=>r.vendor);
  _vendorTopCache=drillable;
  const anyVendOpen=drillable.some(v=>vendorOpen[v]);
  h+=`<div class="card${vendorTableOpen?'':' folded'}"><h2 class="card-hd" onclick="toggleVendorTable()"><span class="card-fold ${vendorTableOpen?'open':''}">▸</span>Top ${VENDOR_TOP_N} vendors<span class="note">by committed capital · ${periodLabel()}</span>
      ${vendorTableOpen
        ? (drillable.length?`<button class="pipe-allbtn" onclick="event.stopPropagation();expandAllVendors(${anyVendOpen?'false':'true'})">${anyVendOpen?'Collapse all':'Expand all'}</button>`:'')
        : `<span class="card-sum">top ${VENDOR_TOP_N} = ${pct(top10)} of ${money0(grandC)}${tailN>0?` · +${tailN} in tail`:''}</span>`}</h2>`;
  if(vendorTableOpen){
  h+=`<div class="subhead">Ranked by commitment, with invoiced and bank-confirmed paid alongside — the open gap is signed-up spend not yet billed. Rows are collapsed by default; expand a vendor to see its per-site breakdown, or the trace link to open it in the copilot.</div>
    <table class="tbl vend-tbl"><thead><tr><th style="width:26px">#</th><th>Vendor</th><th>Category / sites</th><th style="width:150px">Commitment burn</th><th class="num">Committed</th><th class="num">Invoiced</th><th class="num">Paid</th><th class="num">Open</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{

  }
  h+=`<div class="legend" style="margin-top:10px">
      <span><span class="dot" style="background:var(--accent);opacity:.4"></span>Committed</span>

// ============================================================ CONSOLIDATION
let consolFundsOpen=true;  // per-fund breakdown under Gross; folds to the clean gross→net story
function toggleConsolFunds(){ consolFundsOpen=!consolFundsOpen; renderConsol(); }
function renderConsol(){
  const P=portfolio(), el=$('view-consol');
  // build gross by fund, then intercompany eliminations, then net
  const byFund={};
  P.rows.forEach(r=>{ const f=r[IDX.fund]; byFund[f]=(byFund[f]||0)+conv(r[IDX.incurred],r[IDX.ccy]); });
  const gross=P.incurred;
  // illustrative IC elimination: cross-fund service charges + IC capital, ~6% of gross
  const icService=+(gross*0.041).toFixed(1);
  const icCapital=+(gross*0.022).toFixed(1);
  const net=+(gross-icService-icCapital).toFixed(1);
  const ledgerPin='';

  let h=`<div class="card"><h2>Consolidation waterfall ${ledgerPin}<span class="note">gross → intercompany eliminations → net · ties to TB</span>
      <button class="pipe-allbtn" onclick="toggleConsolFunds()">${consolFundsOpen?'Collapse funds':'Expand funds'}</button></h2>
    <div class="subhead">Full consolidation is the intercompany engine seen through one lens — the same eliminations, rolled up by fund and ring-fenced group.</div>
    <div class="lrows">
      <div class="l-row row-click" onclick="toggleConsolFunds()"><span><span class="pipe-exp ${consolFundsOpen?'open':''}">▸</span> <b>Gross capital cost</b> <span style="color:var(--hint)">· sum of all subsidiary cost edges</span></span><span class="amt">${money(gross)}</span></div>`;
  if(consolFundsOpen){
    Object.keys(byFund).sort().forEach(f=>{
      const nm={F1:'Fund I — US',F2:'Fund II — EMEA (ring-fenced)',F3:'Fund III — Global'}[f]||f;
      h+=`<div class="l-row sub"><span>${nm}</span><span class="amt">${money(byFund[f])}</span></div>`;
    });
  }
  h+=`<div class="l-row"><span>− IC service charges <span style="color:var(--hint)">· cross-fund allocations</span></span><span class="amt" style="color:var(--coral)">(${money(icService)})</span></div>
      <div class="l-row"><span>− IC capital contributions <span style="color:var(--hint)">· eliminated on consol</span></span><span class="amt" style="color:var(--coral)">(${money(icCapital)})</span></div>
      <div class="l-row total"><span>= Net consolidated capital</span><span class="amt">${money(net)}</span></div>
    </div>
    <div class="note">Ring-fence-aware: Fund II eliminations don't cross into Fund I/III. The residual after eliminations is what appears on the consolidated balance sheet — and ties, line for line, to the trial balance's 15000 CIP + PP&E accounts.</div></div>`;

  // drill: consol → subsidiary → GL category → detail
  h+=`<div class="card"><h2>Drill &amp; trend<span class="note">consol → subsidiary → GL category → detail → source doc</span></h2>
    <div class="subhead">The same path runs both ways: drill down to a transaction, or roll up from any invoice to portfolio capex.</div>
    <table class="tbl"><thead><tr><th>Subsidiary / entity</th><th>Consol group</th><th class="num">Committed</th><th class="num">Incurred</th><th class="num">Paid</th><th></th></tr></thead><tbody>`;
  const entities=[
    ['Ashburn SPV LLC','F1 · USD','Americas','Ashburn VA'],
    ['Dallas HoldCo','F1 · USD','Americas','Dallas TX'],
    ['Meridian Ireland Ltd','F2 · EUR (ring-fenced)','EMEA','Dublin'],
    ['Meridian UK Ltd','F2 · GBP (ring-fenced)','EMEA','London'],
    ['Meridian SG Pte','F3 · SGD','APAC','Singapore'],
    ['Meridian JP KK','F3 · SGD','APAC','Tokyo'],
  ];
  entities.forEach(([nm,grp,reg,site])=>{
    const rs=P.rows.filter(r=>r[IDX.site]===site);
    if(!rs.length)return;
    const c=sum(rs,'committed'),i=sum(rs,'incurred'),p=sum(rs,'paid');
    h+=`<tr class="row-click" onclick="pickTab('po')">
      <td><b>${nm}</b></td><td style="color:var(--muted);font-size:12px">${grp}</td>
      <td class="num cell-c">${money(c)}</td><td class="num cell-i">${money(i)}</td><td class="num cell-p">${money(p)}</td>
      <td style="text-align:right;color:var(--blue);font-size:12px">drill ›</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td>Consolidated (pre-elim)</td><td></td><td class="num">${money(P.committed)}</td><td class="num">${money(P.incurred)}</td><td class="num">${money(P.paid)}</td><td></td></tr></tfoot></table>
    <div class="note">Click any subsidiary to descend into its POs → invoices → payments → GL posting, or continue up to the consolidated number above.</div></div>`;
  el.innerHTML=h;
}

// ============================================================ TRENDING
let tMeasure='incurred', tCum='period';
function setTMeasure(m){tMeasure=m;renderTrend();}
function setTCum(c){tCum=c;renderTrend();}
let tGrain='quarter';
function setTGrain(g){tGrain=g;renderTrend();}
// Fixed drill path: region → subsidiary → GL account → category → PO.
// Every node keeps its own time series. Expand state tracked by node path key.
const TREND_PATH=[
  {dim:'region', label:'Region',      key:r=>r[IDX.region]},
  {dim:'site',   label:'Subsidiary',  key:r=>r[IDX.site]},
  {dim:'gl',     label:'GL account',  key:r=>CAT_META[txCat(r)].acct},
  {dim:'cat',    label:'Cost category',key:r=>txCat(r)},
  {dim:'po',     label:'PO',          key:r=>'PO-'+(1000+TX.indexOf(r))},
];
let trendExpand={};  // node path string -> bool
function toggleTrend(k){ trendExpand[k]=!trendExpand[k]; renderTrend(); }
function trendNodeLabel(dim,key){
  if(dim==='gl')  return `${key} · ${GL_ACCT_NAME[key]||''}`;
  if(dim==='cat') return CAT_META[key]?CAT_META[key].name:key;
  if(dim==='site'){ const nm={'Ashburn VA':'Ashburn SPV','Dallas TX':'Dallas / US-III','Dublin':'Ireland Ltd','London':'UK Ltd','Singapore':'SG Pte','Tokyo':'JP KK'}[key]||key;
    return `${nm} <span style="color:var(--hint);font-size:11px">${key}</span>`; }
  if(dim==='po'){ const idx=parseInt(key.replace('PO-',''))-1000; const r=TX[idx];
    return r?`<span style="color:var(--blue);font-weight:600">${key}</span> · ${r[IDX.vendor]} <span style="color:var(--hint);font-size:11px">${r[IDX.site]}</span>`:key; }
  return key;
}
function renderTrend(){
  const P=portfolio(), el=$('view-trend');
  const fpaPin='';
  // axis buckets: months or quarters
  const buckets=tGrain==='month'?MONTHS:QUARTERS;
  const colLabel=b=>tGrain==='month'?MONTH_LABEL[b]:b.replace('20','');
  // build a series (per bucket) for the scoped rows
  function series(rows){
    let cum=0;
    return buckets.map(b=>{
      let v=0;
      if(tGrain==='month'){ rows.forEach(r=>{ v+=conv(monthVal(r,tMeasure,b),r[IDX.ccy]); }); }
      else { v=rows.filter(r=>r[IDX.q]===b).reduce((a,r)=>a+conv(r[IDX[tMeasure]],r[IDX.ccy]),0); }
      cum+=v; return tCum==='cum'?+cum.toFixed(1):+v.toFixed(1);
    });
  }
  function spark(vals){
    const mx=Math.max(...vals,0.1);
    return '<span class="spark">'+vals.map(v=>`<i style="height:${Math.max(2,v/mx*22)}px" title="${money(v)}"></i>`).join('')+'</span>';
  }
  let h=`<div class="card">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">Trending ${fpaPin}<span class="note">how a measure moves over time, at any level</span></h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="seg">
          <button class="${tMeasure==='committed'?'on':''}" onclick="setTMeasure('committed')">Committed</button>
          <button class="${tMeasure==='incurred'?'on':''}" onclick="setTMeasure('incurred')">Incurred</button>
          <button class="${tMeasure==='paid'?'on':''}" onclick="setTMeasure('paid')">Paid</button>
        </div>
        <div class="seg">
          <button class="${tGrain==='month'?'on':''}" onclick="setTGrain('month')">Monthly</button>
          <button class="${tGrain==='quarter'?'on':''}" onclick="setTGrain('quarter')">Quarterly</button>
        </div>
        <div class="seg">
          <button class="${tCum==='period'?'on':''}" onclick="setTCum('period')">Per period</button>
          <button class="${tCum==='cum'?'on':''}" onclick="setTCum('cum')">Cumulative</button>
        </div>
        <button class="btn-x" onclick="trendExpand={};renderTrend()" style="font-size:12px">Collapse all</button>
      </div></div>
    <div class="subhead">Trend of <b>${tMeasure}</b>, ${tCum==='cum'?'cumulative':'per '+tGrain}. Drill path: <b>Region → Subsidiary → GL account → Category → PO → Invoice / GL entry</b> — click <b>▸</b> to expand any row; every level keeps its own time series. ${tGrain==='month'?'Quarterly figures spread across months. ':''}</div>
    <div style="overflow-x:auto"><table class="tbl" style="min-width:${tGrain==='month'?'920':'680'}px"><thead><tr><th>Region → Sub → GL → Category → PO → Invoice</th>`;
  buckets.forEach(b=>h+=`<th class="num">${colLabel(b)}</th>`);
  h+=`<th class="num">Trend</th><th class="num">Total</th></tr></thead><tbody>`;
  // consolidated row
  const consVals=series(P.rows);
  h+=`<tr style="background:#FAF9F5"><td><b>Consolidated</b></td>`;
  consVals.forEach(v=>h+=`<td class="num">${money(v)}</td>`);
  h+=`<td class="num">${spark(consVals)}</td><td class="num"><b>${money(tCum==='cum'?consVals[consVals.length-1]:consVals.reduce((a,b)=>a+b,0))}</b></td></tr>`;

  // recursive walk down the fixed drill path; each node keeps its own series
  function walk(rows,level,pathKey){
    if(level>=TREND_PATH.length)return;
    const lvl=TREND_PATH[level];
    const groups=[...new Set(rows.map(lvl.key))];
    // order largest-first by total
    const gt=groups.map(g=>{ const rs=rows.filter(r=>lvl.key(r)===g); const v=series(rs);
      return {g,rs,v,total:tCum==='cum'?v[v.length-1]:v.reduce((a,b)=>a+b,0)}; });
    gt.sort((a,b)=>b.total-a.total);
    gt.forEach(({g,rs,v,total})=>{
      const nodeKey=pathKey+'/'+lvl.dim+':'+g;
      const isPO = lvl.dim==='po';
      const open=trendExpand[nodeKey];
      // PO rows can expand into their invoice / GL-entry leaves; other levels expand to the next dim
      const canExpand = isPO ? true : (level<TREND_PATH.length-1 && rs.length>0);
      const indent=level+1;                       // 1..5, real depth (no clamp)
      const exp=canExpand
        ? `<span class="expander ${open?'open':''}">▸</span>`
        : `<span class="dep">·</span>`;
      const lvtag=`<span class="lvtag">${lvl.label}</span>`;
      h+=`<tr class="row-click tree-row tree-l${level} ${open?'open-row':''}" onclick="toggleTrend('${nodeKey.replace(/'/g,'')}')">
        <td class="indent${indent}"><span class="tw">${exp}${lvtag}${trendNodeLabel(lvl.dim,g)}</span></td>`;
      v.forEach(x=>h+=`<td class="num">${money(x)}</td>`);
      h+=`<td class="num">${spark(v)}</td><td class="num">${money(total)}</td></tr>`;
      if(open){
        if(isPO){ emitInvoices(rs[0],nodeKey); }   // a PO maps to exactly one TX row
        else { walk(rs,level+1,nodeKey); }
      }
    });
  }
  // invoice / GL-entry leaves for a single TX row (the PO), each with its own time series
  function emitInvoices(r,pathKey){
    const idx=TX.indexOf(r);
    const invs=invoicesForTx(r,idx);
    invs.forEach((iv,k)=>{
      // invoice time series: place its amount within the PO's quarter, spread across months if monthly
      const invVals=buckets.map(b=>{
        let val=0;
        if(tGrain==='month'){ if(Q_OF_MONTH[b]===r[IDX.q]){ const mi=Q_MONTHS[r[IDX.q]].indexOf(b); val=conv(iv.amt*MONTH_SPREAD[mi],r[IDX.ccy]); } }
        else if(b===r[IDX.q]){ val=conv(iv.amt,r[IDX.ccy]); }
        return +val.toFixed(1);
      });
      let cum=0; const shown=invVals.map(x=>{cum+=x;return tCum==='cum'?+cum.toFixed(1):x;});
      const total=tCum==='cum'?shown[shown.length-1]:shown.reduce((a,b)=>a+b,0);
      const stPill = iv.status==='paid'?'<span class="pill good sm">paid</span>' : iv.status==='part'?'<span class="pill warn sm">part-paid</span>' : '<span class="pill flag sm">unpaid</span>';
      h+=`<tr class="subrow trend-leaf"><td class="indent6" style="font-size:12px">
        <span class="lvtag">Invoice</span><span style="color:var(--teal);font-weight:600">${iv.inv}</span>${nsChip('invoice',iv.inv,r[IDX.vendor]+' · '+r[IDX.site])} ${stPill}
        <span style="color:var(--hint);margin-left:6px">${iv.je}${nsChip('je',iv.je,iv.inv)} · Dr ${iv.acct} / Cr 20000 AP</span></td>`;
      shown.forEach(x=>h+=`<td class="num" style="font-size:12px">${money(x)}</td>`);
      h+=`<td class="num">${spark(shown)}</td><td class="num" style="font-size:12px">${money(total)}</td></tr>`;
    });
    // a small tie line
    h+=`<tr class="subrow trend-leaf"><td class="indent6" colspan="${buckets.length+3}" style="font-size:11px;color:var(--hint)">
      ${invs.length} invoice${invs.length>1?'s':''} · sums to the PO's incurred · each posts a GL entry to ${CAT_META[txCat(r)].acct} — click through to the PO register or Trial balance to see the ledger side</td></tr>`;
  }
  walk(P.rows,0,'');

  h+=`</tbody></table></div>
    <div class="note">Every level trends independently and ties to the sum of its children — region to subsidiaries to GL accounts to categories to POs to the individual invoices, each of which posts a journal entry to the ledger. The invoice is the leaf: it's where the trend meets the GL. Break the measure or grain and the whole tree re-trends.</div></div>`;
  el.innerHTML=h;
}

// ============================================================ PIVOT / CAPEX ANALYSIS
let pivRow='region', pivCol='own';
function setPiv(which,val){ if(which==='row')pivRow=val; else pivCol=val; renderPivot(); }
function renderPivot(){
  const P=portfolio(), el=$('view-pivot');
  function keyOf(r,dim){
    if(dim==='region')return r[IDX.region];
    if(dim==='site')return r[IDX.site];
    if(dim==='fund')return {F1:'Fund I',F2:'Fund II',F3:'Fund III'}[r[IDX.fund]];
    if(dim==='own')return siteOwn(r[IDX.site]).label;
    if(dim==='vendor')return r[IDX.vendor];
    if(dim==='ccy')return r[IDX.ccy];
    return 'All';
  }
  const rowKeys=[...new Set(P.rows.map(r=>keyOf(r,pivRow)))].sort();
  const colKeys=[...new Set(P.rows.map(r=>keyOf(r,pivCol)))].sort();
  function cell(rk,ck){
    const rs=P.rows.filter(r=>keyOf(r,pivRow)===rk&&keyOf(r,pivCol)===ck);
    return {c:sum(rs,'committed'),i:sum(rs,'incurred'),p:sum(rs,'paid')};
  }
  let h=`<div class="bar" style="padding:12px 16px"><div class="ctrls">
    <div class="grp"><label>Rows</label><select onchange="setPiv('row',this.value)">
      ${['region','site','own','fund','vendor'].map(d=>`<option value="${d}" ${pivRow===d?'selected':''}>${({region:'Region',site:'Site',own:'Ownership type',fund:'Fund',vendor:'Vendor'})[d]}</option>`).join('')}
    </select></div>
    <div class="grp"><label>Columns</label><select onchange="setPiv('col',this.value)">
      ${['own','fund','region','ccy'].map(d=>`<option value="${d}" ${pivCol===d?'selected':''}>${({own:'Ownership type',fund:'Fund',region:'Region',ccy:'Currency'})[d]}</option>`).join('')}
    </select></div>
    <div class="note" style="margin:0 0 0 auto;align-self:flex-end">Period · currency · scope inherited from global filters</div>
  </div></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--blue)"></span>Committed</span>
    <span><span class="dot" style="background:var(--teal)"></span>Incurred</span>
    <span><span class="dot" style="background:var(--coral)"></span>Paid</span>
    <span style="color:var(--hint)">· each cell shows all three measures — click to trace to transactions</span>
  </div>
  <div class="pivwrap"><table class="piv"><thead><tr><th class="rowhdr">${({region:'Region',site:'Site',own:'Ownership',fund:'Fund',vendor:'Vendor'})[pivRow]}</th>`;
  colKeys.forEach(ck=>h+=`<th>${ck}</th>`);
  h+=`<th>Total</th></tr></thead><tbody>`;
  rowKeys.forEach(rk=>{
    h+=`<tr><td class="rowhdr">${rk}</td>`;
    let rc=0,ri=0,rp=0;
    colKeys.forEach(ck=>{
      const v=cell(rk,ck); rc+=v.c;ri+=v.i;rp+=v.p;
      h+=`<td onclick="drillPivot('${rk}','${ck}')"><div class="m3"><span class="cell-i">${v.i?money(v.i):'·'}</span>${v.i?`<span class="sub-c">${money(v.c)} committed</span><span class="sub-p">${money(v.p)} paid</span>`:''}</div></td>`;
    });
    h+=`<td><div class="m3"><span class="cell-i">${money(ri)}</span><span class="sub-c">${money(rc)}</span><span class="sub-p">${money(rp)}</span></div></td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td class="rowhdr">Total</td>`;
  colKeys.forEach(ck=>{
    let cc=0,ci=0,cp=0; rowKeys.forEach(rk=>{const v=cell(rk,ck);cc+=v.c;ci+=v.i;cp+=v.p;});
    h+=`<td>${money(ci)}</td>`;
  });
  h+=`<td>${money(P.incurred)}</td></tr></tfoot></table></div>
  <div class="drill" id="pivDrill"></div>`;
  el.innerHTML=h;
}
function drillPivot(rk,ck){
  const d=$('pivDrill');
  d.classList.add('show');
  d.innerHTML=`<button class="close" onclick="document.getElementById('pivDrill').classList.remove('show')">×</button>
    <h3>${rk} × ${ck}</h3><div class="ctx">Transactions behind this cell — each row traces to its PO, invoices, and GL posting.</div>
    <div class="note">In the full system this opens the PO register filtered to this intersection. Every dollar here reconciles up to the cell total and down to a dated invoice.</div>`;
  d.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function togglePO(k){ poExpanded[k]=!poExpanded[k]; renderPO(); }
function togglePOVendor(v){ poVendorOpen[v]=!poVendorOpen[v]; renderPO(); }
function expandAllPOVendors(open){

function expandAllRegVendors(open,names){ names.forEach(v=>{ regVendorOpen[v]=open; }); renderPO(); }
function groupInvoicesByVendor(invs){
  const m={};
  invs.forEach(iv=>{ (m[iv.vendor]=m[iv.vendor]||[]).push(iv); });

  inner+='</div>';
  box.innerHTML=inner;

      <table class="tbl"><thead><tr><th>Account</th><th>Component</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>`;

      <div class="note" style="margin-top:8px">Book and tax books diverge here: the book entry uses the componentized useful lives; the tax book applies MACRS from the carve's cost-seg classes. Both are generated from the same carve, so book-tax differences are tracked from the start rather than reconciled later.</div>`;

  else if(cipSub==='audit'){
    h+=`<h2>Audit package — ${P.name} ${pin}<span class="note">everything an auditor needs, assembled in one gesture</span></h2>
      <div class="subhead">The PBC pack for this capitalization: the determination and its evidence, the component carve and its ratios, the capitalized-interest computation, the cost scrub, the journal entry, and the GAAP basis — one artifact instead of a scramble before fieldwork.</div>

// ============================================================ FINANCIAL REPORTING
// Consolidated statements derived from the SAME trial balance (COA) the reconciliation
// view proves out — so every statement line ties back to an account, and the account ties
// to the spine. Treasury/operating figures the capex spine doesn't carry (revenue, interest,
// cash movements) are layered in as clearly-labeled supplemental inputs.
let finRepSub='flux';                    // 'flux' | 'trend'
let frSecOpen={};                        // `${finRepSub}::${section}` -> bool (folded by default)
let fluxStmt='is';                       // statement inside flux: 'bs'|'is'|'cf'|'eq'
// Period model: grain = 'm' (monthly → MoM) or 'q' (quarterly → QoQ); idx picks which period.
// Each period auto-compares to the one before it in its calendar.
const FLUX_CAL={
  m:[ {lbl:'Jan 26',end:'Jan 31, 26'},{lbl:'Feb 26',end:'Feb 28, 26'},{lbl:'Mar 26',end:'Mar 31, 26'},
      {lbl:'Apr 26',end:'Apr 30, 26'},{lbl:'May 26',end:'May 31, 26'},{lbl:'Jun 26',end:'Jun 30, 26'} ],
  q:[ {lbl:'2025-Q3',end:'Sep 30, 25'},{lbl:'2025-Q4',end:'Dec 31, 25'},{lbl:'2026-Q1',end:'Mar 31, 26'},{lbl:'2026-Q2',end:'Jun 30, 26'} ],
};
let fluxGrain='m';                       // 'm' | 'q'  (Monthly, Quarterly)
let fluxRange={ m:{from:4,to:5}, q:{from:2,to:3} };   // From/To indices per grain (endpoint comparison)
let fluxGLOpen={};                       // `${stmt}::${category}` -> bool (GL-level expand)
// comment store: key `${stmt}::${periodTag}::${line}` -> {text, locked, by, at}
let fluxComments={};
let fluxEditing=null;                    // currently-open inline editor key, or null
const FLUX_REVIEWER='A. Okafor, Controller';   // illustrative current user
const FLUX_THRESH_PCT=5, FLUX_THRESH_ABS=1.0;  // flag if |Δ%|>5% or |Δ$|>$1.0M
// resolve From (comparison) + To (current) period objects and a stable tag for comment keys
function fluxPeriodInfo(){
  const cal=FLUX_CAL[fluxGrain]; let {from,to}=fluxRange[fluxGrain];
  to=Math.max(1,Math.min(cal.length-1,to));
  from=Math.max(0,Math.min(to-1,from));            // From must be strictly before To
  const cur=cal[to], pri=cal[from];
  const span=to-from;
  const consecutive = span===1;
  return {cur,pri,from,to,span,consecutive,grain:fluxGrain,
    tag:fluxGrain+':'+pri.lbl+'→'+cur.lbl,
    compare: consecutive ? (fluxGrain==='m'?'MoM':'QoQ') : (span+(fluxGrain==='m'?'-month':'-quarter')+' range')};
}
function setFluxGrain(g){ fluxGrain=g; fluxEditing=null; renderFinRep(); paintFluxFilter(); }
function setFluxFrom(i){ i=+i; const r=fluxRange[fluxGrain]; r.from=i; if(r.to<=i)r.to=Math.min(FLUX_CAL[fluxGrain].length-1,i+1); fluxEditing=null; renderFinRep(); paintFluxFilter(); }
function setFluxTo(i){ i=+i; const r=fluxRange[fluxGrain]; r.to=i; if(r.from>=i)r.from=Math.max(0,i-1); fluxEditing=null; renderFinRep(); paintFluxFilter(); }
// show + populate the flux range controls in the filter bar (only meaningful on the flux tab)
function paintFluxFilter(){
  const grp=document.getElementById('fluxRangeGrp'); if(!grp)return;
  const onFlux = (TAB==='finrep' && finRepSub==='flux');
  grp.style.display = onFlux ? '' : 'none';
  if(!onFlux) return;
  const cal=FLUX_CAL[fluxGrain], P=fluxPeriodInfo();
  const mBtn=document.getElementById('fluxGrainM'), qBtn=document.getElementById('fluxGrainQ');
  if(mBtn) mBtn.className = fluxGrain==='m'?'on':'';
  if(qBtn) qBtn.className = fluxGrain==='q'?'on':'';
  const fromSel=document.getElementById('fluxFromSel'), toSel=document.getElementById('fluxToSel');
  if(fromSel) fromSel.innerHTML=cal.map((p,i)=> i<=P.to-1?`<option value="${i}" ${i===P.from?'selected':''}>${p.lbl}</option>`:'').join('');
  if(toSel)   toSel.innerHTML  =cal.map((p,i)=> i>=1?`<option value="${i}" ${i===P.to?'selected':''}>${p.lbl}</option>`:'').join('');
}
function setFluxStmt(s){ fluxStmt=s; fluxEditing=null; renderFinRep(); if(typeof paintSubnav2==='function')paintSubnav2(); }
function toggleFluxGL(cat){ const k=fluxStmt+'::'+cat; fluxGLOpen[k]=!fluxGLOpen[k]; renderFinRep(); }
// key identifies any commentable line at any level: statement::periodTag::lineId
function fluxKeyFor(lineId){ return fluxStmt+'::'+fluxPeriodInfo().tag+'::'+lineId; }
function openFluxEditor(lineId){
  const k=fluxKeyFor(lineId), c=fluxComments[k];
  if(c&&c.locked) return;                // locked can't be edited until unlocked
  fluxEditing=k; renderFinRep();
  // focus the textarea after render
  setTimeout(()=>{ const ta=document.getElementById('flux-ta'); if(ta){ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);} },0);
}
function saveFluxEditor(lineId){
  const ta=document.getElementById('flux-ta'); if(!ta) return;
  const k=fluxKeyFor(lineId), text=ta.value.trim();
  if(text){ fluxComments[k]={text, locked:false, by:FLUX_REVIEWER, at:fluxNow()}; }
  else { delete fluxComments[k]; }
  fluxEditing=null; renderFinRep();
}
function cancelFluxEditor(){ fluxEditing=null; renderFinRep(); }
function lockFluxComment(lineId){
  const k=fluxKeyFor(lineId), c=fluxComments[k];
  if(!c||!c.text) return;
  c.locked=true; c.by=FLUX_REVIEWER; c.at=fluxNow(); fluxEditing=null; renderFinRep();
}
function unlockFluxComment(lineId){
  const k=fluxKeyFor(lineId), c=fluxComments[k];
  if(!c) return;
  c.locked=false; renderFinRep();
}
function fluxNow(){ const d=new Date(); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); }
function setFinRepSub(s){ finRepSub=s; renderFinRep(); if(typeof paintRailNav==='function')paintRailNav(); }
function toggleFrSec(key){ frSecOpen[key]=!frSecOpen[key]; renderFinRep(); }
function expandAllFrSec(open,keys){ keys.forEach(k=>{ frSecOpen[k]=open; }); renderFinRep(); }
