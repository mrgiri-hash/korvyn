// Actuals derive from FINREP_SUPP/COA (same source as the statements); plan/budget and
// operating drivers are planning inputs that exist nowhere else, so they live here.
function fpActuals(){
  const S=FINREP_SUPP, dep=coaBal('62000');
  const rev=S.rentalRevenue+S.recoveries;
  const gp=rev+S.propertyOpex;
  const ebitda=gp+S.gaExpense;
  const ni=ebitda+dep+S.interestExpense+S.gainOnSale;
  const ffo=ni-dep-S.gainOnSale;
  return {rev,gp,ebitda,ni,ffo,dep};
}
const FP_BUDGET_F=1.021;   // plan was set ~2.1% above where actuals landed
const fpBudget=v=>v*FP_BUDGET_F;
const fpVarPct=(a,b)=>b?((a-b)/Math.abs(b))*100:0;
const fpM=v=>{const a=Math.abs(v);
  return (a>=1000?'$'+(v/1000).toFixed(2)+'B':'$'+Math.round(v)+'M');};
const fpSigned=v=>(v<0?'(':'')+fpM(Math.abs(v)).replace('$','$')+(v<0?')':'');

// segment performance derives from the forecast project book
function fpSegments(){
  const by={};
  FC_PROJECTS.forEach(p=>{ const r=p.region;
    by[r]=by[r]||{region:r,budget:0,actual:0};
    by[r].budget+=p.budget; by[r].actual+=p.incurred+p.committedOpen; });
  return Object.values(by).map(s=>({...s,varAmt:s.actual-s.budget,
    varPct:fpVarPct(s.actual,s.budget), margin:Math.round(28+ (s.actual/s.budget)*4)}));
}

function fRows(){

  const key=fSort.col;
  const D=s=>{const t=Date.parse(s);return isNaN(t)?-Infinity:t;};
  r.sort((a,b)=>{
    let x,y;
    if(key==='filed'||key==='due'||key==='period'){x=D(a[key]);y=D(b[key]);}
    else if(key==='progress'){x=a.progress;y=b.progress;}
    else {x=String(a[key]||'').toLowerCase();y=String(b[key]||'').toLowerCase();}
    if(x<y)return fSort.dir==='asc'?-1:1;
    if(x>y)return fSort.dir==='asc'?1:-1;
    return 0;
  });
  return r;
}

// deterministic sparkline from a seed so a metric's line is stable across renders
function fpSpark(seed,w,hgt,color,down){
  const n=34,pts=[];let v=50;
  for(let i=0;i<n;i++){ v+=((seed*(i+3))%7)-3+(down?-0.35:0.25); pts.push(v); }
  const mn=Math.min(...pts),mx=Math.max(...pts);
  const X=i=>i*w/(n-1), Y=x=>hgt-4-((x-mn)/((mx-mn)||1))*(hgt-8);
  const d=pts.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(x).toFixed(1)}`).join(' ');
  return `<svg class="spk" viewBox="0 0 ${w} ${hgt}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

// 13-week cash chart, shared by Executive Overview and Cash & Liquidity
function fpCashChart(W,H){
  const {f,pl}=FP_CASH13, n=f.length, all=f.concat(pl);
  const mn=Math.min(...all)*0.94, mx=Math.max(...all)*1.02;
  const X=i=>10+i*(W-20)/(n-1), Y=v=>H-18-((v-mn)/(mx-mn))*(H-30);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <path d="${path(f)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <path d="${path(pl)}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/>
    ${[0,4,8,12].map(i=>`<text x="${X(i)}" y="${H-4}" font-size="9" fill="var(--hint)" text-anchor="middle">Wk ${i+1}</text>`).join('')}
  </svg>
  <div style="display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--muted);margin-top:2px">
    <span><b style="color:var(--accent)">&#9473;&#9473;</b> Forecast</span>
    <span><b style="color:var(--accent);opacity:.55">&#9476;&#9476;</b> Plan</span></div>`;
}

const glIc=d=>`<svg viewBox="0 0 16 16" fill="none"><path d="${d}" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const glB=n=>'$'+(Math.abs(n)>=1000?(n/1000).toFixed(2)+'B':n.toFixed(1)+'M');
const glK=n=>{const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return n<0?'('+s+')':s;};
const glDelta=v=>`<span class="delta ${v>=0?'up':'dn'}">${v>=0?'&#9650;':'&#9660;'} ${Math.abs(v).toFixed(1)}%</span>`;
// GL headline figures derive from COA — same source as the statements, so they tie.
function glTotals(){
  // COA types are asset / contra / liab / equity / expense and the TB sums to zero.
  // Assets MUST include `contra` (accumulated depreciation) and equity MUST absorb the
  // un-closed `expense` balance, or the accounting identity fails. Asserted by glTies().
  const sum=t=>COA.filter(c=>c.type===t).reduce((a,c)=>a+c.tb,0);
  const A=sum('asset')+sum('contra');
  const L=-sum('liab');
  const E=-sum('equity')-sum('expense');
  const S=FINREP_SUPP;
  const rev=S.rentalRevenue+S.recoveries;
  const ni=rev+S.propertyOpex+S.gaExpense+coaBal('62000')+S.interestExpense+S.gainOnSale;
  return {assets:A,liab:L,equity:E,ni:ni};
}
// A = L + E must hold; surfaced on the Overview rather than silently assumed.
const glTies=()=>{const t=glTotals();return Math.abs(t.assets-(t.liab+t.equity))<0.05;};
function glDonut(pct,size,label){
  const r=size/2-9, C=2*Math.PI*r, off=C*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="11"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pos)" stroke-width="11"
      stroke-dasharray="${C}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2-1}" text-anchor="middle" font-size="${size/4.4}" font-weight="600" fill="var(--ink)">${pct}%</text>
    <text x="${size/2}" y="${size/2+15}" text-anchor="middle" font-size="9" fill="var(--hint)">${label||''}</text></svg>`;
}

// ---------------------------------------------------------------- 6. Trending review
function renderGLTrend(){
  const el=$('view-gltrend'); if(!el)return;
  const d=GL_TREND, n=d.length, hi=Math.max(...d), lo=Math.min(...d);
  const avg=Math.round(d.reduce((a,b)=>a+b,0)/n);
  const cagr=((Math.pow(d[n-1]/d[0],1/2.5)-1)*100).toFixed(1);
  const W=760,H=170,pad=8;
  const X=i=>pad+i*(W-pad*2)/(n-1), Y=v=>H-pad-((v-lo*0.94)/(hi*1.06-lo*0.94))*(H-pad*2);
  const line=d.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const ma=d.map((v,i)=>{const s=Math.max(0,i-11),w=d.slice(s,i+1);return w.reduce((a,b)=>a+b,0)/w.length;});
  const maLine=ma.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  let o=glHead('Trending review','Analyze account trends over time.',glExport+glSaveView);
  o+=`<div class="card"><div class="ctrls" style="margin-bottom:6px">
      <div class="grp"><label>Account category</label><select onchange="renderAll()"><option>Total revenue</option><option>Operating expenses</option></select></div>
      <div class="grp"><label>Entity</label><select onchange="renderAll()"><option>All entities</option></select></div>
      <div class="grp"><label>View by</label><select onchange="renderAll()"><option>Monthly</option><option>Quarterly</option></select></div>
      <div class="grp"><label>Date range</label><select onchange="renderAll()"><option>Jan 2024 - Jun 2026</option></select></div>
    </div></div>`;
  o+=`<div class="grid2gl" style="grid-template-columns:minmax(190px,240px) 1fr">
    <div>
      <div class="stat" style="margin-bottom:12px"><div class="sl">CAGR</div><div class="sv">${cagr}%</div></div>
      <div class="stat" style="margin-bottom:12px"><div class="sl">Average (30-mo)</div><div class="sv">$${avg.toLocaleString()}K</div></div>
      <div class="stat" style="margin-bottom:12px"><div class="sl">High</div><div class="sv">$${hi.toLocaleString()}K</div><div class="sd">Jun 2026</div></div>
      <div class="stat"><div class="sl">Low</div><div class="sv">$${lo.toLocaleString()}K</div><div class="sd">Feb 2024</div></div>
    </div>
    <div class="card" style="margin:0">
      <h2>Total revenue<span class="note">USD in thousands</span></h2>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        <path d="${maLine}" fill="none" stroke="var(--hint)" stroke-width="1.5" stroke-dasharray="5 4"/>
      </svg>
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)">
        <span><b style="color:var(--accent)">&#9473;&#9473;</b> Total revenue</span>
        <span><b style="color:var(--hint)">&#9476;&#9476;</b> 12-month moving average</span></div>
      <div class="cardfoot">${TREND_MONTHS[0]}<span class="sp"></span>${TREND_MONTHS[TREND_MONTHS.length-1]}</div>
    </div></div>`;
  el.innerHTML=o;
}

  const el=$('view-findex'); if(!el)return;
  const counts={all:FILINGS.length,
    draft:FILINGS.filter(f=>f.status==='draft').length,
    review:FILINGS.filter(f=>f.status==='review').length,
    filed:FILINGS.filter(f=>f.status==='filed').length};
  const rows=fRows();
  const pages=Math.max(1,Math.ceil(rows.length/fPer));
  if(fPage>pages) fPage=pages;
  const start=(fPage-1)*fPer, page=rows.slice(start,start+fPer);
  const car=c=>fSort.col===c?(fSort.dir==='asc'?'&#9652;':'&#9662;'):'&#8693;';
  const th=(c,l,cls)=>`<th class="sortable ${fSort.col===c?'act':''} ${cls||''}" onclick="setFSort('${c}')">${l}<span class="caret">${car(c)}</span></th>`;

  let h=`<div class="segbar">
    ${[['all','All filings'],['draft','Drafts'],['review','In Review'],['filed','Filed']].map(s=>
      `<button class="${fIndexSeg===s[0]?'on':''}" onclick="setFIndexSeg('${s[0]}')">${s[1]}<span class="ct">${counts[s[0]]}</span></button>`).join('')}
  </div>
  <div class="card">
    <h2>Filings<span class="note">${rows.length} filing${rows.length===1?'':'s'} &#183; sortable, paginated</span></h2>
    <div class="subhead">Every filing this portfolio has produced or has open. Open one to work its sections,
      comments, disclosures and approvals. The statements themselves derive from the same trial balance as
      General Ledger, so the numbers tie by construction.</div>
    <table class="tbl"><thead><tr>
      ${th('name','Filing name')}${th('entity','Entity')}${th('form','Form')}
      ${th('period','Period end')}${th('filed','Filed')}${th('status','Status')}
      ${th('ver','Version')}${th('owner','Owner')}${th('progress','Progress','num')}
    </tr></thead><tbody>`;
  page.forEach(f=>{
    const st=FILING_STATUS[f.status];
    h+=`<tr>
      <td><span class="linkish" onclick="openFiling('${f.id}')">${f.name}</span></td>
      <td>${f.entity}</td><td>${f.form}</td><td>${f.period}</td><td>${f.filed}</td>
      <td><span class="pill ${st.c}">${st.l}</span></td>
      <td>${f.ver}</td>
      <td>${avatar(f.owner)} <span style="font-size:12px">${teamNm(f.owner)}</span></td>
      <td class="num"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
        <span style="font-size:11.5px;color:var(--hint)">${filingProgress(f)}%</span>
        <span class="mini-bar"><i style="width:${filingProgress(f)}%"></i></span></div></td>
    </tr>`;
  });
  if(!page.length) h+=`<tr><td colspan="9" class="note">No filings in this state.</td></tr>`;
  h+=`</tbody></table>
    <div class="pager">
      <span class="cnt">Showing ${rows.length?start+1:0} to ${Math.min(start+fPer,rows.length)} of ${rows.length} filings</span>
      <button class="pgbtn" onclick="setFPage(${fPage-1})" ${fPage<=1?'disabled':''}>&#8249;</button>`;
  for(let i=1;i<=pages;i++) h+=`<button class="pgbtn ${i===fPage?'on':''}" onclick="setFPage(${i})">${i}</button>`;
  h+=`<button class="pgbtn" onclick="setFPage(${fPage+1})" ${fPage>=pages?'disabled':''}>&#8250;</button>
      <select onchange="setFPer(this.value)" style="margin-left:6px">
        ${[5,10,25].map(n=>`<option value="${n}" ${n===fPer?'selected':''}>${n} / page</option>`).join('')}
      </select>
    </div></div>`;
  el.innerHTML=h;
}

      ${stack}${legend}
    </div>
    <div class="card" style="margin:0">
      <h2>Key dates</h2>
      <div class="kdate">${ic('M3 4.5h10v9H3zM3 7h10M5.5 2.5v2M10.5 2.5v2')}<div><div class="kl">Filing period</div><div class="kv2">Jan 1 &#8211; ${f.period}</div></div></div>
      <div class="kdate">${ic('M3 4.5h10v9H3zM3 7h10M5.5 2.5v2M10.5 2.5v2')}<div><div class="kl">Due date</div><div class="kv2">${f.due}</div></div></div>
      <div class="kdate">${ic('M8 3.5v4.5l3 1.8M8 14A6 6 0 108 2a6 6 0 000 12z')}<div><div class="kl">Target filing</div><div class="kv2">${f.filed}</div></div></div>
      <div class="kdate">${ic('M8 3.5v4.5l3 1.8M8 14A6 6 0 108 2a6 6 0 000 12z')}<div><div class="kl">Last updated</div><div class="kv2">Jun 18, 2026 10:42 AM</div></div></div>
    </div>
    <div class="card" style="margin:0">
      <h2>Filing team</h2>
      ${team.slice(0,4).map(k=>`<div class="person">${avatar(k)}
        <div><div class="pn">${FILING_TEAM[k].nm}${k===f.owner?' <span style="font-weight:400;color:var(--hint)">(Owner)</span>':''}</div>
        <div class="pr">${FILING_TEAM[k].role}</div></div></div>`).join('')}
      <div style="display:flex;align-items:center;gap:9px;margin-top:4px">

    </div>
    <div class="card" style="margin:0">
      <h2>Recent activity</h2>
      ${FILING_ACTIVITY.map(a=>`<div class="person">${avatar(a.who)}

  let t=`<div class="card" style="margin:0">
    <h2>Filing sections<span class="note">${treeCounts().total} items</span></h2>`;
  FILING_TREE.forEach(g=>{
    const open=!!fTreeOpen[g.nm];

function fdCommentBlock(){
  const PT=[['comments','Review & Comments',FILING_COMMENTS.length],['notes','Notes',FILING_NOTES.length],
            ['disc','Disclosures',FILING_DISCLOSURES.length],['history','History',0]];
  let o=`<div class="ptabs">`+PT.map(t=>
    `<button class="${fPaneTab===t[0]?'on':''}" onclick="setPaneTab('${t[0]}')">${t[1]}${t[2]?` (${t[2]})`:''}</button>`).join('')+`</div>`;

  if(fPaneTab!=='comments'){
    const rows={notes:FILING_NOTES.map(n=>[n.t,n.sec,teamNm(n.who),n.upd]),
                disc:FILING_DISCLOSURES.map(d=>[d.t,d.sec,teamNm(d.own),d.upd]),
                history:[['Version v3 published','Item 1A','Mitra Giri','Jun 18, 2026 10:42 AM'],
                         ['Blackline generated','Item 1A','System','Jun 18, 2026 10:40 AM'],
                         ['Version v2 published','Item 1A','A. Johnson','Jun 16, 2026 2:12 PM']]}[fPaneTab]||[];
    o+=`<table class="tbl"><thead><tr><th>Item</th><th>Section</th><th>Who</th><th>When</th></tr></thead><tbody>`
     + rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')
     + `</tbody></table>`;
    return o;
  }

  let cs=FILING_COMMENTS.slice();
  if(!fShowResolved) cs=cs.filter(c=>c.st!=='resolved');
  if(fCommentSort==='old') cs.reverse();
  const shown=cs.slice(0,3);
  const CST={open:{l:'Open',c:'ready'},progress:{l:'In progress',c:'info'},resolved:{l:'Resolved',c:'good'}};
  o+=`<div class="ctoolbar">
    <button class="btn-primary" onclick="setFDetailTab('review')">+ Add comment</button>
    <button class="btn-out" onclick="toggleFilters()">
      <svg viewBox="0 0 16 16" fill="none"><path d="M2 3h12M4 8h8M6 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Filters</button>
    <span class="sp"></span>
    <span class="tgl ${fShowResolved?'on':''}" onclick="toggleResolved()">Show resolved<span class="track"><i></i></span></span>
    <select onchange="setCommentSort(this.value)" style="width:auto">
      <option value="new" ${fCommentSort==='new'?'selected':''}>Sort: Newest</option>
      <option value="old" ${fCommentSort==='old'?'selected':''}>Sort: Oldest</option>
    </select></div>`;
  o+=shown.map(c=>{const s=CST[c.st]||CST.open;return `<div class="cmt">${avatar(c.who)}
    <div class="cbody"><div class="chd"><span class="cnm">${teamNm(c.who)}</span>
      <span class="crole">${(FILING_TEAM[c.who]||{}).role||''}</span>
      <span class="ctime">${c.dt}</span>
      <span class="cst"><span class="pill ${s.c}">${s.l}</span><span class="dact">&#8942;</span></span></div>
      <div class="ctxt">${c.t}</div></div></div>`;}).join('');
  o+=`<div class="note" style="margin-top:12px">Showing 1 to ${shown.length} of ${cs.length} comments</div>`;
  return o;
}

function renderFinRep(){

  // ---- derive statement figures from COA + supplemental ----
  // Balance sheet
  const grossPPE = ['15000','15100','15200','15300','15400','15500','15600'].reduce((a,x)=>a+coaBal(x),0);
  const accumDep = coaBal('15900');                 // negative
  const netPPE   = grossPPE + accumDep;
  const totalAssets = netPPE;                        // (this illustrative TB is capital-only)
  const ap       = -coaBal('20000');
  const accrued  = -coaBal('21000');
  const retention= -coaBal('22000');
  const leaseLiab= -coaBal('25000');
  const loan     = -coaBal('27000');
  const totalLiab= ap+accrued+retention+leaseLiab+loan;
  const icContrib= -coaBal('30000');
  const lpEquity = -coaBal('31000');
  const totalEquityBook = icContrib+lpEquity;
  const totalLE  = totalLiab + totalEquityBook;
  const balCheck = totalAssets - totalLE;            // residual = retained earnings / net income to date

  // Income statement
  const totalRev = S.rentalRevenue + S.recoveries;
  const noi = totalRev + S.propertyOpex;             // net operating income
  const dep = coaBal('62000');                        // depreciation expense (positive)
  const ebitda = noi + S.gaExpense;
  const ebit = ebitda - dep;
  const preTax = ebit + S.interestExpense + S.gainOnSale;
  const netIncome = preTax;                           // no tax layer (REIT pass-through)

  // FFO / AFFO (NAREIT)
  const ffo = netIncome + dep - S.gainOnSale;         // add back RE depreciation, remove gains
  const affo = ffo + S.straightLineRent + S.maintCapex + 0; // less SL rent, less maint capex

  // Cash flow (indirect)
  const cfoAdjust = dep + S.capitalizedInt*0 + S.straightLineRent; // non-cash addbacks
  const cfo = netIncome + dep + S.straightLineRent;
  const cfi = -(grossPPE*0.18) + S.gainOnSale*0 + 12.0; // illustrative: capex outflow + disposition proceeds
  const cff = S.drawsOnFacility + S.equityContrib + S.distributions;
  const netCash = cfo + cfi + cff;

  const derived={grossPPE,accumDep,netPPE,totalAssets,ap,accrued,retention,leaseLiab,loan,icContrib,lpEquity,
    totalLiab,totalEquity:totalEquityBook,totalLE,totalRev,noi,dep,netIncome,cfo,cfi,cff,ffo,affo};

  // ---- KPI strip ----
  let h=`<div class="kpis">
    <div class="kpi lenshi"><div class="k">Net income</div><div class="v">${money0(netIncome)}</div><div class="d">period · REIT pass-through</div><div class="lenstag">▸ General Ledger headline</div></div>
    <div class="kpi"><div class="k">FFO</div><div class="v">${money0(ffo)}</div><div class="d">NAREIT · ${pct(ffo/totalRev*100)} of revenue</div></div>
    <div class="kpi"><div class="k">AFFO</div><div class="v">${money0(affo)}</div><div class="d">after maint capex + SL rent</div></div>
    <div class="kpi good"><div class="k">Balance sheet</div><div class="v">Ties</div><div class="d">A = L + E ✓</div></div>
  </div>`;

  if(finRepSub==='trend'){
    h+=`<div class="card"><h2>Trending review<span class="note">multi-period trend for balance sheet & income statement</span></h2>
      <div class="subhead">Placeholder — this mode will show multi-period trending across the balance sheet and income statement. Tell me the columns and horizon you want (e.g. trailing 6 months, quarterly with % of revenue, etc.) and I'll build it.</div>
      <div class="note">Coming next: BS and IS trend views.</div></div>`;
    el.innerHTML=h; return;
  }

  // ===================== FLUX REVIEW =====================
  const model=fluxModel(fluxStmt,S,derived);
  const P=fluxPeriodInfo();
  const itd=model.point;
  const curLbl = itd ? P.cur.end : (P.consecutive?P.cur.lbl:P.pri.lbl+'–'+P.cur.lbl);
  const priLbl = itd ? P.pri.end : (P.consecutive?P.pri.lbl:'Prior');
  const cal=FLUX_CAL[fluxGrain];
  // per-period flow factor and range-aware scaling.
  const perScale = fluxGrain==='m'?(1/12):(1/4);
  // For point-in-time (BS/Equity): cur = balance at To, pri = balance at From (both ITD).
  // For flows (IS/CF): cur = summed activity across the range (span periods), pri = one prior-period baseline.
  const toFactor   = 1.00;                                  // balance/activity at To (illustrative baseline)
  const fromFactor = 0.90 + 0.02*P.from;                    // earlier period smaller (illustrative)
  const curScale = itd ? 1 : (perScale * P.span);           // flows sum over the span
  const priScale = itd ? 1 : perScale;                      // single prior-period baseline
  const valCur = v=> v*curScale*toFactor;
  const valPri = v=> v*priScale*fromFactor;

  // sign-off status
  let flaggedCount=0, explainedCount=0, lockedCount=0;
  model.lines.filter(l=>!l.tot).forEach(l=>{
    const cur=valCur(l.v), pri=valPri(l.v), d=cur-pri, dp=pri!==0?Math.abs(d/pri*100):0;
    const flagged=Math.abs(d)>=FLUX_THRESH_ABS||dp>=FLUX_THRESH_PCT;
    const c=fluxComments[fluxStmt+'::'+P.tag+'::'+l.l];
    if(flagged) flaggedCount++;
    if(flagged && c && c.text) explainedCount++;
    if(c && c.locked) lockedCount++;
  });
  const signedOff = flaggedCount>0 && explainedCount>=flaggedCount && lockedCount>=flaggedCount;

  h+=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Flux review — ${model.title}<span class="note">${P.pri.lbl} → ${P.cur.lbl} · ${P.compare} · ${itd?'change in ITD balances':'movement'}</span></h2>
      <span class="note" style="font-size:11px">Set the range in <b>Filters ▸ Flux range</b> above</span>
    </div>
    <div class="subhead">${itd
      ? `Endpoint comparison: ITD balance at ${P.cur.end} vs ${P.pri.end}; the flux is the total change across the range.`
      : (P.consecutive
          ? `${P.cur.lbl} vs ${P.pri.lbl} activity.`
          : `Activity summed across ${P.pri.lbl}–${P.cur.lbl} (${P.span} ${fluxGrain==='m'?'months':'quarters'}) vs a prior-period baseline.`)} Movements above ${FLUX_THRESH_PCT}% or ${money(FLUX_THRESH_ABS)} are auto-flagged. Comment at any level, then lock to sign off. Locked comments flow to SEC reporting.
      <span class="flux-status ${signedOff?'ok':'pending'}">${signedOff?'✓ '+model.title+' '+P.pri.lbl+'→'+P.cur.lbl+' signed off':flaggedCount+' flagged · '+explainedCount+'/'+flaggedCount+' explained · '+lockedCount+' locked'}</span></div>
    <table class="tbl flux-tbl"><thead><tr><th>Category</th><th class="num">${curLbl}${itd?' (ITD)':''}</th><th class="num">${priLbl}${itd?' (ITD)':''}</th><th class="num">Δ ${itd?'(change)':'$'}</th><th class="num">Δ %</th><th>Comment</th></tr></thead><tbody>`;

  // shared comment-cell renderer for any level (uses a stable lineId)
  const cmtCellFor=(lineId,flagged)=>{
    const k=fluxKeyFor(lineId), c=fluxComments[k];
    const idAttr=lineId.replace(/'/g,"&#39;");
    if(fluxEditing===k){
      return `<div class="flux-edit">

    }

  };

  model.lines.forEach(line=>{
    const cur=valCur(line.v), pri=valPri(line.v), d=cur-pri, dp=pri!==0?d/pri*100:0;
    if(line.tot){
      // totals are commentable too (level: subtotal)
      h+=`<tr class="flux-tot"><td>${line.l}</td><td class="num">${money(cur)}</td><td class="num">${money(pri)}</td><td class="num">${d>=0?'':'('}${money(Math.abs(d))}${d>=0?'':')'}</td><td class="num">${dp>=0?'+':''}${dp.toFixed(1)}%</td>
        <td onclick="event.stopPropagation()">${cmtCellFor(line.l, false)}</td></tr>`;
      return;
    }
    const flagged=Math.abs(d)>=FLUX_THRESH_ABS||Math.abs(dp)>=FLUX_THRESH_PCT;
    const glKey=fluxStmt+'::'+line.l, glOpen=!!fluxGLOpen[glKey];
    h+=`<tr class="row-click" onclick="toggleFluxGL('${line.l.replace(/'/g,"&#39;")}')">

      <td onclick="event.stopPropagation()">${cmtCellFor(line.l, flagged)}</td></tr>`;
    if(glOpen){
      line.gl.forEach(([acct,name,share])=>{
        const gcur=cur*share, gpri=pri*share, gd=gcur-gpri, gdp=gpri!==0?gd/gpri*100:0;
        const gFlag=Math.abs(gd)>=FLUX_THRESH_ABS||Math.abs(gdp)>=FLUX_THRESH_PCT;
        const glLineId=line.l+' › '+acct;   // distinct comment key at GL level
        h+=`<tr class="flux-gl"><td style="padding-left:34px"><span class="pill info sm">${acct}</span> ${name}</td>

          <td onclick="event.stopPropagation()">${cmtCellFor(glLineId, gFlag)}</td></tr>`;
      });
    }

  h+=`</tbody></table>
    <div class="note">Expand any category to the GL accounts beneath it. Comments are tracked separately per statement and per period (MoM vs QoQ); locking records who signed off and when, and freezes the text. Locked explanations flow to the SEC filing view as disclosure notes with sign-off status. Prior-period figures are illustrative here.</div></div>`;

  el.innerHTML=h;
}

// ============================================================ AI COMMAND ENGINE
// Parses a natural-language command into: (1) a direct answer to a reconciliation/
// analytical question, (2) a re-scope of filters + tab, or (3) a universal search
// across every entity — accounts, vendors, POs, invoices, JEs, sites, halls.
const SUGGESTIONS=[

function aiAnswer(q,bodyHTML,hits,actions){
  const p=$('aiPanel'); p.classList.add('show');
  let h=`<div class="ai-head"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2l1.8 4.7L16.5 8.5 11.8 10.3 10 15l-1.8-4.7L3.5 8.5l4.7-1.8z" fill="currentColor"/></svg>KORVYN AI<button class="close" onclick="document.getElementById('aiPanel').classList.remove('show')">×</button></div>
    <div class="ai-q">${q}</div><div class="ai-body">${bodyHTML}</div>`;
  if(hits&&hits.length){
    h+='<div class="ai-hits">'+hits.map(x=>
      `<div class="ai-hit" onclick="${x.action||''}"><span class="badge badge-${x.kind}">${x.kind}</span><span>${x.label}</span>${x.amt!=null?`<span class="amt">${money(x.amt)}</span>`:''}</div>`).join('')+'</div>';
  }
  if(actions&&actions.length){
    h+='<div class="ai-action">'+actions.map(a=>`<button class="btn-x" onclick="${a.fn}">${a.label}</button>`).join('')+'</div>';
  }
  p.innerHTML=h; p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
// universal search index
function searchIndex(term){
  term=term.toLowerCase(); const hits=[];
  COA.forEach(c=>{ if((c.acct+' '+c.name).toLowerCase().includes(term))
    hits.push({kind:'acct',label:`${c.acct} · ${c.name}`,amt:c.tb,action:`gotoTB('${c.acct}')`}); });
  [...new Set(TX.map(r=>r[IDX.vendor]))].forEach(v=>{ if(v.toLowerCase().includes(term)){
    const inc=TX.filter(r=>r[IDX.vendor]===v).reduce((a,r)=>a+conv(r[IDX.incurred],r[IDX.ccy]),0);
    hits.push({kind:'vendor',label:v,amt:inc,action:`gotoTab('po')`}); }});
  [...new Set(TX.map(r=>r[IDX.site]))].forEach(s=>{ if(s.toLowerCase().includes(term)){
    const o=siteOwn(s); hits.push({kind:'site',label:`${s} · ${o.std}`,action:`gotoTab('ppe')`}); }});
  TX.forEach((r,idx)=>{ const po='po-'+(1000+idx); if(po.includes(term.replace(/\s/g,'')))
    hits.push({kind:'po',label:`PO-${1000+idx} · ${r[IDX.vendor]} · ${r[IDX.site]}`,amt:conv(r[IDX.committed],r[IDX.ccy]),action:`gotoTab('po')`}); });
  GL_JE.forEach(j=>{ if((j.je+' '+j.memo+' '+(j.src||'')).toLowerCase().includes(term))
    hits.push({kind:'je',label:`${j.je} · ${j.memo}`,amt:j.dr||-j.cr,action:`traceJE('${j.je}')`}); });
  HALLS.forEach(h=>{ if(h.h.toLowerCase().includes(term))
    hits.push({kind:'hall',label:`${h.h} · ${h.status==='service'?'in service':h.status}`,amt:h.cip,action:`gotoTab('ppe')`}); });
  return hits;
}

function runCommand(raw){
  const q=(raw||$('cmd').value||'').trim(); if(!q)return;
  $('cmd').value=q;
  const s=q.toLowerCase();

  // 1 — reconciliation: "why doesn't Fund II tie out"
  if(s.includes('tie out')||s.includes('reconcile')||(s.includes('why')&&s.includes('fund'))){
    aiAnswer(q,
      `Fund II (EMEA, ring-fenced) ties out on the actuals side — its PO → invoice → payment chain reconciles by construction. The <b>$0.2M</b> gap on the consolidated TB comes from account <b>20000 Accounts payable</b>: a non-PO manual invoice (a local surveyor in London) with no commitment edge to trace against. It's a legitimate accrual — it correctly appears in <b>incurred but not committed</b>. The larger reconciling item, <b>$8.2M</b> on <b>30000</b>, is an intercompany capital contribution that eliminates on consolidation and carries no spine edge by design. Both are named, not unexplained — so the spine still ties to the GL, with exactly two reconciling items.`,
      [{kind:'acct',label:'20000 · Accounts payable — non-PO accrual',amt:-0.2,action:"gotoTB('20000')"},
       {kind:'acct',label:'30000 · IC capital contribution — eliminates on consol',amt:-8.2,action:"gotoTB('30000')"}],
      [{label:'Open trial balance ↗',fn:"gotoTab('tb')"}]);
    return;
  }
  // 2 — unposted / phantom / exceptions
  if(s.includes('unposted')||s.includes('phantom')||s.includes('exception')){
    const thr=(s.match(/\$?\s?(\d+(?:\.\d+)?)\s?m?/)||[])[1];
    aiAnswer(q,
      `Running the cash-anchored ceiling test across the current scope: GL total cost is fully explained by cash out + accruals + timing, so the <b>unexplained residual is $0.0M</b> — no phantom cost. There are <b>3 unposted edges</b> awaiting a journal entry (invoices received, not yet in the GL)${thr?`, none above <b>$${thr}M</b>`:''}. The reverse ceiling test catches fabricated cost even when a link can't be reconstructed — it works on totals against bank-confirmed cash, which is ground truth.`,
      [{kind:'je',label:'Pending — INV-9140 · Kajima · Singapore',amt:9.5,action:"gotoTab('po')"},
       {kind:'je',label:'Pending — INV-9160 · Obayashi · Tokyo',amt:20.4,action:"gotoTab('po')"}],
      [{label:'Open ceiling test ↗',fn:"gotoTab('overview')"}]);
    return;
  }
  // 3 — carve / placed in service / trace hall
  if(s.includes('carve')||s.includes('placed in service')||s.includes('pis')||(s.includes('hall')&&s.includes('trace'))){
    aiAnswer(q,
      `Hall A was placed in service in 2025-Q4. Its accumulated CIP basis of <b>$44.2M</b> carved out of account 15000 and into the asset classes by the standard fit-out ratio: land 10% (<b>$4.4M</b>), shell 45% (<b>$19.9M</b>), M&E 40% (<b>$17.7M</b>), software 5% (<b>$2.2M</b>). Each carve posted a journal entry crediting 15000 CIP and debiting the destination account — this is the dated edge the spine records and FAM leaves to a spreadsheet.`,
      [{kind:'je',label:'JE-4402 · Hall A carve out of CIP',amt:-44.2,action:"traceJE('JE-4402')"},
       {kind:'je',label:'JE-4404 · → shell (45%)',amt:19.9,action:"traceJE('JE-4404')"},
       {kind:'je',label:'JE-4405 · → M&E (40%)',amt:17.7,action:"traceJE('JE-4405')"}],
      [{label:'Open PP&E rollforward ↗',fn:"gotoTab('ppe')"}]);
    return;
  }
  // 4 — open commitment / forecast
  if(s.includes('open commitment')||s.includes('forecast')||(s.includes('committed')&&s.includes('not'))){
    const P=portfolio();
    aiAnswer(q,
      `Across the current scope, <b>${money(P.openCommit)}</b> is committed but not yet incurred — signed-up-for spend that hasn't been billed. That's the committed–incurred gap, the number two-measure tools miss and the one that wrecks forecasts. Committed is ${money(P.committed)}; incurred is ${money(P.incurred)}. Switch to Trending to watch commitment convert into spend quarter by quarter.`,
      [], [{label:'Open trending ↗',fn:"gotoTab('trend')"},{label:'Four-measure view ↗',fn:"gotoTab('overview')"}]);
    return;
  }
  // 5 — scope commands: "show me EMEA", "filter to Fund II", "APAC in local currency"
  let scoped=false, msg=[];
  if(s.includes('emea')){$('regionScope').value='EMEA';scoped=true;msg.push('region → EMEA');}
  else if(s.includes('apac')){$('regionScope').value='APAC';scoped=true;msg.push('region → APAC');}
  else if(s.includes('americas')||s.includes('us ')){$('regionScope').value='Americas';scoped=true;msg.push('region → Americas');}
  if(s.includes('fund ii')||s.includes('fund 2')){$('fundScope').value='F2';scoped=true;msg.push('fund → Fund II');}
  else if(s.includes('fund iii')||s.includes('fund 3')){$('fundScope').value='F3';scoped=true;msg.push('fund → Fund III');}
  else if(s.includes('fund i')||s.includes('fund 1')){$('fundScope').value='F1';scoped=true;msg.push('fund → Fund I');}
  if(s.includes('local')){const cm=$('ccyMode');[...cm.children].forEach(b=>b.classList.toggle('on',b.dataset.v==='local'));cm.dataset.v='local';scoped=true;msg.push('currency → local');}
  if(s.includes('leasehold')||s.includes('lhi')){$('ownType').value='lhi';scoped=true;msg.push('ownership → leasehold');}
  else if(s.includes('owned')){$('ownType').value='own';scoped=true;msg.push('ownership → owned');}
  else if(s.includes('rou')){$('ownType').value='rou';scoped=true;msg.push('ownership → ROU');}
  if(scoped){
    readFilters(); const P=portfolio();
    aiAnswer(q,`Re-scoped the whole dashboard: <b>${msg.join(' · ')}</b>. In this scope, committed is <b>${money(P.committed)}</b>, incurred <b>${money(P.incurred)}</b>, paid <b>${money(P.paid)}</b>. Every tab now reflects this filter state.`,[],[]);
    renderAll(); return;
  }
  // 6 — universal search fallback
  const hits=searchIndex(s.replace(/^(find|show|search|trace|open|get)\s+/,''));
  if(hits.length){
    aiAnswer(q,`Found <b>${hits.length}</b> match${hits.length>1?'es':''} across accounts, vendors, POs, journal entries, sites, and halls. Click any result to jump to it — the dashboard re-scopes and drills automatically.`,hits.slice(0,8),[]);
  } else {
    aiAnswer(q,`No exact match. Try a GL account (15000), a PO (PO-1003), a vendor (Vertiv), a site (Ashburn), or a question like "why doesn't Fund II tie out?" — the command bar searches every entity in the spine and answers reconciliation questions directly.`,[],[]);
  }
}

    `<button class="railrole ${on?'on':''}" onclick="${onclick}" title="${label}">${icon}<span class="lbl">${label}</span>${extra||''}</button>`;

  if(lbl) lbl.textContent=LENSES[LENS]?LENSES[LENS].label:'Section';
  if(box){
    const spec=RAIL_SPEC[LENS];
    if(spec&&spec.some(x=>x.head)&&lbl) lbl.style.display='none';
    if(inUtil){
      box.innerHTML=''; if(lbl) lbl.style.display='none';
    } else if(spec){
      // structured rail: optional children + live badges
      if(lbl) lbl.style.display='';
      box.innerHTML=spec.map(it=>{
        if(it.head) return `<div class="rail-grouplbl">${it.head}</div>`;   // section heading
        // `on`/`act` let an entry target existing state (e.g. Flux review = finrep + finRepSub)
        // instead of forcing a new tab for every rail destination.
        const active = it.on ? !!it.on()
                     : it.lens ? (LENS===it.lens)
                     : (TAB===it.tab && (!it.sub || fDetailTab===it.sub));
        const go = it.act ? it.act
                 : it.lens ? `pickLens('${it.lens}')`
                 : (it.sub ? `setFDetailTab('${it.sub}');pickTab('${it.tab}')` : `pickTab('${it.tab}')`);
        let extra='';
        if(it.badge){ const n=it.badge(); if(n) extra=`<span class="rbadge ${it.mut?'mut':''}">${n}</span>`; }
        if(it.kids) extra=`<svg class="rchev" viewBox="0 0 16 16" fill="none"><path d="M4 6.5L8 10l4-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const open=!!railExpanded[it.label];
        let out=`<button class="railrole ${active?'on':''} ${open?'exp':''}" title="${it.label}" onclick="${it.kids?`toggleRailGroup('${it.label}');`:''}${go}">${path(it.ic)}<span class="lbl">${it.label}</span>${extra}</button>`;
        if(it.kids){
          out+=`<div class="railkids ${open?'open':''}">`+it.kids.map(k=>{
            const kon = k.seg ? (TAB==='findex'&&fIndexSeg===k.seg)
                      : k.sub ? (TAB==='fdetail'&&fDetailTab===k.sub)
                      : (TAB===k.tab);
            const kgo = k.seg ? `setFIndexSeg('${k.seg}');pickTab('findex')`
                      : k.sub ? `setFDetailTab('${k.sub}');pickTab('fdetail')`
                      : `pickTab('${k.tab}')`;
            return `<button class="railkid ${kon?'on':''}" onclick="${kgo}">${k.label}</button>`;
          }).join('')+`</div>`;
        }
        return out;
      }).join('');
    } else if(LENS==='procure'){
      if(lbl) lbl.style.display='';
      box.innerHTML=PROC_SUBS.map(s=>
        btn(procSub===s.id,`setProcSub('${s.id}')`,path(s.ic),s.label)).join('');
    } else {
      if(lbl) lbl.style.display='';
      box.innerHTML=(LENSES[LENS]?LENSES[LENS].tabs:[]).map(id=>{
        const t=TABS.find(x=>x.id===id); if(!t)return '';
        return btn(id===TAB,`pickTab('${id}')`,path(t.ic),t.label);
      }).join('');
    }
  }

  // on narrow screens the rail is an overlay -- dismiss it once a destination is picked
  document.querySelectorAll('#railTabs .railrole,#railTabs .railkid').forEach(b=>
    b.addEventListener('click',()=>document.body.classList.remove('nav-open')));
}

function fundOf(word){ if(/fund\s*ii|fund\s*2/i.test(word))return 'F2'; if(/fund\s*iii|fund\s*3/i.test(word))return 'F3'; if(/fund\s*i\b|fund\s*1/i.test(word))return 'F1'; return null; }
function measureOf(word){ if(/commit/i.test(word))return 'committed'; if(/incur|spent|spend|actual/i.test(word))return 'incurred'; if(/paid|cash/i.test(word))return 'paid'; return null; }
function catOf(word){ if(/power|genset|pdu/i.test(word))return 'power'; if(/shell|structure|building/i.test(word))return 'shell'; if(/m&e|mne|fit|mechanical|electrical/i.test(word))return 'mne'; return null; }

// ============ THE "MODEL": intent parser → structured action ============
// Returns {action, slots:{}, raw}. In production this is Claude's tool-choice.
function parseIntent(raw){
  const s=raw.toLowerCase().trim();
  const slots={};
  // entity extraction (fills conversation memory)
  const acct=(s.match(/\b(1[0-9]{4}|2[0-9]{4}|3[0-9]{4}|6[0-9]{4})\b/)||[])[1];
  const po=(s.match(/po-?\s?(\d{3,4})/)||[])[0];
  const region=regionOf(s), fund=fundOf(s), measure=measureOf(s), cat=catOf(s);
  const byQ=/by quarter|quarterly|per quarter|over time|trend/.test(s);
  const local=/local|native currency/.test(s);
  const overM=(s.match(/over \$?\s?(\d+(?:\.\d+)?)\s?m/)||[])[1];
  if(acct)slots.account=acct; if(po)slots.po=po.toUpperCase().replace(' ','');
  if(region)slots.region=region; if(fund)slots.fund=fund;
  if(measure)slots.measure=measure; if(cat)slots.cat=cat;
  if(byQ)slots.byQuarter=true; if(local)slots.local=true; if(overM)slots.over=+overM;

  // pronoun/context resolution — "just the london piece", "show me that by quarter"
  if(/\b(that|this|it|those)\b/.test(s)&&!region&&!fund&&!acct){ Object.assign(slots,{contextual:true}); }
  if(/london/.test(s))slots.site='London'; if(/dublin/.test(s))slots.site='Dublin';
  if(/ashburn/.test(s))slots.site='Ashburn VA'; if(/singapore/.test(s))slots.site='Singapore';
  if(/tokyo/.test(s))slots.site='Tokyo'; if(/dallas/.test(s))slots.site='Dallas TX';

  // action classification (priority-ordered, like a tool router)
  let action='search';
  if(/tie out|reconcile|doesn't tie|reconciliation|why.*(gap|differ)/.test(s)) action='reconcile';
  else if(/phantom|unposted|unexplained|ceiling|exception/.test(s)) action='ceiling';
  else if(/carve|placed in service|\bpis\b/.test(s)) action='carve';
  else if(/(build|create|make|generate|produce|give me).*(report|variance|breakdown|table|summary|analysis|chart)/.test(s)
          ||/variance (report|by|breakdown)/.test(s)||(cat&&byQ)||(measure&&byQ)) action='report';
  else if(/open commitment|forecast risk|committed but not|not yet (billed|incurred)/.test(s)) action='commitment';
  else if(/(show|filter|scope|switch|go to|open|take me).*(emea|apac|america|fund|local|leasehold|owned|rou)/.test(s)
          ||((region||fund||local)&&/(show|filter|scope|only|just)/.test(s))) action='scope';
  else if(/(open|go to|show).*(trial balance|ceiling|rollforward|pp&e|ppe|trend|pivot|consol|budget|po|overview)/.test(s)) action='navigate';
  else if(acct||po) action='trace';
  return {action,slots,raw};
}

// ============ streaming primitives ============
function cpScroll(){ const t=$('cpThread'); if(t)t.scrollTop=t.scrollHeight; }
function cpAddUser(text){ const t=$('cpThread'); const d=document.createElement('div'); d.className='cp-msg-u'; d.textContent=text; t.appendChild(d); cpScroll(); }
function cpAddAgent(){ const t=$('cpThread'); if(!t)return document.createElement('div'); const w=document.createElement('div'); w.className='cp-msg-a'; t.appendChild(w); return w; }
function cpThink(wrap,steps,done){
  const el=document.createElement('div'); el.className='cp-think'; wrap.appendChild(el);
  let i=0; const run=()=>{ if(i>=steps.length){ el.classList.add('done'); el.innerHTML=`<i class="ti"></i>`; el.querySelector('i').textContent='✓'; el.insertAdjacentText('beforeend',' grounded in spine'); done&&done(); return; }
    el.innerHTML=`<span class="sp"></span>${steps[i]}`; cpScroll(); i++; setTimeout(run, 340+Math.random()*220); };
  run();
}
function cpTypeInto(node,html,cb){
  // stream HTML by revealing character windows on a hidden buffer
  node.classList.add('cp-cursor'); node.innerHTML='';
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const full=tmp.innerHTML; let i=0; const step=Math.max(2,Math.floor(full.length/90));
  const run=()=>{ i+=step; node.innerHTML=full.slice(0,i);
    if(i<full.length){ cpScroll(); setTimeout(run,16); } else { node.innerHTML=full; node.classList.remove('cp-cursor'); cpScroll(); cb&&cb(); } };
  run();
}
function cpBody(wrap){ const b=document.createElement('div'); b.className='cp-body'; wrap.appendChild(b); return b; }
function cpAppend(wrap,el){ wrap.appendChild(el); cpScroll(); }

// agentic: build a report artifact (table + chart), grounded + pinnable
function ansReport(slots){
  // resolve scope from slots, falling back to conversation memory
  const region=slots.region||CP.ctx.region;
  const cat=slots.cat||CP.ctx.cat;
  const rows=scoped().filter(r=>(!region||r[IDX.region]===region)&&(!cat||txCat(r)===cat));
  const label=[region,cat&&CAT_META[cat].name].filter(Boolean).join(' · ')||'portfolio';
  if(slots.byQuarter){
    // build a quarterly series for incurred (the measure), grounded in monthVal
    const series=QUARTERS.map(q=>{
      const v=rows.reduce((a,r)=>{ let s=0; (Q_MONTHS[q]||[]).forEach(m=>s+=monthVal(r,slots.measure||'incurred',m)); return a+conv(s,r[IDX.ccy]); },0);
      return {q,v:+v.toFixed(1)};
    });
    const bud=rows.reduce((a,r)=>a+catBudget(r[IDX.region],txCat(r),conv(r[IDX.incurred],r[IDX.ccy])),0);
    const inc=rows.reduce((a,r)=>a+conv(r[IDX.incurred],r[IDX.ccy]),0);
    const body=`Built a quarterly ${slots.measure||'incurred'} report for <b>${label}</b>${slots.local?' in local currency':''}. Budget across this slice is <span class="fig">${cpMoney(bud)}</span> against <span class="fig">${cpMoney(inc)}</span> incurred — the trend shows how commitment is converting into spend, quarter by quarter.`;
    const chart=artChart(`${label} — ${slots.measure||'incurred'} by quarter`, series.map(x=>({label:x.q.replace('2025-','').replace('2026-',''),v:x.v})));
    return {body,artifacts:[chart],cites:[{label:region||'all regions',action:"cpJump(\"gotoTab('trend')\")"}],
      actions:[{label:'Pin to dashboard',pri:true,fn:'cpPinLast()',icon:''},{label:'Open in Trending',fn:"cpJump(\"gotoTab('trend')\")"}],agentic:'built a chart artifact'};
  }
  // otherwise a variance table by category
  const cats=[...new Set(rows.map(txCat))];
  const trows=cats.map(c=>{
    const crs=rows.filter(r=>txCat(r)===c);
    const inc=crs.reduce((a,r)=>a+conv(r[IDX.incurred],r[IDX.ccy]),0);
    const b=crs.reduce((a,r)=>a+catBudget(r[IDX.region],c,conv(r[IDX.incurred],r[IDX.ccy])),0);
    return [CAT_META[c].name, cpMoney(b), cpMoney(inc), cpMoney(b-inc)];
  });
  const tot=trows.reduce((a,r)=>a,[]);
  const body=`Built a variance report for <b>${label}</b>. Each line is budget vs. incurred at the category grain, tying to the same numbers that hit the ledger.`;
  const art=artTable(`${label} — budget vs. actual`,['Category','Budget','Incurred','Variance'],trows,null);
  return {body,artifacts:[art],cites:[{label:'category × region budget',action:"cpJump(\"gotoTab('budget')\")"}],
    actions:[{label:'Pin to dashboard',pri:true,fn:'cpPinLast()'},{label:'Open Budget vs. actual',fn:"cpJump(\"gotoTab('budget')\")"}],agentic:'built a table artifact'};
}

function artTable(title,head,rows,foot){
  const el=document.createElement('div'); el.className='cp-art';
  let h=`<div class="cp-art-h"><i class="ti"></i>${title}<span class="ai-badge">generated</span></div><table><thead><tr>`;
  head.forEach((c,i)=>h+=`<th class="${i>0?'n':''}">${c}</th>`); h+='</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr>'; r.forEach((c,i)=>h+=`<td class="${i>0?'n':''}">${c}</td>`); h+='</tr>'; });
  h+='</tbody>'; if(foot){ h+='<tfoot><tr>'; foot.forEach((c,i)=>h+=`<td class="${i>0?'n':''}">${c}</td>`); h+='</tr></tfoot>'; }
  h+='</table>'; el.innerHTML=h; el._artType='table'; el._artData={title,head,rows,foot}; return el;
}
function artChart(title,points){
  const el=document.createElement('div'); el.className='cp-art'; const max=Math.max(...points.map(p=>p.v),1);
  let bars=points.map((p,i)=>`<div class="b ${i%2?'alt':''}" style="height:${Math.max(4,p.v/max*100)}%"><span class="cap">${cpMoney(p.v)}</span></div>`).join('');
  let labs=points.map(p=>`<span>${p.label}</span>`).join('');
  el.innerHTML=`<div class="cp-art-h"><i class="ti"></i>${title}<span class="ai-badge">generated</span></div><div class="cp-chart"><div class="cp-bars">${bars}</div><div class="cp-xlabels">${labs}</div></div>`;
  el._artType='chart'; el._artData={title,points}; return el;
}

// ============ ORCHESTRATOR: user turn → parse → ground → stream ============
let _lastArtifacts=[];
function cpSend(raw){
  const text=(raw||$('cpInput').value||'').trim(); if(!text||CP.busy)return;
  $('cpInput').value=''; CP.busy=true; cpAddUser(text); CP.thread.push({role:'user',text});
  CP.recent=[{t:text,w:'just now'}].concat((CP.recent||[]).filter(r=>r.t!==text)).slice(0,12);
  renderCpHome();
  const intent=parseIntent(text);
  // update conversation memory from slots
  ['account','region','fund','measure','cat'].forEach(k=>{ if(intent.slots[k])CP.ctx[k]=intent.slots[k]; });
  if(intent.slots.site){ const reg=({'London':'EMEA','Dublin':'EMEA','Ashburn VA':'Americas','Dallas TX':'Americas','Singapore':'APAC','Tokyo':'APAC'})[intent.slots.site]; CP.ctx.region=reg; }

  const wrap=cpAddAgent();
  const thinkSteps=cpThinkSteps(intent);
  cpThink(wrap,thinkSteps,()=>{
    const res=cpResolve(intent,text);
    const body=cpBody(wrap);
    cpTypeInto(body,res.body,()=>{
      _lastArtifacts=[];
      (res.artifacts||[]).forEach(a=>{ cpAppend(wrap,a); _lastArtifacts.push(a); });
      if(res.hits){ const hr=hitRows(res.hits); if(hr)cpAppend(wrap,hr); }
      const cc=citeChips(res.cites); if(cc)cpAppend(wrap,cc);
      const ar=actRow(res.actions); if(ar)cpAppend(wrap,ar);
      if(res.nav){ gotoTab(res.nav); }
      attachStar(wrap, text, res);
      CP.thread.push({role:'assistant',res}); CP.busy=false; cpScroll();
      $('cpInput').focus();
    });
  });
}
function cpThinkSteps(intent){
  const a=intent.action, sl=intent.slots;
  const scope=[sl.region&&`region ${sl.region}`,sl.fund&&`fund ${sl.fund}`,sl.cat&&`${sl.cat}`].filter(Boolean).join(' · ');
  const base={
    reconcile:['reading trial balance…','pulling accounts 20000, 30000…','checking spine vs. GL…'],
    ceiling:['reading cost ledger…','confirming bank-verified cash…','running reverse ceiling…'],
    carve:['reading placed-in-service events…','pulling Hall A carve JEs…','applying fit-out ratio…'],
    report:['reading transactions'+(scope?` (${scope})`:'')+'…','summing by category & quarter…','building the artifact…'],
    scope:['resolving scope'+(scope?` (${scope})`:'')+'…','applying global filters…','re-rendering every view…'],
    commitment:['reading commitments…','computing committed − incurred…'],
    trace:['locating entity in spine…','pulling journal entries…'],
    navigate:['locating the view…'],
    search:['searching the spine…','ranking matches…'],
  };
  return base[a]||base.search;
}
function cpResolve(intent,raw){
  switch(intent.action){
    case 'reconcile': return ansReconcile();
    case 'ceiling': return ansCeiling(intent.slots.over);
    case 'carve': return ansCarve();
    case 'commitment': return ansCommitment();
    case 'scope': return ansScope({...intent.slots,raw});
    case 'report': return ansReport(intent.slots);
    case 'trace': return ansTrace(intent.slots)||ansSearch(raw);
    case 'navigate': return ansNavigate(raw.toLowerCase());
    default: return ansSearch(raw);
  }
}

  renderPinned(); cpToast('Pinned to '+(VIEW_META[TAB]?.t||'dashboard'));

function renderPinned(){
  let strip=$('pinnedStrip');
  const host=$('view-'+TAB);
  if(!host)return;
  if(!strip){ strip=document.createElement('div'); strip.className='pinned-strip'; strip.id='pinnedStrip'; }
  const mine=CP.pinned.filter(p=>p.view===TAB);
  strip.innerHTML=mine.map((p,idx)=>{
    const inner = p.type==='table'
      ? artTable(p.data.title,p.data.head,p.data.rows,p.data.foot).outerHTML
      : artChart(p.data.title,p.data.points).outerHTML;
    return `<div class="pinned-card"><div class="ph"><i class="ti"></i>Pinned by Korvyn AI<button class="unpin" onclick="unpin(${CP.pinned.indexOf(p)})">×</button></div>${inner}</div>`;

  if(mine.length && host.firstChild!==strip){ host.insertBefore(strip,host.firstChild); }
  if(!mine.length && strip.parentNode){ strip.remove(); }
}

// Insights derive from live data — the badge is a count of real open items.
function cpInsights(){
  const out=[];
  const t=closeTotals();
  if(t.blk) out.push({sev:'neg',t:`${t.blk} close tasks blocked`,d:`Jun 2026 close is ${closePct()}% complete with ${t.blk} blockers across ${GL_CLOSE.filter(e=>e.blk).length} entities.`,go:"pickLens('ledger');pickTab('glclose')"});
  GL_ERP.filter(e=>e.st!=='ok').forEach(e=>out.push({sev:'warn',t:`${e.nm} sync delayed`,d:`Data only through ${e.thru}; ${e.ent} entities affected.`,go:"pickLens('ledger');pickTab('glsync')"}));
  const over=GL_RECON.filter(r=>r.st==='over');
  if(over.length) out.push({sev:'neg',t:`${over.length} reconciliation overdue`,d:`${over[0].nm} (${over[0].acct}) past due ${over[0].due}.`,go:"pickLens('ledger');pickTab('glrecon')"});
  const sc=cipScope();
  const aged=sc.filter(x=>x.days>30&&x.status==='ready');
  if(aged.length) out.push({sev:'neg',t:`${aged.length} assets in service but still in CIP`,d:`Oldest is ${aged[0].name} at ${aged[0].days} days post-COO — depreciation is not running.`,go:"pickLens('assets');pickTab('pis')"});
  const scrub=sc.filter(x=>x.scrub>0);
  if(scrub.length) out.push({sev:'warn',t:`${money0(sc.reduce((a,x)=>a+x.scrub,0))} operating cost sitting in CIP`,d:`Across ${scrub.length} projects — capitalising it overstates the asset.`,go:"pickLens('issues')"});
  const openC=FILING_COMMENTS.filter(c=>c.st==='open').length;
  if(openC) out.push({sev:'warn',t:`${openC} open review comments`,d:'On the current 10-K working papers.',go:"pickLens('filings');pickTab('fdetail');setFDetailTab('review')"});
  const pendA=FILING_APPROVALS.filter(a=>a.st==='pending').length;
  if(pendA) out.push({sev:'info',t:`${pendA} approvals pending`,d:'Sections awaiting sign-off before filing.',go:"pickLens('filings');pickTab('fdetail');setFDetailTab('appr')"});
  const A=fpActuals();
  out.push({sev:'warn',t:'Revenue 2.1% below plan',d:`Actual ${fpM(A.rev)} vs budget ${fpM(fpBudget(A.rev))} YTD.`,go:"pickLens('fpa');pickTab('budget')"});
  if(!glTies()) out.push({sev:'neg',t:'Balance sheet out of balance',d:'A does not equal L + E.',go:"pickLens('ledger');pickTab('glover')"});
  out.push({sev:'info',t:'Cash runway under 6 months',d:'4.8 months at the current burn rate.',go:"pickLens('fpa');pickTab('fpcash')"});
  return out;
}

// Drag the panel's leading edge to resize; width persists like the collapse state.
const CP_MIN=300, CP_MAX=1200;   // rail collapse (56px) covers the very-narrow case
const CP_SNAP=170;               // drag narrower than this and the panel snaps to the rail
function cpSetRail(on){
  document.body.classList.toggle('copilot-rail',on);
  if(on) document.body.style.removeProperty('--copilot-w');
  try{localStorage.setItem('korvyn.ai',on?'1':'0')}catch(e){}
  if(typeof renderCpStrip==='function') renderCpStrip();
  if(typeof cpSyncMark==='function') cpSyncMark();
}
function cpApplyWidth(px){
  const w=Math.max(CP_MIN,Math.min(CP_MAX,Math.round(px)));
  document.body.style.setProperty('--copilot-w',w+'px');
  try{localStorage.setItem('korvyn.aiw',w)}catch(e){}
  return w;
}
(function cpInitResize(){
  const start=()=>{
    const el=document.getElementById('cpResize'); if(!el)return;
    el.addEventListener('pointerdown',e=>{
      e.preventDefault(); document.body.classList.add('cp-resizing');
      el.setPointerCapture(e.pointerId);
      const move=ev=>{
        const px=window.innerWidth-ev.clientX;
        const railed=document.body.classList.contains('copilot-rail');
        if(railed){
          if(px>CP_SNAP){ cpSetRail(false); cpApplyWidth(px); }   // drag out of the rail
        } else if(px<CP_SNAP){
          cpSetRail(true);                                        // snap shut
        } else {
          cpApplyWidth(px);
        }
      };
      const up=ev=>{ document.body.classList.remove('cp-resizing');
        el.releasePointerCapture(ev.pointerId);
        el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
    });
    // double-click the handle to restore the default width
    el.addEventListener('dblclick',()=>{ document.body.style.removeProperty('--copilot-w');
      try{localStorage.removeItem('korvyn.aiw')}catch(e){} });
    try{ const w=localStorage.getItem('korvyn.aiw'); if(w) cpApplyWidth(+w); }catch(e){}
  };
  if(document.getElementById('cpResize')) start();
  else document.addEventListener('DOMContentLoaded',start);
})();

let _phTimer=null, _phIdx=0, _phActive=false;
function cpStartPlaceholder(){
  const el=$('cpInput'); if(!el||el.value) return;   // don't animate if user typed
  _phActive=true; _phTick();
}
function cpStopPlaceholder(){
  _phActive=false; if(_phTimer){ clearTimeout(_phTimer); _phTimer=null; }
  const el=$('cpInput'); if(el&&!el.value) el.placeholder="Ask anything about the spine…";
}
function _phTick(){
  const el=$('cpInput'); if(!el||!_phActive||el.value){ return; }
  const full=CP_PLACEHOLDERS[_phIdx];
  let i=0;
  const type=()=>{
    if(!_phActive||el.value){ return; }
    el.placeholder=full.slice(0,i)+(i<full.length?'▏':'');
    i++;
    if(i<=full.length){ _phTimer=setTimeout(type, 34); }
    else { _phTimer=setTimeout(()=>{ // hold, then advance to next
      _phIdx=(_phIdx+1)%CP_PLACEHOLDERS.length; _phTick();
    }, 2200); }
  };
  type();
}

// ============================================================ NETSUITE LINK LAYER
// Production-shaped deep-linking. Every spine node carries a NetSuite internal
// ID; a click resolves that ID into a correctly-formed NetSuite record URL.
// In production NS.account + NS.live are real; here NS.live=false routes the
// click through a mock landing page so the URL shape + ID mapping are visible.
const NS = {
  account: 'TSTDRV1234567',                 // NetSuite account (realm) id — replace with real
  base:    'https://TSTDRV1234567.app.netsuite.com',
  live:    false,                           // flip true once a real account + user-scoped auth exist
  // record-type → NetSuite transaction/record page (the real NS URL patterns)
  patterns: {
    invoice: id => `/app/accounting/transactions/vendbill.nl?id=${id}`,
    po:      id => `/app/accounting/transactions/purchord.nl?id=${id}`,
    je:      id => `/app/accounting/transactions/journal.nl?id=${id}`,
    account: id => `/app/accounting/account/account.nl?id=${id}`,
    payment: id => `/app/accounting/transactions/vendpymt.nl?id=${id}`,
  },
  label: { invoice:'Vendor bill', po:'Purchase order', je:'Journal entry', account:'GL account', payment:'Payment' },
};
// Deterministic mock internal-id per business key. In production this mapping is
// stored on the edge at sync time (the spine records NetSuite's own internalId).
function nsId(type, key){
  let h=0; const s=type+'|'+String(key);
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  const base={invoice:20000,po:10000,je:40000,account:100,payment:60000}[type]||1000;
  return base + (h % 8999);
}
function nsUrl(type, key){
  const id=nsId(type,key);
  return { id, url: NS.base + (NS.patterns[type]?NS.patterns[type](id):('/app/common/entity/entity.nl?id='+id)) };
}
// Open the record. Live → new tab straight to NetSuite. Mock → landing page that
// shows the exact URL, the resolved internal id, and the two integration options.
function nsOpen(type, key, meta){
  const {id,url}=nsUrl(type,key);
  if(NS.live){ window.open(url,'_blank','noopener'); return; }
  const q=new URLSearchParams({type,key:String(key),id:String(id),url,label:NS.label[type]||type,meta:meta||''});
  window.open('ns_mock.html?'+q.toString(),'_blank','noopener');
}
// a small inline "View in NetSuite" chip
function nsChip(type,key,meta){
  const {id}=nsUrl(type,key);
  const m=(meta||'').replace(/'/g,"\\'");
  return `<span class="ns-chip" title="${NS.label[type]} · internal id ${id}" onclick="event.stopPropagation();nsOpen('${type}','${String(key).replace(/'/g,"\\'")}','${m}')">
    <svg viewBox="0 0 16 16" width="11" height="11" fill="none"><path d="M6 3H3v10h10V10M9 3h4v4M13 3L7 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>NetSuite<span class="ns-id">#${id}</span></span>`;
}


// ============================================================ NAV HISTORY + BACK
// Records a snapshot (view + filters + drill state) on every navigation so the
// back button can restore exactly where you were. Escape closes an open drill.
const NAV={ stack:[], restoring:false };
function navSnapshot(){
  return {
    tab:TAB, lens:LENS,
    fund:$('fundScope').value, region:$('regionScope').value, own:$('ownType').value,
    periodType:$('periodType').value, periodVal:$('periodVal')?.value||null,
    ccy:$('ccyMode').dataset.v||'usd',
    tbDrill:tbDrillAcct, poExp:{...poExpanded}, ppe:ppeDrill?{...ppeDrill}:null,
    trendExp:(typeof trendExpand!=='undefined')?{...trendExpand}:{},
  };
}
function navSame(a,b){
  return a&&b&&a.tab===b.tab&&a.lens===b.lens&&a.fund===b.fund&&a.region===b.region&&a.own===b.own&&
    a.periodType===b.periodType&&a.periodVal===b.periodVal&&a.ccy===b.ccy&&a.tbDrill===b.tbDrill&&
    JSON.stringify(a.poExp)===JSON.stringify(b.poExp)&&JSON.stringify(a.ppe)===JSON.stringify(b.ppe)&&
    JSON.stringify(a.trendExp||{})===JSON.stringify(b.trendExp||{});
}
// push the PREVIOUS state before a navigation changes things
let _navPrev=null;
function navRecord(){
  if(NAV.restoring)return;
  if(_navPrev && !navSame(_navPrev, navSnapshot())){
    NAV.stack.push(_navPrev);
    if(NAV.stack.length>60)NAV.stack.shift();
  }
  _navPrev=navSnapshot();
  updateBackBtn();
}
function updateBackBtn(){ const b=$('backBtn'); if(b)b.disabled=NAV.stack.length===0; }
function navBack(){
  // if a drill is open on the current view, first Escape closes it
  if(closeOpenDrill()){ return; }
  const s=NAV.stack.pop(); if(!s)return;
  NAV.restoring=true;
  LENS=s.lens; TAB=s.tab;
  $('fundScope').value=s.fund; $('regionScope').value=s.region; $('ownType').value=s.own;
  $('periodType').value=s.periodType; onPeriodType(); if(s.periodVal&&$('periodVal'))$('periodVal').value=s.periodVal;
  const cm=$('ccyMode'); [...cm.children].forEach(x=>x.classList.toggle('on',x.dataset.v===s.ccy)); cm.dataset.v=s.ccy;
  tbDrillAcct=s.tbDrill; poExpanded={...s.poExp}; ppeDrill=s.ppe?{...s.ppe}:null;
  if(typeof trendExpand!=='undefined')trendExpand=s.trendExp?{...s.trendExp}:{};
  renderLensBar(); renderTabs(); showTab(); renderAll();
  NAV.restoring=false; _navPrev=navSnapshot(); updateBackBtn();
}
// close the top-most open drill on the current view; return true if one was closed
function closeOpenDrill(){
  if(TAB==='tb' && tbDrillAcct){ tbDrillAcct=null; renderTB(); _navPrev=navSnapshot(); return true; }
  if(TAB==='ppe' && ppeDrill){ ppeDrill=null; renderPPE(); _navPrev=navSnapshot(); return true; }
  if(TAB==='po'){ const openKey=Object.keys(poExpanded).find(k=>poExpanded[k]); if(openKey){ poExpanded={}; renderPO(); _navPrev=navSnapshot(); return true; } }
  if(TAB==='trend' && typeof trendExpand!=='undefined'){ const openKeys=Object.keys(trendExpand).filter(k=>trendExpand[k]); if(openKeys.length){ // collapse the deepest-open node (longest key)
      openKeys.sort((a,b)=>b.length-a.length); delete trendExpand[openKeys[0]]; renderTrend(); _navPrev=navSnapshot(); return true; } }
  const pd=$('pivDrill'); if(pd&&pd.classList.contains('show')){ pd.classList.remove('show'); return true; }
  return false;
}
// wrap the real navigation entry points to record history
['pickTab','pickLens','gotoTab','gotoTB','drillTB','togglePO','drillPPE','toggleTrend'].forEach(fn=>{
  const orig=window[fn]; if(typeof orig!=='function')return;
  window[fn]=function(...a){ navRecord(); return orig.apply(this,a); };
});
// filter changes also record
['fundScope','regionScope','ownType','periodType','periodVal'].forEach(id=>{
  const el=document.getElementById(id); if(el)el.addEventListener('change',()=>{ navRecord(); });
});
// Escape closes a drill first, else steps back
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!closeOpenDrill()){ /* keep focus sane */ } updateBackBtn(); }
});

// ============================================================ COPILOT: save / star / clear
CP.saved = [];          // saved conversations: {id,name,ts,thread:[...] , messages:[html]}
CP.starred = [];        // starred single answers: {id, q, html}
let _msgSeq=0;

// star control injected into each agent message
function attachStar(wrap, q, res){
  const id='m'+(++_msgSeq);
  wrap.dataset.mid=id;
  const btn=document.createElement('button');
  btn.className='cp-star'; btn.title='Star this answer'; btn.setAttribute('aria-label','Star answer');
  btn.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.9 4 4.3.5-3.2 3 .9 4.3L8 11.2 4.1 13.3l.9-4.3-3.2-3 4.3-.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  btn.onclick=(e)=>{ e.stopPropagation(); toggleStar(id,q,wrap,btn); };
  wrap.appendChild(btn);
}
function toggleStar(id,q,wrap,btn){
  const i=CP.starred.findIndex(s=>s.id===id);
  if(i>=0){ CP.starred.splice(i,1); btn.classList.remove('on'); }
  else {
    const body=wrap.querySelector('.cp-body');
    CP.starred.push({id, q, html: body?body.innerHTML:''});
    btn.classList.add('on');
    cpToast('Starred — find it under ★');
  }
  if($('cpSaved').classList.contains('show'))renderSavedTray();
}

function toggleSavedTray(){
  const t=$('cpSaved'); const on=t.classList.toggle('show');
  $('cpStarBtn').classList.toggle('on',on);
  if(on)renderSavedTray();
}
function renderSavedTray(){
  const el=$('cpSavedIn'); if(!el)return;
  let h='';
  h+=`<h4>Starred answers <span class="x" onclick="toggleSavedTray()">×</span></h4>`;
  if(CP.starred.length){
    CP.starred.forEach(s=>{ h+=`<div class="cp-savedmsg"><div style="font-size:11px;color:var(--accent-ink);font-weight:600;margin-bottom:2px">${s.q}</div><div class="sm-body">${s.html}</div></div>`; });
  } else { h+=`<div class="cp-saved-empty">No starred answers yet. Hover any answer and tap ★.</div>`; }
  h+=`<h4 style="margin-top:14px">Saved conversations</h4>`;
  if(CP.saved.length){
    CP.saved.forEach(c=>{
      h+=`<div class="cp-saved-item" onclick="loadConversation('${c.id}')">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" style="flex:none;color:var(--muted)"><path d="M3 2h8l3 3v9H3z" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>${c.name}</span><span class="meta">${c.thread.filter(m=>m.role==='user').length} Q</span>
        <span class="del" title="Delete" onclick="event.stopPropagation();deleteConversation('${c.id}')">×</span></div>`;
    });
  } else { h+=`<div class="cp-saved-empty">Nothing saved. Use ⋯ → Save conversation.</div>`; }
  el.innerHTML=h;
}

function saveConversation(){
  closeCpMenu();
  if(!CP.thread.length){ cpToast('Nothing to save yet'); return; }
  const def='Session '+(CP.saved.length+1)+' · '+(VIEW_META[TAB]?.t||'');
  const name=(window.prompt('Name this conversation:', def)||'').trim();
  if(!name)return;
  const id='c'+Date.now();
  // capture the rendered thread HTML so it can be revisited verbatim
  CP.saved.push({ id, name, ts:Date.now(), thread:JSON.parse(JSON.stringify(CP.thread)), html:$('cpThread').innerHTML });
  cpToast('Saved “'+name+'”');
}
function loadConversation(id){
  const c=CP.saved.find(x=>x.id===id); if(!c)return;
  $('cpThread').innerHTML=c.html;
  CP.thread=JSON.parse(JSON.stringify(c.thread));
  // re-attach star buttons are lost on reload; leave as read-only view with a banner
  const banner=document.createElement('div');
  banner.style.cssText='font-size:11px;color:var(--accent-ink);background:var(--accent-bg);border-radius:8px;padding:7px 11px;margin-bottom:10px;text-align:center';
  banner.textContent='Viewing saved: “'+c.name+'” — send a message to continue';
  $('cpThread').insertBefore(banner,$('cpThread').firstChild);
  toggleSavedTray(); cpScroll();
}
function deleteConversation(id){
  const i=CP.saved.findIndex(x=>x.id===id); if(i>=0)CP.saved.splice(i,1); renderSavedTray();
}
function clearConversation(){
  closeCpMenu();
  if(!CP.thread.length){ cpToast('Already empty'); return; }
  if(!window.confirm('Clear this conversation? Starred answers and saved conversations are kept.'))return;
  CP.thread=[]; CP.ctx={account:null,region:null,fund:null,measure:null,cat:null};
  $('cpThread').innerHTML=''; cpGreet(); cpToast('Conversation cleared');
}
function newConversation(){
  closeCpMenu();
  if(CP.thread.length && !window.confirm('Start a new conversation? The current one will clear (save it first if you want to keep it).'))return;
  CP.thread=[]; CP.ctx={account:null,region:null,fund:null,measure:null,cat:null};
  $('cpThread').innerHTML=''; cpGreet();
}
// menu open/close
function toggleCpMenu(e){ e.stopPropagation(); $('cpDrop').classList.toggle('show'); }
function closeCpMenu(){ const d=$('cpDrop'); if(d)d.classList.remove('show'); }
document.addEventListener('click',()=>closeCpMenu());

renderSug(); renderLensBar(); renderTabs(); showTab(); renderAll();
_navPrev=navSnapshot(); updateBackBtn();

// route the legacy top command bar into the copilot thread
runCommand=function(raw){ const q=(raw||$('cmd')?.value||'').trim(); if(!q)return; if($('cmd'))$('cmd').value=''; document.body.classList.remove('copilot-collapsed'); cpSend(q); };
// legacy aiAnswer (used by property/JE traces) now posts into the copilot thread
aiAnswer=function(q,bodyHTML,hits,actions){
  document.body.classList.remove('copilot-collapsed');
  const wrap=cpAddAgent(); const b=cpBody(wrap); b.innerHTML=bodyHTML;
  if(hits&&hits.length){ const hr=hitRows(hits.map(x=>({...x,action:x.action}))); if(hr)cpAppend(wrap,hr); }
  if(actions&&actions.length){ const ar=actRow(actions.map(a=>({label:a.label,fn:a.fn}))); if(ar)cpAppend(wrap,ar); }
  cpScroll();
};

if(document.getElementById('cpThread')){ cpGreet(); renderCpSugs(); renderCpTabs(); renderCpHome(); renderCpStrip(); cpStartPlaceholder(); }
else { document.addEventListener('DOMContentLoaded',()=>{ cpGreet(); renderCpSugs(); renderPinned(); renderCpTabs(); renderCpHome(); renderCpStrip(); cpStartPlaceholder(); }); }

</script>
