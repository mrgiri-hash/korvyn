<title>Korvyn - Financial Review Platform</title>
<style>
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --raise:#EFF1F4;
    --ink:#16181D; --ink-2:#3C424E; --muted:#5C6473; --faint:#8A91A0;
    --line:rgba(20,24,36,.09); --line-2:rgba(20,24,36,.15);
    --chrome:#161719; --chrome-2:#1C1D20; --chrome-ink:#EDEDEE; --chrome-ink-2:#A0A0A4; --chrome-line:rgba(255,255,255,.13);
    --accent:#2F62D4; --accent-bg:#EAF0FC; --accent-line:#C6D6F5;
    --ai:#6366F1; --ai-bg:#F3F3FE; --ai-line:#DEDDFB;
    --pos:#3F8A63; --warn:#A9791F; --neg:#B8443A;
    --pos-bg:#EBF3EE; --warn-bg:#F7F1E3; --neg-bg:#F8ECEA; --slate-bg:#EEF1F5;
    --radius:9px; --radius-sm:6px;
    --shadow:0 12px 34px rgba(16,18,24,.14);
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F1114; --surface:#171A21; --surface-2:#1C2029; --raise:#232833;
      --ink:#E7E8EC; --ink-2:#C4C8D0; --muted:#969CA8; --faint:#6D7482;
      --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.15);
      --chrome:#101113; --chrome-2:#17181B; --chrome-ink:#E4E4E6; --chrome-ink-2:#9A9A9E; --chrome-line:rgba(255,255,255,.12);
      --accent:#6C93EC; --accent-bg:#18223B; --accent-line:#2E3E63;
      --ai:#8E90F5; --ai-bg:#191A2E; --ai-line:#33346A;
      --pos:#5CBA85; --warn:#D0A24C; --neg:#E0685C;
      --pos-bg:#15271E; --warn-bg:#28230F; --neg-bg:#2C1B19; --slate-bg:#20252E;
      --shadow:0 14px 38px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --raise:#EFF1F4;
    --ink:#16181D; --ink-2:#3C424E; --muted:#5C6473; --faint:#8A91A0;
    --line:rgba(20,24,36,.09); --line-2:rgba(20,24,36,.15);
    --chrome:#161719; --chrome-2:#1C1D20; --chrome-ink:#EDEDEE; --chrome-ink-2:#A0A0A4; --chrome-line:rgba(255,255,255,.13);
    --accent:#2F62D4; --accent-bg:#EAF0FC; --accent-line:#C6D6F5;
    --ai:#6366F1; --ai-bg:#F3F3FE; --ai-line:#DEDDFB;
    --pos:#3F8A63; --warn:#A9791F; --neg:#B8443A;
    --pos-bg:#EBF3EE; --warn-bg:#F7F1E3; --neg-bg:#F8ECEA; --slate-bg:#EEF1F5;
    --shadow:0 12px 34px rgba(16,18,24,.14);
  }
  :root[data-theme="dark"]{
    --bg:#0F1114; --surface:#171A21; --surface-2:#1C2029; --raise:#232833;
    --ink:#E7E8EC; --ink-2:#C4C8D0; --muted:#969CA8; --faint:#6D7482;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.15);
    --chrome:#101113; --chrome-2:#17181B; --chrome-ink:#E4E4E6; --chrome-ink-2:#9A9A9E; --chrome-line:rgba(255,255,255,.12);
    --accent:#6C93EC; --accent-bg:#18223B; --accent-line:#2E3E63;
    --ai:#8E90F5; --ai-bg:#191A2E; --ai-line:#33346A;
    --pos:#5CBA85; --warn:#D0A24C; --neg:#E0685C;
    --pos-bg:#15271E; --warn-bg:#28230F; --neg-bg:#2C1B19; --slate-bg:#20252E;
    --shadow:0 14px 38px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,p{margin:0}
  button{font-family:inherit;cursor:pointer}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
  .mono{font-family:var(--mono)}

  /* Ribbon */
  .ribbon{position:sticky;top:0;z-index:30;height:52px;background:var(--chrome);color:var(--chrome-ink);
    display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--chrome-line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-lockup{height:19px;width:auto;display:block}
  .rb-ctx{display:flex;align-items:center;gap:8px;color:var(--chrome-ink-2);font-size:12px;padding-left:4px;border-left:1px solid var(--chrome-line);margin-left:2px}
  .rb-ctx b{color:var(--chrome-ink);font-weight:500}
  .ribbon .grow{flex:1}
  .rb-search{display:flex;align-items:center;gap:8px;background:var(--chrome-2);border:1px solid var(--chrome-line);
    border-radius:20px;padding:6px 13px;width:300px;max-width:34vw}
  .rb-search input{flex:1;background:transparent;border:0;color:var(--chrome-ink);font-family:inherit;font-size:12.5px;outline:none}
  .rb-search input::placeholder{color:var(--chrome-ink-2)}
  .rb-search svg{opacity:.6}
  .rb-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--chrome-ink-2);position:relative;background:transparent;border:0}
  .rb-ic:hover{color:var(--chrome-ink)}
  .rb-dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .rb-user{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:500}

  /* App grid */
  .app{display:grid;grid-template-columns:214px minmax(0,1fr)}
  .nav{border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - 52px);padding:16px 12px;
    position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);overflow:auto}
  .nav .ng{margin-bottom:6px}
  .nav .nh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500;padding:10px 10px 6px}
  .nitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--ink-2);font-size:13px;
    font-weight:400;cursor:pointer;border-left:2px solid transparent;position:relative}
  .nitem:hover{background:var(--surface-2)}
  .nitem.on{background:var(--accent-bg);color:var(--ink);font-weight:500;border-left-color:var(--accent)}
  .nitem svg{flex:0 0 auto;opacity:.85}
  .nitem .nc{margin-left:auto;font-size:11px;color:var(--muted);background:var(--raise);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
  .nitem.on .nc{background:var(--surface);color:var(--accent)}
  .nav .nsp{height:1px;background:var(--line);margin:12px 6px}

  .main{min-width:0}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 30px 60px}

  /* Hero */
  .hero{display:flex;align-items:center;gap:26px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:26px}
  .hero .ht{flex:0 0 auto}
  .hero .ht .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
  .hero .ht h1{font-size:21px;font-weight:500;letter-spacing:.01em;margin-top:3px}
  .hero .ht .d{font-size:12px;color:var(--muted);margin-top:3px}
  .hero .prog{flex:1;min-width:0}
  .hero .prog .pr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .hero .prog .pr-top .pl{font-size:12px;color:var(--muted)}
  .hero .prog .pr-top .pv{font-size:13px;color:var(--ink);font-weight:500}
  .bar{height:7px;background:var(--raise);border-radius:5px;overflow:hidden;display:flex}
  .bar .seg{height:100%}
  .bar .seg.done{background:var(--pos)}
  .bar .seg.prog{background:var(--accent)}
  .hero .stats{display:flex;gap:22px;flex:0 0 auto}
  .hero .stat{text-align:right}
  .hero .stat .sv{font-size:18px;font-weight:500}
  .hero .stat .sl{font-size:11px;color:var(--muted);margin-top:1px}
  .hero .stat.att .sv{color:var(--warn)}

  /* Section */
  .sec{margin-bottom:26px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec-h h2{font-size:15px;font-weight:500;letter-spacing:.01em}
  .sec-h .note{font-size:12px;color:var(--muted)}
  .sec-h .grow{flex:1}
  .sec-h .link{font-size:12px;color:var(--accent);cursor:pointer}

  /* Reviews table */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.rev{width:100%;border-collapse:collapse}
  table.rev thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;
    padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  table.rev thead th.r{text-align:right}
  table.rev tbody td{padding:0 16px;height:54px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  table.rev tbody tr:last-child td{border-bottom:0}
  table.rev tbody tr{cursor:pointer}
  table.rev tbody tr:hover td{background:var(--surface-2)}
  .rev-nm{font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
  .rev-nm .ico{width:26px;height:26px;border-radius:7px;background:var(--slate-bg);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
  .rev-nm .sub{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
  td.r{text-align:right}
  .st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .st .d{width:6px;height:6px;border-radius:50%}
  .st.approved{background:var(--pos-bg);color:var(--pos)} .st.approved .d{background:var(--pos)}
  .st.review{background:var(--accent-bg);color:var(--accent)} .st.review .d{background:var(--accent)}
  .st.attention{background:var(--warn-bg);color:var(--warn)} .st.attention .d{background:var(--warn)}
  .st.draft{background:var(--slate-bg);color:var(--muted)} .st.draft .d{background:var(--faint)}
  .st.notstarted{background:transparent;color:var(--faint);border:1px solid var(--line-2)} .st.notstarted .d{background:var(--faint)}
  .who{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px}
  .ava{width:22px;height:22px;border-radius:50%;background:var(--slate-bg);color:var(--muted);display:inline-grid;place-items:center;font-size:10px;font-weight:500;flex:0 0 auto}
  .qn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:500;padding:0 6px}
  .qn.has{background:var(--warn-bg);color:var(--warn)} .qn.zero{color:var(--faint)}
  .evn{color:var(--ink-2)} .last{color:var(--muted);font-size:12px}
  .due{color:var(--ink-2)} .due.soon{color:var(--warn);font-weight:500}

  /* Two-up */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

  /* Insights */
  .ins{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .ins:last-child{border-bottom:0}
  .ins:hover{background:var(--surface-2)}
  .ins .sp{flex:0 0 auto;margin-top:1px;color:var(--ai)}
  .ins .ix{flex:1;min-width:0}
  .ins .it{font-size:13px;color:var(--ink);line-height:1.45}
  .ins .im{font-size:11.5px;color:var(--muted);margin-top:3px}
  .ins .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .ins .dot.watch{background:var(--warn)} .ins .dot.info{background:var(--faint)}

  /* Activity */
  .act{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .ava{width:26px;height:26px;font-size:10px;background:var(--accent);color:#fff}
  .act .ava.sys{background:var(--ai)}
  .act .ax{flex:1;min-width:0}
  .act .at{font-size:13px;color:var(--ink-2);line-height:1.4}
  .act .at b{color:var(--ink);font-weight:500}
  .act .am{font-size:11.5px;color:var(--faint);margin-top:2px}

  /* Knowledge timeline */
  .kn{position:relative;padding:0 15px 0 15px}
  .krow{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
  .krow:last-child{border-bottom:0}
  .kmark{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ai-bg);border:1px solid var(--ai-line);
    display:grid;place-items:center;color:var(--ai)}
  .kx{flex:1;min-width:0}
  .kt{font-size:13px;color:var(--ink);line-height:1.45}
  .km{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .kpill{background:var(--slate-bg);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}

  /* Evidence */
  .evrow{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .evrow:last-child{border-bottom:0}
  .evrow:hover{background:var(--surface-2)}
  .evext{flex:0 0 auto;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;letter-spacing:.02em}
  .evx{flex:1;min-width:0}
  .evn2{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evm2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .evt{font-size:11.5px;color:var(--faint);flex:0 0 auto}

  /* ---- Review workspace ---- */
  .wsback{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;cursor:pointer;margin-bottom:14px}
  .wsback:hover{color:var(--ink)}
  .wshead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .wshead .wt{font-size:22px;font-weight:500;letter-spacing:.01em}
  .wshead .wsub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .wshead .grow{flex:1}
  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-weight:500}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .wsgrid{display:grid;grid-template-columns:194px minmax(0,1fr);gap:26px;align-items:start}
  .wsnav{position:sticky;top:72px;display:flex;flex-direction:column;gap:1px}
  .wsnav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:12.5px;text-decoration:none;cursor:pointer}
  .wsnav a:hover{background:var(--surface-2);color:var(--ink-2)}
  .wsnav a .n{margin-left:auto;font-size:10px;color:var(--faint)}
  .wsnav a.done{color:var(--ink-2)}
  .wsnav a .chk{color:var(--pos)}
  .wsec{margin-bottom:26px;scroll-margin-top:72px}
  .wsec h3{font-size:14px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .wsec .wp{font-size:12px;color:var(--muted);margin-bottom:11px}
  .wsec .num{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:500}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .panel.ai{background:var(--ai-bg);border-color:var(--ai-line)}
  .ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ai);font-weight:500;margin-bottom:9px}
  .obs{display:flex;gap:9px;padding:6px 0;font-size:13px;color:var(--ink-2)}
  .obs .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .obs .d.watch{background:var(--warn)} .obs .d.info{background:var(--faint)}
  .exectxt{font-size:13.5px;color:var(--ink-2);line-height:1.65}
  .stub{color:var(--muted);font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:13px 15px}
  .stub b{color:var(--ink-2);font-weight:500}
  .minibars{display:flex;align-items:flex-end;gap:5px;height:56px;margin:6px 0 10px}
  .minibars .mb{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
  .minibars .mb.hl{background:var(--warn)}
  .cmt{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .cmt:last-child{border-bottom:0}
  .cmt .cb{flex:1}
  .cmt .ch{font-size:12.5px;margin-bottom:2px}
  .cmt .ch b{font-weight:500}
  .cmt .ch .tm{color:var(--faint);font-size:11px;margin-left:6px}
  .cmt .ctx{font-size:12.5px;color:var(--ink-2)}
  .hitem{display:flex;gap:10px;padding:8px 0;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
  .hitem:last-child{border-bottom:0}
  .hitem .ht2{flex:0 0 120px;color:var(--faint);font-size:11.5px}
  .aud{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
  .aud:last-child{border-bottom:0}
  .aud .ck{color:var(--pos)} .aud .xk{color:var(--faint)}
  .aud .grow{flex:1}
  .aud .lk{color:var(--accent);cursor:pointer;font-size:12px}

  /* ===== wired review engine (real GL) ===== */
  :root{--s1:#2F62D4;--s2:#0E9AA6;--s3:#7C4DD6;--s4:#C24D8A;--s5:#B8722E;--sother:#98A0AD}
  .exec-ul{margin:0;padding-left:18px}
  .exec-ul li{margin:5px 0;color:var(--ink-2);font-size:13.5px;line-height:1.55}
  .exec-ul li b{color:var(--ink);font-weight:500}
  .ectrl{display:flex;gap:22px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
  .eseg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px;gap:2px;margin-left:8px}
  .eseg button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:5px 11px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer}
  .eseg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .elegend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
  .elg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .elg .sw{width:11px;height:11px;border-radius:3px}
  .echart-wrap{position:relative;width:100%}
  svg.echart{width:100%;height:auto;display:block;overflow:visible}
  .echart .gridln{stroke:var(--line);stroke-width:1}
  .echart .zeroln{stroke:var(--line-2);stroke-width:1}
  .echart .axtx{fill:var(--faint);font-size:10px;font-family:var(--sans)}
  .echart .ser{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .echart .cross{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
  .etip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:9px 11px;font-size:12px;min-width:150px;visibility:hidden}
  .etip .tp{font-size:11px;color:var(--muted);margin-bottom:6px}
  .etip .tr{display:flex;align-items:center;gap:7px;padding:2px 0}
  .etip .tr .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .etip .tr .nm{color:var(--ink-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etip .tr .vl{font-weight:500}
  .evwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:2px}
  table.evt{border-collapse:collapse;width:100%;font-size:12px}
  table.evt th,table.evt td{padding:0 11px;height:38px;white-space:nowrap}
  table.evt thead th{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;text-align:right;border-bottom:1px solid var(--line-2)}
  table.evt thead th.l{text-align:left}
  table.evt td{text-align:right;border-bottom:1px solid var(--line)}

  function aiAnswer(q){

  /* ---- live agent (streaming) ---- */
  function agentHealth(){
    return new Promise(function(resolve){
      var fin=false;var to=setTimeout(function(){if(!fin){fin=true;resolve({ok:false});}},1500);
      fetch(AGENT_URL+'/health').then(function(r){return r.ok?r.json():null;}).then(function(j){if(fin)return;fin=true;clearTimeout(to);resolve(j?{ok:true,model:j.model,keySet:j.keySet}:{ok:false});}).catch(function(){if(fin)return;fin=true;clearTimeout(to);resolve({ok:false});});
    });
  }
  function refreshMode(cb){agentHealth().then(function(h){AI_MODE=h.ok?'live':'offline';AI_MODEL=h.model||'';if(cb)cb();});}
  function liveInner(msg){
    var tools=msg.tools.length?'<div class="ai-tools">'+msg.tools.map(function(t){return '<span class="ai-tool"><span class="d"></span>'+esc(t)+'</span>';}).join('')+'</div>':'';
    var body='<div class="ai-body">'+esc(msg.text)+(msg.done?'':'<span class="ai-cursor"></span>')+'</div>';
    var src=msg.done?'<div class="ai-src"><span class="ck">'+AI_CHECK+'</span>Live Korvyn agent'+(msg.tools.length?' &middot; grounded in '+msg.tools.map(function(t){return esc(t)}).join(', '):'')+'</div>':'';
    return tools+body+src;
  }
  function paintLive(){var n=document.getElementById('aiLive');if(!n)return;n.innerHTML=liveInner(AI_THREAD[AI_THREAD.length-1]);var sc=document.getElementById('aiScroll');if(sc)sc.scrollTop=sc.scrollHeight;}
  function agentAsk(prompt){
    var cur=currentReview();var full=(cur?'[The user is viewing the '+cur.name+'.] ':'')+prompt;
    var msg={role:'ai',live:true,text:'',tools:[],done:false};AI_THREAD.push(msg);renderAIScroll();
    AI_BUSY=true;setSendEnabled(false);
    fetch(AGENT_URL+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:full,sessionId:AI_SESSION})}).then(function(res){
      if(!res.ok||!res.body)throw new Error('agent http '+res.status);
      var reader=res.body.getReader();var dec=new TextDecoder();var buf='';
      function pump(){return reader.read().then(function(r){
        if(r.done){msg.done=true;paintLive();AI_BUSY=false;setSendEnabled(true);return;}
        buf+=dec.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
        lines.forEach(function(ln){if(!ln.trim())return;var e;try{e=JSON.parse(ln);}catch(x){return;}
          if(e.type==='text')msg.text+=(e.text||'');
          else if(e.type==='tool')msg.tools.push(e.text||e.name||e.tool||'tool');
          else if(e.type==='error')msg.text+=(msg.text?'\n\n':'')+'[agent error] '+(e.text||'unknown');
        });
        paintLive();return pump();
      });}
      return pump();
    }).catch(function(err){
      msg.live=false;msg.done=true;msg.ans=aiAnswer(prompt);
      AI_MODE='offline';AI_BUSY=false;renderAI();
    });
  }

  /* ---------- Knowledge Timeline: multi-year GL + recurrence detection ---------- */
  var MABBR=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MNAME=MABBR;
  var HMONTHS=(function(){var a=[];var y=2023,mo=8;for(var i=0;i<36;i++){a.push(y+'-'+(mo<10?'0'+mo:mo));mo++;if(mo>12){mo=1;y++;}}return a;})();
  function countYears(){return HMONTHS.length/12;}
  function monLabel(m){return MABBR[+m.slice(5)]+' '+m.slice(2,4);}
  function monthDiff(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));}
  function monthRange(a,b){var out=[];var y=+a.slice(0,4),mo=+a.slice(5);while(true){out.push(y+'-'+(mo<10?'0'+mo:mo));if(y===+b.slice(0,4)&&mo===+b.slice(5))break;mo++;if(mo>12){mo=1;y++;}}return out;}
  function fyMonthCal(yi){return ((yi+7)%12)+1;}
  function acctArea(acc){return acc.type==='Revenue'?{area:'Revenue',reviewId:'rev'}:{area:'Operating Expense',reviewId:'opex'};}
  function effScale(acc){var s=0;E_ENT.forEach(function(e){s+=e.s*((acc.aff&&acc.aff[e.id])||1);});return s;}
  function histNat(acc,gmi){
    var yi=gmi%12;var ac=acc.acct;var nat;
    if(ac==='55000'){nat=(yi===4)?505000*Math.pow(1.03,Math.floor(gmi/12)):37000;}
    else if(ac==='53000'){nat=(gmi===31)?381000:56000*Math.pow(1.002,gmi);}
    else if(ac==='15000'){nat=(gmi===29)?1010000:120000*Math.pow(1.003,gmi);}
    else if(ac==='16000'){nat=(gmi>=24)?(gmi===29?-905000:(gmi<29?150000:42000)):150000;}
    else if(ac==='52000'){nat=208000+(gmi>=29?92000:0);}
    else{nat=acc.base*Math.pow(1+acc.g,gmi);var isSummer=(yi<=1)||(yi>=10);if(acc.season)nat*=1+(isSummer?acc.season:(yi===2||yi===9?acc.season*0.4:0));if(ac==='50000'&&gmi===35)nat*=1.24;}
    nat*=effScale(acc);
    var n=Math.abs(Math.sin(gmi*131+ac.charCodeAt(0)*17))%1;
    nat*=1+(n-0.5)*0.04;
    return Math.round(nat);
  }
  var _hist={};
  function histSeries(acct){if(_hist[acct])return _hist[acct];var acc=null;for(var i=0;i<E_ACC.length;i++)if(E_ACC[i].acct===acct){acc=E_ACC[i];break;}var s=[];for(var g=0;g<HMONTHS.length;g++)s.push(histNat(acc,g));_hist[acct]=s;return s;}

  /* stored close-history (the small, labelled prior-close records; matching is computed) */
  var RECON_ITEMS=[{desc:'In-transit wire (operating account)',firstSeen:'2026-04',amount:12000,reviewId:'cash',area:'Cash'}];
  var ADJ_HISTORY=[
    {memo:'Soft/hard cost reclass',closes:['2026-04','2026-05','2026-06','2026-07'],reviewId:'cip',area:'CIP'},
    {memo:'Depreciation true-up (post-CIP)',closes:['2026-01','2026-07'],reviewId:'fa',area:'Fixed Asset'}
  ];
  var REUSE_PRIORS=[
    {title:'Controller explanation reused from FY25',tags:['Operating Expense','Reused'],note:'Last July’s temporary-power narrative applies again; Korvyn carried it forward and flagged it for confirmation.',reviewId:'opex',prior:'FY25 close',text:'July increase is seasonal cooling load at the data-center campuses; no adjustment proposed.'},
    {title:'Prior audit comment resurfaced',tags:['Debt','FY25 audit'],note:'The interest-classification question from the FY25 audit was raised again this close.',reviewId:'debt',prior:'FY25 audit',text:'Confirm interest classification agrees to the amortization schedule.'}
  ];

  function movingAvg(s){var n=s.length,t=[];for(var i=0;i<n;i++){var lo=Math.max(0,i-6),hi=Math.min(n-1,i+5),sum=0,c=0;for(var j=lo;j<=hi;j++){sum+=s[j];c++;}t[i]=sum/c;}return t;}
  function seasonalItems(){
    var out=[];
    E_ACC.forEach(function(acc){
      if(acc.type!=='Expense'&&acc.type!=='Revenue')return;
      var s=histSeries(acc.acct);var trend=movingAvg(s);
      var dev=s.map(function(v,i){return trend[i]?v/trend[i]:1;});
      var byDev=[];for(var yi=0;yi<12;yi++)byDev[yi]=[];
      dev.forEach(function(d,gmi){byDev[gmi%12].push(d);});
      var avgDev=byDev.map(function(a){return a.reduce(function(x,y){return x+y},0)/a.length;});
      var pm=0;for(var j=1;j<12;j++)if(avgDev[j]>avgDev[pm])pm=j;
      var lift=(avgDev[pm]-1)*100;
      if(lift<15)return;
      var years=byDev[0].length,recurs=true;
      for(var y=0;y<years;y++){if(byDev[pm][y]<1.10){recurs=false;break;}}
      if(!recurs)return;
      var byRaw=[];for(var z=0;z<12;z++)byRaw[z]=[];
      s.forEach(function(v,gmi){byRaw[gmi%12].push(v);});
      var yrMean=[];for(var yy=0;yy<years;yy++){var sm=0;for(var k=0;k<12;k++)sm+=s[yy*12+k];yrMean[yy]=sm/12;}
      var mean=s.reduce(function(a,b){return a+b},0)/s.length;
      var cal=fyMonthCal(pm),area=acctArea(acc);
      out.push({id:'sea-'+acc.acct,kind:'seasonal',t:'Recurring '+MNAME[cal]+' increase in '+acc.name,
        tags:[area.area,'Seen '+years+' years'],
        note:MNAME[cal]+' runs about +'+Math.round(lift)+'% above the surrounding months in every one of the last '+years+' years.',
        ev:{pm:pm,cal:cal,mean:mean,liftPct:lift,perYear:byRaw[pm].map(function(v,i){return {fy:'FY'+(24+i),v:v,lift:Math.round((v-yrMean[i])/yrMean[i]*100)};}),series:s},
        reviewId:area.reviewId,rank:lift*Math.abs(byRaw[pm][years-1])});
    });
    out.sort(function(a,b){return b.rank-a.rank;});
    return out;
  }
  function agingItems(){
    return RECON_ITEMS.map(function(it){
      var age=monthDiff(it.firstSeen,'2026-07')+1;
      return {id:'age-'+it.firstSeen,kind:'aging',t:it.desc+' unresolved for '+age+' months',
        tags:[it.area,age>=3?'Escalate':'Watch'],
        note:'First appeared '+monLabel(it.firstSeen)+' and has stayed open every close since — '+age+' consecutive.',
        ev:{firstSeen:it.firstSeen,age:age,amount:it.amount,months:monthRange(it.firstSeen,'2026-07')},reviewId:it.reviewId};
    }).filter(function(x){return x.ev.age>=3;});

  var _ki=null;
  function knowledgeItems(){if(_ki)return _ki;_ki=seasonalItems().concat(agingItems()).concat(recurringAdjItems()).concat(reuseItems());return _ki;}

      var tbl='<table class="kv-tbl"><tbody>'+it.ev.perYear.map(function(p){return '<tr><td>'+p.fy+' '+MNAME[it.ev.cal]+'</td><td class="n">'+fmtAbbr(p.v)+'</td><td class="n" style="color:var(--warn)">+'+p.lift+'% vs run-rate</td></tr>';}).join('')+'</tbody></table>';

    }
    return '<div class="kv-quote">'+esc(it.ev.text)+'</div><div class="kv-cap">Carried forward from '+esc(it.ev.prior)+'. Korvyn surfaces the prior explanation and matches it to this close; a human confirms it still applies.</div>';
  }

    return '<div class="kv-card"><div class="kv-top"><span class="kv-ic">'+kIcon(it.kind)+'</span><div class="kv-tx"><div class="kv-t">'+esc(it.t)+'</div><div class="kv-tags">'+it.tags.map(function(t){return '<span class="kpill">'+esc(t)+'</span>';}).join('')+'</div><div class="kv-note">'+esc(it.note)+'</div></div>'+(it.reviewId&&revById(it.reviewId)?'<button class="kv-open" data-open="'+it.reviewId+'">Open review</button>':'')+'</div><details class="kv-ev"><summary></summary><div class="kv-evb">'+kvEvidence(it)+'</div></details></div>';
  }
  function renderKnowledgeView(){
    var items=knowledgeItems();var reviews={};items.forEach(function(i){if(i.reviewId)reviews[i.reviewId]=1;});
    var h='<div class="kv-hd"><div><div class="k">Institutional memory</div><h1>Knowledge Timeline</h1><div class="kv-sub">How Korvyn’s understanding of the business accumulates. Every item below is <b>computed</b> from '+HMONTHS.length+' months of workbooks across '+countYears()+' fiscal years — not authored.</div></div></div>';
    h+='<div class="kv-stats"><div class="kv-stat"><div class="v">'+items.length+'</div><div class="l">Patterns detected</div></div><div class="kv-stat"><div class="v">'+countYears()+'</div><div class="l">Years of history</div></div><div class="kv-stat"><div class="v">'+Object.keys(reviews).length+'</div><div class="l">Reviews touched</div></div></div>';
    var groups=[['seasonal','Seasonal patterns','Recurring in the GL every year'],['aging','Open items carried forward','Unresolved across multiple closes'],['recurring-adj','Recurring adjustments','Booked close after close — candidates to standardize'],['reuse','Reused knowledge','Prior explanations and audit comments matched to this close']];
    groups.forEach(function(g){var gi=items.filter(function(x){return x.kind===g[0];});if(!gi.length)return;h+='<div class="kv-group"><div class="kv-gh"><h2>'+g[1]+'</h2><span>'+g[2]+'</span></div>'+gi.map(kvCard).join('')+'</div>';});
    $('#view').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#view .kv-open'),function(b){b.onclick=function(){openReview(this.getAttribute('data-open'));};});
  }

  /* ---------- Reminders (docked slide panel, like Ask Korvyn) ---------- */
  var TODAY_D=new Date(2026,6,25); // Jul 25 2026 (close day 4 of 8)
  var _MOMAP={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  function dueDate(s){var p=s.trim().split(/\s+/);return new Date(2026,_MOMAP[p[0]],+p[1]);}
  function daysUntil(s){return Math.round((dueDate(s)-TODAY_D)/86400000);}
  function dueWord(d){return d<0?('overdue by '+(-d)+'d'):d===0?'today':d===1?'tomorrow':'in '+d+'d';}
  function reminders(){
    var now=[],later=[];
    REVIEWS.forEach(function(r){
      if(r.status==='approved')return;
      var d=daysUntil(r.due);
      var item={kind:'due',rid:r.id,d:d,name:r.name,due:r.due,sev:d<0?'over':(d<=1?'warn':'info')};
      if(d<=2)now.push(item); else if(d<=6)later.push(item);
    });
    now.sort(function(a,b){return a.d-b.d;});later.sort(function(a,b){return a.d-b.d;});
    var extra=[];
    REVIEWS.forEach(function(r){if(r.status!=='approved'&&/auditor/i.test(r.last))extra.push({kind:'audit',rid:r.id,sev:'info',name:r.name});});
    var oq=REVIEWS.reduce(function(a,r){return a+r.q},0),nrev=REVIEWS.filter(function(r){return r.q>0}).length;
    if(oq>0)extra.push({kind:'q',sev:'info',oq:oq,nrev:nrev});
    return {now:now.concat(extra),later:later};
  }
  function remNowCount(){return reminders().now.length;}
  function renderNotifBadge(){var b=document.getElementById('ribCount');if(!b)return;var c=remNowCount();b.textContent=c;b.classList.toggle('show',c>0);}
  function notifRow(x){
    var txt,cls=x.rid?' link':'',data=x.rid?' data-rid="'+esc(x.rid)+'"':'',tag=x.rid?'button':'div';
    if(x.kind==='due')txt='<b>'+esc(x.name)+'</b><span class="nd-when">due '+dueWord(x.d)+' &middot; '+esc(x.due)+'</span>';
    else if(x.kind==='audit')txt='<b>Auditor requested support</b><span class="nd-when">'+esc(x.name)+' &middot; open the review to respond</span>';
    else txt='<b>'+x.oq+' open questions</b><span class="nd-when">across '+x.nrev+' reviews need a response</span>';
    return '<'+tag+' class="nd-row'+cls+'"'+data+'><span class="nd-dot '+x.sev+'"></span><span class="nd-tx">'+txt+'</span>'+(x.rid?'<span class="nd-go">&rarr;</span>':'')+'</'+tag+'>';
  }
  var NP_BELL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>';
  function renderNotif(){
    var r=reminders();
    var h='<div class="ai-hd"><span class="ai-mark np-ic">'+NP_BELL+'</span><div class="htx"><div class="t">Reminders</div><div class="g">Close July 2026 &middot; day 4 of 8</div></div><span class="sp"></span><button class="ib" id="notifX" title="Close">&#10005;</button></div>';
    h+='<div class="nd-body">';
    if(!r.now.length&&!r.later.length){h+='<div class="nd-empty">Nothing due right now &mdash; you&rsquo;re clear.</div>';}
    else{
      if(r.now.length){h+='<div class="nd-sec">Needs attention</div>'+r.now.map(notifRow).join('');}
      if(r.later.length){h+='<div class="nd-sec">Later this week</div>'+r.later.map(notifRow).join('');}
    }
    h+='</div><div class="nd-ft"><span class="lk" id="ndAll">See all reviews &rarr;</span></div>';
    var el=document.getElementById('notifPanel');el.innerHTML=h;
    document.getElementById('notifX').onclick=notifClose;
    Array.prototype.forEach.call(el.querySelectorAll('.nd-row.link'),function(b){b.onclick=function(){var id=this.getAttribute('data-rid');notifClose();openReview(id);};});
    var all=document.getElementById('ndAll');if(all)all.onclick=function(){notifClose();navTo('my');};
  }
  function notifOpen(){if(typeof aiClose==='function')aiClose();renderNotif();document.body.classList.add('notif-open');}
  function notifClose(){document.body.classList.remove('notif-open');}
  function notifToggle(){document.body.classList.contains('notif-open')?notifClose():notifOpen();}
  function dueStripHTML(){
    var r=reminders();var due=r.now.filter(function(x){return x.kind==='due';}).concat(r.later).sort(function(a,b){return a.d-b.d;}).slice(0,4);
    if(!due.length)return '';
    return '<div class="duestrip"><span class="due-lbl">Due soon</span>'+due.map(function(x){return '<button class="due-chip'+(x.d<=1?' urg':'')+'" data-rid="'+esc(x.rid)+'"><span class="dd"></span>'+esc(x.name)+' <span class="dw">'+dueWord(x.d)+'</span></button>';}).join('')+'</div>';
  }
  function renderDueStrip(){var el=document.getElementById('dueStrip');if(!el)return;el.innerHTML=dueStripHTML();Array.prototype.forEach.call(el.querySelectorAll('.due-chip'),function(b){b.onclick=function(){openReview(this.getAttribute('data-rid'));};});}
  (function(){var b=document.getElementById('ribBell');if(b)b.onclick=notifToggle;})();

  /* ---------- boot ---------- */
  renderNav();
  renderHome();
  renderNotifBadge();
})();
</script>
