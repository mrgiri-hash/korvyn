  :root{
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,"Liberation Mono",monospace;
    --sans:"IBM Plex Sans","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* chrome */
    --navy:#14202F; --navy-2:#1B2A3C; --navy-line:#26374C; --navy-hd:#71809A;
    --navy-tx:#AEBAC9; --navy-tx-on:#FFFFFF;
    /* content */
    --ink:#17222F; --ink-2:#33414F; --muted:#5E6A78; --faint:#8B95A2;
    --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
    --border:#D5DBE3; --border-2:#E4E8EE; --border-strong:#C3CAD4;
    --pos:#2C7A54; --pos-bg:#E6F2EB; --neg:#BB3A2C; --neg-bg:#FAE9E6; --amber:#B9822A;
    --link:#356095; --accent:#2C7A54;
    --shadow:0 1px 2px rgba(20,32,47,.05);
    --fs-11:.625rem; --fs-12:.6875rem; --fs-13:.75rem; --fs-14:.8125rem; --fs-16:.875rem; --fs-20:1.125rem; --fs-28:1.5rem;
  }

  :root{--fx-stripe:#F6F8FA;--fx-hover:#EDF1F5;--fx-tot:#F6F8FA;--fx-sec:#EAEEF2;--fx-sec-tx:#17646F;--fx-curol:rgba(31,42,68,.022);--fx-head:linear-gradient(180deg,#FAFBFD,#F2F5F8);
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --raise:#EFF1F5;
    --chrome-accent:#2FA090; /* cobalt that reads on dark chrome — active-nav indicator; constant in both themes, like the ribbon */
    /* chrome hover/active/badge washes — white-translucent by default (dark chrome); light chrome themes invert these to dark-translucent */
    --chrome-lift:rgba(255,255,255,.06); --chrome-lift-on:rgba(255,255,255,.08); --chrome-badge:rgba(255,255,255,.09); --chrome-badge-on:rgba(255,255,255,.16);
    --ink:#141824; --ink-2:#252B3B; --muted:#565E72; --faint:#6B7285;
    --line:rgba(20,24,36,.10); --line-2:rgba(20,24,36,.18);
    --chrome:#5B6E8C; --chrome-2:#66799A; --chrome-ink:#FFFFFF; --chrome-ink-2:#E4ECF7; --chrome-line:rgba(255,255,255,.11);
    --accent:#0B1F3A; --accent-bg:#ECEEF1; --accent-line:#C3C9D2;
    --ai:#0B1F3A; --ai-bg:#F4F6F8; --ai-line:#DBDFE5;
    --pos:#0F6B5C; --warn:#B7862C; --neg:#B3261E;
    --pos-bg:#E1F0EC; --warn-bg:#F7EDDA; --neg-bg:#FBE7E6; --slate-bg:#EFF1F5;
    --radius:2px; --radius-sm:2px;
    --shadow:0 12px 34px rgba(16,18,24,.14);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* Intentional system-UI stack (native-crisp on every OS; no unloaded webfont).
       Inter kept first so embedding it later is a one-line upgrade. */
    --sans:"IBM Plex Sans","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* ===== Type scale — 7 steps, rem-based so it scales with browser zoom & OS a11y.
       11/12/13/14/16/20/28 at a 16px root. This is the ONLY set of sizes in the app. */
    --fs-11:0.625rem; --fs-12:0.6875rem; --fs-13:0.75rem; --fs-14:0.8125rem;
    --fs-16:1rem; --fs-20:1.25rem; --fs-28:1.75rem;
  }
  @media (prefers-color-scheme:dark){
    :root{--fx-stripe:#1C212A;--fx-hover:#1F242D;--fx-tot:#262D38;--fx-sec:#20262F;--fx-sec-tx:#64B6C2;--fx-curol:rgba(255,255,255,.05);--fx-head:linear-gradient(180deg,#242B35,#1A1F27);
      --bg:#0F1218; --surface:#171A21; --surface-2:#1C1F27; --raise:#232732;
      --ink:#F2F4F8; --ink-2:#DFE3EA; --muted:#A6ADBC; --faint:#8B93A4;
      --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
      --chrome:#516079; --chrome-2:#5C6E8C; --chrome-ink:#FFFFFF; --chrome-ink-2:#DCE6F4; --chrome-line:rgba(255,255,255,.11);
      --accent:#5FB6A5; --accent-bg:#13312C; --accent-line:#245049;
      --ai:#5FB6A5; --ai-bg:#12211E; --ai-line:#22423B;
      --pos:#4FBFA8; --warn:#D6A24E; --neg:#E8756B;
      --pos-bg:#0F2A25; --warn-bg:#2A2213; --neg-bg:#2C1613; --slate-bg:#232732;
      --shadow:0 14px 38px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --raise:#EFF1F5;
    --ink:#141824; --ink-2:#252B3B; --muted:#565E72; --faint:#6B7285;
    --line:rgba(20,24,36,.10); --line-2:rgba(20,24,36,.18);

    --ai:#0B1F3A; --ai-bg:#F4F6F8; --ai-line:#DBDFE5;
    --pos:#0F6B5C; --warn:#B7862C; --neg:#B3261E;
    --pos-bg:#E1F0EC; --warn-bg:#F7EDDA; --neg-bg:#FBE7E6; --slate-bg:#EFF1F5;
    --shadow:0 12px 34px rgba(16,18,24,.14);
  }
  :root[data-theme="dark"]{--fx-stripe:#1C212A;--fx-hover:#1F242D;--fx-tot:#262D38;--fx-sec:#20262F;--fx-sec-tx:#64B6C2;--fx-curol:rgba(255,255,255,.05);--fx-head:linear-gradient(180deg,#242B35,#1A1F27);

  *{box-sizing:border-box}
  html{font-size:16px}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-14);line-height:1.45;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4,p{margin:0}
  button{font-family:inherit;cursor:pointer}
  .lbl{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
  .mono{font-family:var(--mono)}

  /* Ribbon */
  .ribbon{position:sticky;top:0;z-index:30;height:52px;background:var(--chrome);color:var(--chrome-ink);
    display:flex;align-items:center;gap:16px;padding:0 18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-lockup{height:19px;width:auto;display:block}

  .fx-cn-lbl{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--faint)}

  /* review-package worklist (My / Team Reviews) */

  .rvw-kv{font-size:var(--fs-20);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}

  .rvw-kl{font-size:var(--fs-12);color:var(--ink-2);margin-top:3px}
  .rvw-ks{font-size:var(--fs-12);color:var(--faint);margin-top:1px}

  .rvw-kind{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:9px;vertical-align:middle}
  .rvw-kind.k-grp{background:var(--accent)} .rvw-kind.k-sub{background:var(--muted)} .rvw-kind.k-rep{background:var(--faint)}
  .rvw-kd{font-size:var(--fs-12);color:var(--faint);margin-left:9px;font-weight:400}
  .rvw-sub{color:var(--muted);font-size:var(--fs-12)}
  .rvw-num.acc{color:var(--accent)} .rvw-num.warn{color:var(--warn);font-weight:600}
  .rvw-ppl{color:var(--ink-2);font-size:var(--fs-12)}
  .rvw-av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:var(--fs-11);font-weight:500;margin-right:8px;vertical-align:middle}
  .rvw-av.rev{background:var(--ink-2)}
  .rvw-due.over{color:var(--neg);font-weight:600}
  .rvw-st{display:inline-block;padding:2px 9px;border-radius:2px;font-size:var(--fs-12);font-weight:500;white-space:nowrap}
  .rvw-st.s-review{background:var(--accent-bg);color:var(--accent)}
  .rvw-st.s-prep{background:var(--warn-bg);color:var(--warn)}
  .rvw-st.s-notstarted{background:var(--raise);color:var(--muted)}
  .rvw-st.s-approved{background:var(--pos-bg);color:var(--pos)}
  .rvw-open{background:none;border:1px solid var(--line-2);border-radius:2px;padding:4px 10px;font:inherit;font-size:var(--fs-12);color:var(--accent);cursor:pointer;white-space:nowrap}
  .rvw-open:hover{border-color:var(--accent);background:var(--accent-bg)}
  .rvw-empty{text-align:center;color:var(--faint);padding:26px}
  /* portfolio-scale intelligence cards */
  .rvw-det{margin:0 0 14px}
  .rvw-det-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);font-weight:600;color:var(--ink);margin-bottom:9px}
  .rvw-spark{color:var(--ai);font-size:var(--fs-14)}
  .rvw-det-s{font-weight:400;color:var(--faint);font-size:var(--fs-12)}
  .rvw-cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .rvw-cl{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;cursor:pointer;transition:border-color .1s}
  .rvw-cl:hover{border-color:var(--ai-line)}
  .rvw-cl-tag{display:inline-block;font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;font-weight:600;color:var(--ai-ink);background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:5px;padding:1px 7px;margin-bottom:8px}
  .rvw-cl-t{font-size:var(--fs-13);font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:5px}
  .rvw-cl-b{font-size:var(--fs-12);color:var(--muted);line-height:1.5}
  .rvw-cl-go{font-size:var(--fs-12);color:var(--accent);margin-top:8px;font-weight:500}
  /* sign-off tracker + actions */
  .rvw-sign-cell{white-space:nowrap}
  .rvw-track{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
  .rvw-dot{width:16px;height:4px;border-radius:2px;background:var(--raise)}
  .rvw-dot.on{background:var(--accent)}
  .rvw-stg{font-size:var(--fs-12);font-weight:500}
  .rvw-stg.s-signed{color:var(--pos)} .rvw-stg.s-notstarted{color:var(--muted)}
  .rvw-stg.s-prep,.rvw-stg.s-review,.rvw-stg.s-controller{color:var(--ink-2)}
  .rvw-acts{white-space:nowrap}
  .rvw-sign{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:2px;padding:4px 10px;font:inherit;font-size:var(--fs-12);color:var(--accent);cursor:pointer;margin-right:8px}
  .rvw-sign:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rvw-blk{display:inline-block;font-size:var(--fs-12);color:var(--warn);background:var(--warn-bg);border-radius:2px;padding:4px 9px;margin-right:8px}
  .rvw-signed{display:inline-block;font-size:var(--fs-12);color:var(--pos);margin-right:8px}
  /* review-lens + scope + find strip */
  .fx-filter{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
  .fxf-lb{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600}
  .fxf-lens{height:24px;padding:0 10px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:2px;font-size:var(--fs-12);font-family:inherit;cursor:pointer;white-space:nowrap;transition:.1s}

  .fxf-lens.on.t-warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(154,103,18,.32)}
  .fxf-lens.on.t-neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(192,57,43,.28)}
  .fxf-lens.on.t-pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(31,122,77,.28)}
  .fxf-div{width:1px;height:18px;background:var(--line-2);margin:0 2px}
  .fxf-find{height:24px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--ink);font-size:var(--fs-12);font-family:inherit;padding:0 9px;width:150px}
  .fxf-find:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .fxf-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .fxf-count{font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}
  .fxf-clear{border:0;background:none;color:var(--accent);font-size:var(--fs-12);cursor:pointer;font-family:inherit;padding:2px 4px}
  .fxf-clear:hover{text-decoration:underline}
  /* summary bar (scalable top; structural config in the Configure modal) */
  .fx-sum{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .fx-sum-tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
  .fx-sum-tabs .fx-sheet{border:0;border-right:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--fs-13);font-weight:500;padding:6px 14px;cursor:pointer}
  .fx-sum-tabs .fx-sheet:last-child{border-right:0}
  .fx-sum-tabs .fx-sheet:hover:not(.on){background:var(--raise);color:var(--ink)}
  .fx-sum-tabs .fx-sheet.on{background:#1C6B7A;color:#fff}
  .fx-sum-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fx-chip2{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--ink);font-size:var(--fs-13);font-family:inherit;cursor:pointer;white-space:nowrap}
  .fx-chip2:hover{border-color:var(--accent-line);background:var(--accent-bg)}
  .fx-chip2 .c-k{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600}
  .fx-sum-act{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fx-sum-act .btn{display:inline-flex;align-items:center;gap:6px}
  .fx-sum-act .fx-print,.fx-sum-act .fx-email{padding:8px 10px}
  /* ===== Review Canvas — compact header, one-line summary, single toolbar (table-first) ===== */
  .rvc-hd{padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .rvc-hd-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .rvc-title{font-size:var(--fs-20);font-weight:600;letter-spacing:.01em;color:var(--ink)}
  .rvc-act{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
  .rvc-meta{display:flex;align-items:center;gap:14px;margin-top:6px;flex-wrap:wrap}
  .rvc-m{font-size:var(--fs-13);color:var(--ink)}
  .rvc-m-k{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600;margin-right:6px}
  /* compact review summary — one line, replaces the KPI tiles */
  .fx-rsum{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:40px;max-height:48px;margin:0 0 10px;padding:5px 14px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
  .fx-rsum-g{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .fx-rsum-i{display:flex;flex-direction:column;gap:1px;line-height:1.14}
  .fx-rsum-i .k{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600}
  .fx-rsum-i .v{font-size:var(--fs-16);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .fx-rsum-i .v.pos{color:var(--pos)} .fx-rsum-i .v.neg{color:var(--neg)} .fx-rsum-i .v.acc{color:var(--accent)} .fx-rsum-i .v.warn{color:var(--warn)}
  .fx-rsum-div{width:1px;align-self:stretch;background:var(--line-2);margin:3px 0}
  .fx-rsum-scope{margin-left:auto;font-size:var(--fs-12);color:var(--ink-2);font-weight:500}
  .fx-rsum-scope .sc-k{color:var(--faint);font-weight:400}
  /* Increment 2 body declutter: a slim control row + a quiet caption above the grid, so the
     grid leads. Replaces the bordered fx-rsum card and the standalone rc-modebar band. */
  .fx-subbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
  .fx-sub-scope{margin-left:auto;font-size:var(--fs-12);color:var(--ink-2);font-weight:500}
  .fx-sub-scope .sc-k{color:var(--faint);font-weight:400}
  .fx-metrics{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:0 0 10px;padding:0 0 9px;border-bottom:1px solid var(--line)}
  .fx-mg{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .fx-mg-r{margin-left:auto}
  .fx-sm{display:inline-flex;align-items:baseline;gap:6px;line-height:1}
  .fx-sm .k{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600}
  .fx-sm .v{font-size:var(--fs-14);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .fx-sm .v.pos{color:var(--pos)} .fx-sm .v.neg{color:var(--neg)} .fx-sm .v.acc{color:var(--accent)} .fx-sm .v.warn{color:var(--warn)}
  /* ===== Review Framework: mode bar, review-mode first impression ===== */
  .rc-modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;flex-wrap:wrap}
  .rc-modes{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);border-radius:2px;padding:2px}
  .rc-mode{border:0;background:none;font-family:inherit;font-size:var(--fs-13);font-weight:500;color:var(--muted);padding:5px 14px;border-radius:2px;cursor:pointer}
  .rc-mode:hover:not(.on){color:var(--ink)}
  .rc-mode.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,36,.08)}
  .rc-mb-right{display:flex;align-items:center;gap:12px}
  .rc-mb-hint{font-size:var(--fs-12);color:var(--faint)}

  .rc-display-sel{height:28px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--ink);font-size:var(--fs-13);font-family:inherit;padding:0 8px;cursor:pointer}
  .rc-display-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .fx-rvw-ai{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;padding:9px 13px;background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:2px;font-size:var(--fs-13);color:var(--ink-2);line-height:1.5}
  .fx-rvw-ai .sp{color:var(--ai);font-size:var(--fs-14);flex:0 0 auto;margin-top:1px}
  .fx-rvw{margin:0 0 10px;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden}
  .fx-rvw-h{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600;padding:7px 13px 4px}
  .fx-rvw-list{display:flex;flex-wrap:wrap}
  .fx-rvw-item{flex:1 1 240px;min-width:0;display:flex;align-items:baseline;gap:10px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:none;font-family:inherit;text-align:left;padding:8px 13px;cursor:pointer}
  .fx-rvw-item:hover{background:var(--surface-2)}
  .fx-rvw-n{font-size:var(--fs-13);font-weight:500;color:var(--ink);white-space:nowrap}
  .fx-rvw-d{font-size:var(--fs-13);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .fx-rvw-d.up{color:var(--pos)} .fx-rvw-d.dn{color:var(--neg)}
  .fx-rvw-drv{font-size:var(--fs-12);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* single toolbar — statement · materiality · status · search · configure */
  .fx-tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .fx-tb-tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
  .fx-tb-tab{border:0;border-right:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-family:inherit;font-size:var(--fs-13);font-weight:500;padding:0 13px;height:28px;cursor:pointer}
  .fx-tb-tab:last-child{border-right:0}
  .fx-tb-tab:hover:not(.on){background:var(--raise);color:var(--ink)}
  .fx-tb-tab.on{background:var(--accent);color:#fff}
  .fx-tb-sep{width:1px;height:20px;background:var(--line-2)}
  .fx-tb-f{display:inline-flex;align-items:center;gap:6px}
  .fx-tb-l{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600}
  .fx-tb-sel{height:28px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--ink);font-size:var(--fs-13);font-family:inherit;padding:0 8px;cursor:pointer}
  .fx-tb-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .fx-tb-search{display:inline-flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);padding:0 9px;color:var(--muted)}
  .fx-tb-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .fx-tb-search .fxf-find{height:26px;border:0;background:none;padding:0;width:170px}
  .fx-tb-search .fxf-find:focus{outline:none;box-shadow:none;border:0}
  .fx-tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fx-tb-count{font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}
  .fx-tb-more{position:relative;display:inline-block}
  .fx-tb-more>summary{list-style:none;cursor:pointer;height:28px;width:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--muted)}
  .fx-tb-more>summary::-webkit-details-marker{display:none}
  .fx-tb-more>summary:hover{color:var(--ink);border-color:var(--faint)}
  .fx-tb-more[open]>summary{border-color:var(--accent);color:var(--accent)}
  .fx-tb-menu{position:absolute;top:calc(100% + 5px);right:0;z-index:20;min-width:170px;background:var(--surface);border:1px solid var(--line-2);border-radius:2px;box-shadow:var(--shadow);padding:5px}
  .fx-tb-mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;font-family:inherit;font-size:var(--fs-13);color:var(--ink-2);padding:7px 9px;border-radius:5px;cursor:pointer}
  .fx-tb-mi:hover{background:var(--surface-2);color:var(--ink)}
  .fx-tb-mi svg{color:var(--muted);flex:0 0 auto}
  /* Consolidated flux menu bar: Statement / View / Filter dropdowns replace the old control wall. */
  .fx-menubar{gap:8px;flex-wrap:wrap;align-items:center}
  /* Grouped ribbon: labeled control groups (expanded) that fold to a compact one-row bar (collapsed). */
  .fx-ribbon{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 10px;padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
  /* ===== PHASE 2 — box the Flux canvas (toolbar · metrics · grid) to the boxy language ===== */
  .fx-ribbon{border-color:var(--line-2);border-radius:2px;box-shadow:0 1px 2px rgba(20,32,47,.055),0 1px 1px rgba(20,32,47,.03)}
  .fx-metrics{border:1px solid var(--line-2);border-radius:2px;background:var(--surface);padding:11px 16px;margin:0 0 12px;
    box-shadow:0 1px 2px rgba(20,32,47,.055),0 1px 1px rgba(20,32,47,.03)}
  .fx-gridwrap{border:1px solid var(--line-2);border-radius:2px;
    box-shadow:0 1px 2px rgba(20,32,47,.055),0 1px 1px rgba(20,32,47,.03)}
  .fxg thead th{font-weight:600;letter-spacing:.015em}
  /* ===== PHASE 2 — typewriter across the UI chrome (prose stays humanist sans) ===== */
  .btn,.btn-primary,.btn-ghost,.btn.sm,.seg,.seg-b,.rp-seg-b,.pill,.chip,.tag,.rp-st,.rbadge,.nkid-b,
  .pw-tab,.rp-tab,.fx-tb-tab,.fxm-sum,.fxm-cur,.fxr-lbl,.fx-tb-l,.fxm-h,.fxm-opt,
  .fx-metrics,.fx-sm,.rp-tl,.rp-tl-m,.rvc-meta,.rvc-m,.rvc-m-k,.rp-whd-meta,
  .rb-period,.rb-search input,.ribai .rlbl,.ribsearch,
  .rvw-tbl,.rp-tbl,.tbl{font-family:var(--sans)}
  /* long-form page/help prose kept in the humanist sans; flux commentary is typewriter */
  .kv-sub,.subhead,.note,.ldg-note,.rp-ws-desc,.rp-empty,.ph-d,.rvc-hd .kv-sub{font-family:var(--sans)}
  /* ===== CONSISTENCY: the whole content plane is typewriter by default; only prose is sans.
     This is what makes every screen read uniformly instead of chasing per-class stragglers. ===== */
  /* body is typewriter (set on <body>) so EVERY surface — panels, inspector, ribbon,

  /* ===== Reminders (bell dropdown + Home due strip) ===== */
  .notifwrap{position:relative;display:inline-flex}

  .rp-tbl th{text-align:right;font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.01em;color:var(--muted);font-weight:600;padding:5px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2);white-space:nowrap}
  .rp-tbl th.l{text-align:left}
  .rp-tbl td{padding:0 14px;height:36px;border-bottom:1px solid var(--line);text-align:right;color:var(--ink-2);white-space:nowrap}
  .rp-tbl td.l{text-align:left}
  .rp-tbl tbody tr:last-child td{border-bottom:0}
  .rp-tbl tr.rp-row{cursor:pointer}
  .rp-tbl tr.rp-row:hover td{background:var(--surface-2)}
  .rp-pnm{color:var(--ink);font-weight:500}
  .rp-pnm{white-space:nowrap}
  .rp-pedit{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;padding:0;border:0;border-radius:2px;background:transparent;color:var(--faint);cursor:pointer;vertical-align:middle;opacity:0;transition:opacity .1s}
  .rp-row:hover .rp-pedit{opacity:1}
  .rp-pedit:hover{background:var(--surface-2);color:var(--accent)}
  .rp-pnm-in{width:180px;height:24px;padding:0 7px;border:1px solid var(--accent);border-radius:2px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:var(--fs-13);outline:none}
  .rp-gbbar{display:flex;align-items:center;gap:4px;margin:0 0 12px}
  .rp-gb-l{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-right:6px}
  .rp-gb-b{height:26px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:var(--fs-12);cursor:pointer}
  .rp-gb-b:hover{border-color:var(--faint);color:var(--ink)}
  .rp-gb-b.on{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:500}
  .rp-tbl tr.rp-grp-row td{background:var(--surface-2);padding:5px 12px;height:auto;border-bottom:1px solid var(--line-2)}
  .rp-grp-h{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:600}
  .rp-grp-n{margin-left:9px;color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0}
  .rp-grp-row{cursor:pointer}
  .rp-grp-tw{display:inline-block;width:13px;color:var(--faint);margin-right:4px}
  .rp-filt{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
  .rp-fsearch{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);min-width:220px}
  .rp-fsearch input{border:0;background:transparent;outline:none;font-family:inherit;font-size:var(--fs-12);color:var(--ink);width:100%}
  .rp-fsel{display:flex;align-items:center;gap:6px;font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .rp-fsel select{height:28px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font-family:inherit;font-size:var(--fs-12);color:var(--ink);padding:0 6px;text-transform:none;letter-spacing:0}
  .rp-fcount{font-size:var(--fs-12);color:var(--faint);margin-left:auto}
  .rp-fclear{height:28px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font-family:inherit;font-size:var(--fs-12);color:var(--ink-2);cursor:pointer}
  .rp-fclear:hover{border-color:var(--faint)}
  .rp-plock{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;color:var(--faint);vertical-align:middle}
  .rp-row.rp-locked .rp-pnm-t{color:var(--ink-2)}
  .rp-plock2{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:6px;padding:0;border:0;border-radius:2px;background:transparent;color:var(--faint);cursor:pointer;vertical-align:middle;opacity:.45;transition:opacity .1s}
  .rp-row:hover .rp-plock2{opacity:1}
  .rp-plock2:hover{background:var(--surface-2);color:var(--ink)}
  .rp-plock2.on{opacity:1;color:var(--warn)}
  .rp-plock2.on:hover{color:var(--accent)}
  .rp-ptype{display:block;font-size:var(--fs-12);color:var(--faint);font-weight:400;margin-top:2px}
  .rp-num{text-align:right}
  .rp-num.warn{color:var(--warn);font-weight:600}
  .rp-bar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--raise);vertical-align:middle;margin-right:8px;overflow:hidden}
  .rp-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
  .rp-pct{font-size:var(--fs-12);color:var(--muted)}
  .rp-ppl{color:var(--ink-2)}
  .rp-sub{color:var(--muted);font-size:var(--fs-12)}
  .rp-st{display:inline-block;padding:2px 9px;border-radius:5px;font-size:var(--fs-12);font-weight:500;white-space:nowrap}
  .rp-st.p-plan{background:var(--raise);color:var(--muted)}
  .rp-st.p-open,.rp-st.r-ip{background:var(--accent-bg);color:var(--accent)}
  .rp-st.p-review,.rp-st.r-cr{background:#EDE9FE;color:#6D4BC7}
  .rp-st.p-ctrl,.rp-st.r-rd{background:var(--warn-bg);color:var(--warn)}
  .rp-st.p-done,.rp-st.r-dn{background:var(--pos-bg);color:var(--pos)}
  .rp-st.p-arch,.rp-st.r-ns{background:var(--raise);color:var(--faint)}
  .rp-st.r-ne{background:var(--neg-bg);color:var(--neg)}
  @media(prefers-color-scheme:dark){ .rp-st.p-review,.rp-st.r-cr{background:#241C3A;color:#B9A6F0} }
  /* two-panel workspace */
  .rp-ws{display:grid;grid-template-columns:246px 1fr;gap:16px;align-items:start}
  .rp-ws-dir{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:8px;position:sticky;top:14px}
  .rp-ws-search{padding:2px 2px 8px}
  .rp-ws-find{width:100%;height:30px;border:1px solid var(--line-2);border-radius:2px;background:var(--bg);padding:0 10px;font:inherit;font-size:var(--fs-13);color:var(--ink)}
  .rp-ws-item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;font:inherit;font-size:var(--fs-13);color:var(--ink-2);cursor:pointer;padding:7px 9px;border-radius:2px;text-align:left}
  .rp-ws-item:hover{background:var(--surface-2)}
  .rp-ws-item.on{background:var(--accent-bg);color:var(--ink);font-weight:500}
  .rp-ws-ic{display:inline-flex;color:var(--muted)}
  .rp-ws-tw{display:inline-flex;color:var(--faint);transition:transform .12s;cursor:pointer;border-radius:3px}
  .rp-ws-tw.open{transform:rotate(90deg)}
  .rp-ws-tw-sp{width:15px;display:inline-block}
  .rp-ws-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rp-ws-ct{font-size:var(--fs-12);color:var(--muted)}
  .rp-ws-item.on .rp-ws-ct{color:var(--muted)}
  .rp-ws-kids{margin:1px 0 3px 14px;border-left:1px solid var(--line);padding-left:5px}
  .rp-ws-kid{font-size:var(--fs-13)}
  .rp-ws-body{min-width:0}
  /* period workspace: content-first sub-nav (replaces the in-page sidebar) */
  .pw-tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line-2);margin:8px 0 18px}
  .pw-tab{font:inherit;font-size:var(--fs-14);font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;cursor:pointer}
  .pw-tab:hover{color:var(--ink)}
  .pw-tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .pw-tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:var(--radius-sm)}
  .pw-tabs-sp{flex:1}
  .pw-search{width:260px;max-width:38%}
  .pw-search input{width:100%;height:30px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:inherit;font-size:var(--fs-13);padding:0 10px;box-sizing:border-box}
  .pw-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .pw-body{min-width:0}
  .rp-ws-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .rp-ws-title{font-size:var(--fs-16);font-weight:600;color:var(--ink);margin:0}
  .rp-ws-desc{font-size:var(--fs-12);color:var(--muted);margin-top:2px}
  .rp-ws-hd-act{display:flex;gap:7px;flex-shrink:0}
  .rp-subf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px}
  .rp-subf-c{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:11px 13px;cursor:pointer;font:inherit;color:var(--ink-2);text-align:left}
  .rp-subf-c:hover{border-color:var(--accent-line)}
  .rp-subf-c svg{color:var(--muted);flex-shrink:0}
  .rp-subf-n{font-size:var(--fs-13);font-weight:500;color:var(--ink)}
  .rp-subf-ct{font-size:var(--fs-12);color:var(--faint);margin-left:auto}
  .rp-rtbl td{height:30px}
  .rp-empty{padding:26px;text-align:center;color:var(--muted);font-size:var(--fs-13);background:var(--surface);border:1px dashed var(--line-2);border-radius:2px}
  .rp-link{background:none;border:0;font:inherit;color:var(--accent);cursor:pointer;padding:0}
  .rp-link:hover{text-decoration:underline}
  /* period overview sections */
  .rp-ov-sec{margin-bottom:18px}
  .rp-ov-h{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600;margin-bottom:8px}
  .rp-ov-ct{display:inline-block;margin-left:6px;padding:0 6px;min-width:16px;height:16px;line-height:16px;text-align:center;background:var(--warn-bg,var(--surface-2));color:var(--warn);border-radius:2px;font-size:var(--fs-12);font-weight:600;vertical-align:middle}
  .fx-sec.fx-focus{animation:fxFocusPulse 2.2s ease-out}
  .fx-sec.fx-focus td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
  @keyframes fxFocusPulse{0%,30%{background:var(--accent-bg)}100%{background:transparent}}
  .rp-ov-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .rp-list{padding:6px}
  .rp-li{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:var(--fs-13);color:var(--ink-2);cursor:pointer;padding:9px 8px;text-align:left}
  .rp-list .rp-li:last-child{border-bottom:0}
  .rp-li:hover{background:var(--surface-2)}
  .rp-li-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .rp-act{display:flex;align-items:flex-start;gap:9px;padding:8px;border-bottom:1px solid var(--line);font-size:var(--fs-13)}
  .rp-list .rp-act:last-child{border-bottom:0}
  .rp-act-t{color:var(--ink-2);line-height:1.4}
  .rp-act-m{display:block;font-size:var(--fs-12);color:var(--faint);margin-top:1px}
  .rvw-av.ai{background:var(--ai)}
  .rp-ov-dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .rp-ov-fold{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 13px;cursor:pointer;font:inherit;text-align:left;color:var(--ink-2)}
  .rp-ov-fold:hover{border-color:var(--accent-line)}
  .rp-ov-fold svg{color:var(--muted)}
  .rp-ov-fn{font-size:var(--fs-13);font-weight:500;color:var(--ink)}
  .rp-ov-fc{font-size:var(--fs-12);color:var(--faint)}
  /* folder-level control / sign-off gate */
  .rp-fctrl{display:flex;align-items:center;gap:7px;font-size:var(--fs-11)}
  .rp-ov-fold .rp-fctrl{margin-top:7px}
  .rp-subf-c{flex-wrap:wrap}
  .rp-subf-c .rp-fctrl{flex-basis:100%;margin-top:8px}
  .rp-fbar{flex:0 0 46px;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
  .rp-fbar span{display:block;height:100%;background:var(--accent)}
  .rp-fpct{color:var(--muted);font-variant-numeric:tabular-nums;min-width:28px}
  .rp-fstage{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rp-fctrl.g-done .rp-fbar span{background:var(--pos)} .rp-fctrl.g-done .rp-fstage{color:var(--pos)}
  .rp-fctrl.g-ready .rp-fbar span{background:var(--warn)} .rp-fctrl.g-ready .rp-fstage{color:var(--warn)}
  .rp-fctrl.g-blocked .rp-fbar span{background:var(--neg)} .rp-fctrl.g-blocked .rp-fstage{color:var(--neg)}
  .rp-fctrl.g-none{opacity:.5}
  /* collections tree (replaces folder tiles) */
  .rp-tree{padding:0;overflow:hidden}
  .rp-tr{display:flex;align-items:center;gap:8px;height:32px;border-bottom:1px solid var(--line);cursor:pointer;padding-right:14px}
  .rp-tr:last-child{border-bottom:0}
  .rp-tr:hover{background:var(--surface-2)}
  .rp-tr-tw{width:12px;flex:0 0 auto;color:var(--faint);font-size:10px;text-align:center}
  .rp-tr>svg{color:var(--muted);flex:0 0 auto;width:15px;height:15px}
  .rp-tr-n{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .rp-tr-fold .rp-tr-n{font-weight:500}
  .rp-tr-fold[data-tw="bs"] .rp-tr-n,.rp-tr-fold[data-tw="is"] .rp-tr-n,.rp-tr-fold[data-tw="cf"] .rp-tr-n,.rp-tr-fold[data-tw="fn"] .rp-tr-n,.rp-tr-fold[data-tw="mgmt"] .rp-tr-n{text-transform:uppercase;letter-spacing:.03em}
  .rp-tr-ct{color:var(--faint);font-size:var(--fs-11);min-width:16px}
  .rp-tr-fold .rp-fctrl{margin-left:auto;flex:0 0 auto;max-width:210px}
  .rp-tr-rev .rp-tr-n{color:var(--ink-2)}
  .rp-tr-type{color:var(--faint);font-size:var(--fs-11);white-space:nowrap}
  .rp-tr-need{color:var(--neg);font-size:var(--fs-11);white-space:nowrap}
  .rp-tr-rev .rp-oreview{margin-left:auto}
  /* one section per statement, same tree inside */
  .rp-csec{margin-bottom:18px}
  .rp-csec-hd{display:flex;align-items:center;gap:10px;padding:0 2px 8px}
  .rp-csec-nm{font-family:var(--sans);font-size:var(--fs-14);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
  .rp-csec-ct{font-size:var(--fs-11);color:var(--faint)}
  .rp-csec-hd .rp-fctrl{margin-left:auto;max-width:220px}
  /* statement selector — one section shown at a time */
  .rp-cstabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .rp-cstab{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface);font-family:var(--sans);font-size:var(--fs-12);letter-spacing:.02em;color:var(--ink-2);cursor:pointer}
  .rp-cstab:hover{border-color:var(--faint);color:var(--ink)}
  .rp-cstab.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .rp-cstab-n{font-size:var(--fs-11);color:var(--faint);font-variant-numeric:tabular-nums}
  .rp-cstab.on .rp-cstab-n{color:rgba(255,255,255,.7)}
  .rp-cstab.g-blocked:not(.on){border-color:var(--neg)}
  .rp-cstab.g-blocked:not(.on) .rp-cstab-nm::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--neg);margin-left:6px;vertical-align:middle}
  .rp-hub{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .rp-hub-c{gap:5px}
  .rp-hub-d{font-size:var(--fs-12);color:var(--muted);line-height:1.4}
  /* create-period drawer */
  .rp-drawer-bd{position:fixed;inset:0;background:rgba(16,20,28,.34);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
  body.rp-drawer-open .rp-drawer-bd{opacity:1;pointer-events:auto}
  .rp-drawer{position:fixed;top:0;right:0;height:100vh;width:452px;max-width:94vw;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:-14px 0 40px rgba(16,18,24,.16);transform:translateX(100%);transition:transform .2s ease;z-index:61;display:flex;flex-direction:column}
  body.rp-drawer-open .rp-drawer{transform:none}
  .rp-dr-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .rp-dr-hd .t{font-size:var(--fs-16);font-weight:600;color:var(--ink)}
  .rp-dr-x{background:none;border:0;font-size:var(--fs-20);line-height:1;color:var(--muted);cursor:pointer}
  .rp-dr-b{flex:1;overflow-y:auto;padding:16px 18px}
  .rp-dr-f{margin-bottom:13px}
  .rp-dr-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rp-dr-l{display:block;font-size:var(--fs-12);color:var(--muted);font-weight:500;margin-bottom:5px}
  .rp-in{width:100%;height:34px;border:1px solid var(--line-2);border-radius:2px;background:var(--bg);padding:0 10px;font:inherit;font-size:var(--fs-13);color:var(--ink)}
  .rp-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  select.rp-in{height:34px}
  .rp-ta{height:60px;padding:8px 10px;resize:vertical}
  .rp-dr-lbl{font-size:var(--fs-12);color:var(--muted);font-weight:500;margin:6px 0 7px}
  .rp-seg{display:flex;gap:6px;margin-bottom:14px}
  .rp-seg-b{flex:1;background:var(--bg);border:1px solid var(--line-2);border-radius:2px;padding:8px 6px;font:inherit;font-size:var(--fs-12);color:var(--ink-2);cursor:pointer}
  .rp-seg-b.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:500}
  .rp-copy-note{background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin-top:4px}
  .rp-copy-h{font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.01em;color:var(--muted);font-weight:600;margin-bottom:6px}
  .rp-copy-ul{margin:0 0 12px;padding-left:18px}
  .rp-copy-ul li{font-size:var(--fs-13);color:var(--ink-2);line-height:1.7}
  .rp-copy-ul.dim li{color:var(--faint)}
  .rp-copy-fine{font-size:var(--fs-12);color:var(--muted);font-style:italic;border-top:1px solid var(--line);padding-top:9px}
  .rp-dr-ft{display:flex;justify-content:flex-end;gap:9px;padding:14px 18px;border-top:1px solid var(--line)}
  /* templates */
  .rp-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .rp-tpl-c{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px}
  .rp-tpl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .rp-tpl-ic{color:var(--accent)}
  .rp-tag{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--raise);color:var(--muted)}
  .rp-tag.t-certified{background:var(--pos-bg);color:var(--pos)}
  .rp-tag.t-enterprise{background:var(--accent-bg);color:var(--accent)}
  .rp-tag.t-team{background:#EDE9FE;color:#6D4BC7}
  .rp-tag.t-representative{background:var(--warn-bg);color:var(--warn)}
  .rp-tag.t-blank{background:var(--raise);color:var(--muted)}
  .rc-banner{background:var(--warn-bg);border:1px solid rgba(154,103,18,.25);color:var(--warn);font-size:var(--fs-13);padding:8px 13px;border-radius:2px;margin:0 0 12px;line-height:1.5}
  .rc-banner b{font-weight:600}
  .rc-tpl-cfg{margin:9px 0 3px;font-size:var(--fs-12);color:var(--ink-2);line-height:1.7}
  .rc-tpl-cfg .rc-tpl-k{display:inline-block;min-width:54px;font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600;margin-right:6px}
  .rp-tpl-n{font-size:var(--fs-14);font-weight:600;color:var(--ink);margin-bottom:3px}
  .rp-tpl-ty{font-size:var(--fs-12);color:var(--muted);margin-bottom:11px}
  .rp-tpl-act{display:flex;gap:14px;border-top:1px solid var(--line);padding-top:10px}
  .rp-tpl-act .rp-link{font-size:var(--fs-12)}
  /* scope pages */
  .rp-scope{padding:18px 20px;max-width:640px}

  .fxi-dc{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:2px;padding:9px 11px;margin:8px 0}

  .fxi-dc-top{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--muted);margin-bottom:5px}
  .fxi-dc-by{color:var(--ink)}

  .fxi-dc-tag{font-size:var(--fs-11);font-weight:500;padding:1px 7px;border-radius:10px}
  .fxi-dc-tag.open{color:var(--neg);background:rgba(179,56,47,.1)}
  .fxi-dc-tag.res{color:var(--pos);background:rgba(30,140,90,.12)}
  .fxi-dc-tag.note{color:var(--muted);background:var(--surface2);font-weight:500}
  .fx-rev-flag{font-size:var(--fs-11);font-weight:600;color:var(--neg);background:rgba(179,56,47,.1);border-radius:3px;padding:0 5px;white-space:nowrap}
  .fxi-dc-tx{font-size:var(--fs-13);color:var(--ink);line-height:1.55}

  .fxi-fact:last-child{border-bottom:0}

  .fxi-note-sm{font-size:var(--fs-12);color:var(--muted);line-height:1.5;margin:0 0 12px}
  .fxi-layer{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:2px;padding:10px 12px;margin-bottom:9px}
  .fxi-layer.l-entity{border-left-color:var(--accent)} .fxi-layer.l-regional{border-left-color:var(--teal,#1C6B7A)} .fxi-layer.l-consolidated{border-left-color:var(--ink-2)}
  .fxi-layer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .fxi-lv{font-size:var(--fs-12);font-weight:600;color:var(--ink)}
  .fxi-rel{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.01em;font-weight:600;padding:2px 7px;border-radius:5px}
  .fxi-rel.r-inherit{background:var(--accent-bg);color:var(--accent)} .fxi-rel.r-here{background:var(--pos-bg);color:var(--pos)} .fxi-rel.r-above{background:var(--raise);color:var(--muted)}
  .fxi-layer-tx{font-size:var(--fs-13);color:var(--ink-2);line-height:1.55;margin-bottom:8px}

  .fxi-addnote{width:100%;background:var(--bg);border:1px dashed var(--line-2);border-radius:2px;font:inherit;font-size:var(--fs-13);color:var(--accent);cursor:pointer;padding:9px}
  .fxi-addnote:hover{border-color:var(--accent);background:var(--accent-bg)}
  .fxi-ev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

  .fxi-ev-n{flex:1;min-width:0;font-size:var(--fs-13);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fxi-ev-ref{font-size:var(--fs-12);color:var(--muted);white-space:nowrap}
  .fxi-empty2{font-size:var(--fs-13);color:var(--muted);line-height:1.5;padding:10px 0 14px}
  .fxi-lineage{padding:6px 0 4px}
  .fxi-lin-node{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
  .fxi-lin-node.src{border-color:var(--accent-line)} .fxi-lin-node.top{background:var(--surface-2)}

  .fxi-lin-node.src .fxi-lin-dot{background:var(--accent)} .fxi-lin-node.top .fxi-lin-dot{background:var(--ink-2)}
  .fxi-lin-n{font-size:var(--fs-13);color:var(--ink)}
  .fxi-lin-arrow{text-align:center;color:var(--faint);font-size:var(--fs-13);line-height:1.4}
  /* ===== Review-indicators cell (table) + enriched Review Panel tabs ===== */
  .fxg col.c-review{width:300px}
  .fxg td.fx-rev{text-align:left;vertical-align:top;padding:9px 12px 8px;white-space:normal;min-width:460px}
  .fx-rev-btn{display:inline-flex;align-items:center;gap:12px;cursor:pointer}
  .fx-ind{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-12);color:var(--muted);font-variant-numeric:tabular-nums}

  .fxg tr.fx-grp:hover .fx-rev-btn .fx-ind,.fxg tr.fx-det:hover .fx-rev-btn .fx-ind{color:var(--ink-2)}

  .fxg th.fx-rev-h{text-align:left;min-width:460px}
  /* Inline Explanation & review column: note text shows in place; details open the panel. */
  .fxg td.fx-xp-td{vertical-align:top}

  .fx-rev-st-ic{padding:2px 5px}

  .fx-notes{margin:12px 0 0;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden}
  .fx-notes-h{font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.015em;color:var(--muted);font-weight:600;padding:9px 14px 5px}

  .fxi-sv.up{color:var(--pos)} .fxi-sv.dn{color:var(--neg)} .fxi-sv.acc{color:var(--accent)} .fxi-sv.warn{color:var(--warn)}
  .fxi-sv.ok{color:var(--pos)} .fxi-sv.need{color:var(--warn)} .fxi-sv.ppl{font-weight:400;color:var(--ink-2)}

  /* Activity feed (typed events) */

    var body='<div class="ai-body">'+esc(msg.text)+(msg.done?'':'<span class="ai-cursor"></span>')+'</div>';
    var src=msg.done?'<div class="ai-src"><span class="ck">'+AI_CHECK+'</span>Live Korvyn agent'+(msg.tools.length?' &middot; grounded in '+msg.tools.map(function(t){return esc(t)}).join(', '):'')+'</div>':'';

  function paintLive(){var n=document.getElementById('aiLive');if(!n)return;n.innerHTML=liveInner(AI_THREAD[AI_THREAD.length-1]);var sc=document.getElementById('aiScroll');if(sc)sc.scrollTop=sc.scrollHeight;}
  function agentAsk(prompt){
    var cur=currentReview();var full=(cur?'[The user is viewing the '+cur.name+'.] ':'')+prompt;
    var msg={role:'ai',live:true,text:'',tools:[],done:false};AI_THREAD.push(msg);renderAIScroll();
    AI_BUSY=true;setSendEnabled(false);
    fetch(AGENT_URL+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:full,sessionId:AI_SESSION})}).then(function(res){
      if(!res.ok||!res.body)throw new Error('agent http '+res.status);
      var reader=res.body.getReader();var dec=new TextDecoder();var buf='';
      function pump(){return reader.read().then(function(r){
        if(r.done){msg.done=true;paintLive();AI_BUSY=false;setSendEnabled(true);return;}
        buf+=dec.decode(r.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
        lines.forEach(function(ln){if(!ln.trim())return;var e;try{e=JSON.parse(ln);}catch(x){return;}
          if(e.type==='text')msg.text+=(e.text||'');
          else if(e.type==='tool')msg.tools.push(e.text||e.name||e.tool||'tool');
          else if(e.type==='error')msg.text+=(msg.text?'\n\n':'')+'[agent error] '+(e.text||'unknown');
        });
        paintLive();return pump();
      });}
      return pump();
    }).catch(function(err){
      msg.live=false;msg.done=true;msg.ans=aiAnswer(prompt);
      AI_MODE='offline';AI_BUSY=false;renderAI();
    });
  }

  function rpPreviewRow(r,ri,cols){

    h+='<div class="evwrap"><table class="rev"><thead><tr><th>Period</th><th>Type</th><th>File</th><th class="r">Version</th><th class="r">Rows</th><th>Uploaded by</th><th>Uploaded</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function(u){
      var active=rpActive(u.period,u.type);var isA=active&&active.id===u.id;
      h+='<tr><td>'+rpPeriodById(u.period).label+'</td><td>'+(u.type==='GL'?'General ledger':'Trial balance')+'</td><td><div class="rev-nm" style="font-weight:400">'+esc(u.file)+'</div></td><td class="r">v'+u.ver+'</td><td class="r">'+rpNum(u.rows)+'</td><td><span class="who"><span class="ava">'+initials(u.by)+'</span>'+esc(u.by)+'</span></td><td>'+u.at+'</td><td>'+(isA?'<span class="st approved"><span class="d"></span>Active</span>':'<span class="st draft"><span class="d"></span>Superseded</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    $('#view').innerHTML=h;
  }

  /* ---------- Reminders (docked slide panel, like Ask Korvyn) ---------- */
  var TODAY_D=new Date(2026,6,25); // Jul 25 2026 (close day 4 of 8)
  var _MOMAP={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  function dueDate(s){var p=s.trim().split(/\s+/);return new Date(2026,_MOMAP[p[0]],+p[1]);}
  function daysUntil(s){return Math.round((dueDate(s)-TODAY_D)/86400000);}
  function dueWord(d){return d<0?('overdue by '+(-d)+'d'):d===0?'today':d===1?'tomorrow':'in '+d+'d';}
  function reminders(){
    var now=[],later=[];
    REVIEWS.forEach(function(r){
      if(r.status==='approved')return;
      var d=daysUntil(r.due);
      var item={kind:'due',rid:r.id,d:d,name:r.name,due:r.due,sev:d<0?'over':(d<=1?'warn':'info')};
      if(d<=2)now.push(item); else if(d<=6)later.push(item);
    });
    now.sort(function(a,b){return a.d-b.d;});later.sort(function(a,b){return a.d-b.d;});
    var extra=[];
    REVIEWS.forEach(function(r){if(r.status!=='approved'&&/auditor/i.test(r.last))extra.push({kind:'audit',rid:r.id,sev:'info',name:r.name});});
    var oq=REVIEWS.reduce(function(a,r){return a+r.q},0),nrev=REVIEWS.filter(function(r){return r.q>0}).length;
    if(oq>0)extra.push({kind:'q',sev:'info',oq:oq,nrev:nrev});
    return {now:now.concat(extra),later:later};
  }
  function remNowCount(){return reminders().now.length;}
  function renderNotifBadge(){var b=document.getElementById('ribCount');if(!b)return;var c=remNowCount();b.textContent=c;b.classList.toggle('show',c>0);}
  function notifRow(x){
    var txt,cls=x.rid?' link':'',data=x.rid?' data-rid="'+esc(x.rid)+'"':'',tag=x.rid?'button':'div';
    if(x.kind==='due')txt='<b>'+esc(x.name)+'</b><span class="nd-when">due '+dueWord(x.d)+' &middot; '+esc(x.due)+'</span>';
    else if(x.kind==='audit')txt='<b>Auditor requested support</b><span class="nd-when">'+esc(x.name)+' &middot; open the review to respond</span>';
    else txt='<b>'+x.oq+' open questions</b><span class="nd-when">across '+x.nrev+' reviews need a response</span>';
    return '<'+tag+' class="nd-row'+cls+'"'+data+'><span class="nd-dot '+x.sev+'"></span><span class="nd-tx">'+txt+'</span>'+(x.rid?'<span class="nd-go">&rarr;</span>':'')+'</'+tag+'>';
  }
  var NP_BELL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>';
  function renderNotif(){
    var r=reminders();
    var h='<div class="ai-hd"><span class="ai-mark np-ic">'+NP_BELL+'</span><div class="htx"><div class="t">Reminders</div><div class="g">Close July 2026 &middot; day 4 of 8</div></div><span class="sp"></span><button class="ib" id="notifX" title="Close">&#10005;</button></div>';
    h+='<div class="nd-body">';
    if(!r.now.length&&!r.later.length){h+='<div class="nd-empty">Nothing due right now &mdash; you&rsquo;re clear.</div>';}
    else{
      if(r.now.length){h+='<div class="nd-sec">Needs attention</div>'+r.now.map(notifRow).join('');}
      if(r.later.length){h+='<div class="nd-sec">Later this week</div>'+r.later.map(notifRow).join('');}
    }
    h+='</div><div class="nd-ft"><span class="lk" id="ndAll">See all reviews &rarr;</span></div>';
    var el=document.getElementById('notifPanel');el.innerHTML=h;
    document.getElementById('notifX').onclick=notifClose;
    Array.prototype.forEach.call(el.querySelectorAll('.nd-row.link'),function(b){b.onclick=function(){var id=this.getAttribute('data-rid');notifClose();openReview(id);};});
    var all=document.getElementById('ndAll');if(all)all.onclick=function(){notifClose();navTo('my');};
  }
  function notifOpen(){if(typeof aiClose==='function')aiClose();if(typeof fluxInspClose==='function')fluxInspClose();renderNotif();document.body.classList.add('notif-open');}
  function notifClose(){document.body.classList.remove('notif-open');}
  function notifToggle(){document.body.classList.contains('notif-open')?notifClose():notifOpen();}
  function dueStripHTML(){
    var r=reminders();var due=r.now.filter(function(x){return x.kind==='due';}).concat(r.later).sort(function(a,b){return a.d-b.d;}).slice(0,4);
    if(!due.length)return '';
    return '<div class="duestrip"><span class="due-lbl">Due soon</span>'+due.map(function(x){return '<button class="due-chip'+(x.d<=1?' urg':'')+'" data-rid="'+esc(x.rid)+'"><span class="dd"></span>'+esc(x.name)+' <span class="dw">'+dueWord(x.d)+'</span></button>';}).join('')+'</div>';
  }
  function renderDueStrip(){var el=document.getElementById('dueStrip');if(!el)return;el.innerHTML=dueStripHTML();Array.prototype.forEach.call(el.querySelectorAll('.due-chip'),function(b){b.onclick=function(){openReview(this.getAttribute('data-rid'));};});}
  (function(){var b=document.getElementById('ribBell');if(b)b.onclick=notifToggle;})();
  (function(){var ov=document.getElementById('reviewModal');if(ov)ov.onclick=function(e){if(e.target===ov)closeReviewModal();};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('reviewModal').classList.contains('open'))closeReviewModal();});})();

  /* ---------- global active-period switcher (the whole app scopes to one close period) ---------- */
  function reRenderCurrent(){var k=activeNav;
    if(k==='close-dash')renderCloseDash();
    else if(k==='controls')renderControls();
    else if(k==='repo-ledger')renderLedger();
    else if(k==='mfs')renderMonthlyFS();
    else if(k==='filing')renderFiling();
    else if(k==='mtrend')renderReviewCanvas();
    else if(k==='repo-upload')renderRepoUpload();
    else if(k==='repo-coa')renderRepoCoa();
    else if(k==='repo-history')renderRepoHistory();}
  function setActivePeriod(m){ACTIVE_PERIOD=m;ldgMonth=m;curPeriod=m;ldgExpand=null;paintPeriodChip();closePeriodMenu();reRenderCurrent();}
  function paintPeriodChip(){var b=document.getElementById('ribPeriod');if(!b)return;var p=rpPeriodById(ACTIVE_PERIOD);var right=p?(p.locked?'Locked':p.close):'';b.innerHTML='Close <b>'+(p?p.label:ACTIVE_PERIOD)+'</b>'+(right?' &middot; '+right:'')+'<svg class="rp-cv" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>';}
  function renderPeriodMenu(){var el=document.getElementById('periodMenu');if(!el)return;var h='';periodYears().forEach(function(g){h+='<div class="pm-yr">FY '+g.year+'</div>';g.periods.forEach(function(p){h+='<button class="pm-item'+(p.id===ACTIVE_PERIOD?' on':'')+'" data-mo="'+p.id+'"><span>'+p.label+'</span><span class="pm-st '+(p.locked?'lk':'op')+'">'+(p.locked?'Locked':'Open')+'</span></button>';});});el.innerHTML=h;Array.prototype.forEach.call(el.querySelectorAll('.pm-item'),function(b){b.onclick=function(){setActivePeriod(this.getAttribute('data-mo'));};});}
  function closePeriodMenu(){var el=document.getElementById('periodMenu');if(el)el.classList.remove('open');}
  function togglePeriodMenu(){var el=document.getElementById('periodMenu');if(!el)return;if(el.classList.contains('open')){closePeriodMenu();}else{renderPeriodMenu();el.classList.add('open');}}
  (function(){var b=document.getElementById('ribPeriod');if(b)b.onclick=function(e){e.stopPropagation();togglePeriodMenu();};
    document.addEventListener('click',function(e){var w=document.querySelector('.rb-period-wrap');if(w&&!w.contains(e.target))closePeriodMenu();});})();

  /* ---------- boot: land on the close Dashboard ---------- */
  try{if(localStorage.getItem('korvyn.nav')==='1')document.body.classList.add('nav-collapsed');}catch(e){}
  activeNav='close-dash';
  renderNav();
  renderCloseDash();
  paintPeriodChip();
  renderNotifBadge();
  (function(){var b=document.getElementById('navBack'),f=document.getElementById('navFwd');if(b)b.onclick=navBack;if(f)f.onclick=navFwd;})();
  navMark('nav');
})();
</script>
