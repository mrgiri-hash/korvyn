<title>Korvyn - Financial Review Platform</title>
<style>
  :root{--fx-stripe:#EFF2F5;--fx-hover:#E3EFEF;--fx-tot:#E5EAEF;--fx-sec:#E9EDF1;--fx-sec-tx:#17646F;--fx-head:linear-gradient(180deg,#F3F6F9,#E4EAF0);
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --raise:#EFF1F5;
    --chrome-accent:#7A9CF0; /* cobalt that reads on dark chrome — active-nav indicator; constant in both themes, like the ribbon */
    /* chrome hover/active/badge washes — white-translucent by default (dark chrome); light chrome themes invert these to dark-translucent */
    --chrome-lift:rgba(255,255,255,.06); --chrome-lift-on:rgba(255,255,255,.08); --chrome-badge:rgba(255,255,255,.09); --chrome-badge-on:rgba(255,255,255,.16);
    --ink:#141824; --ink-2:#252B3B; --muted:#565E72; --faint:#6B7285;
    --line:rgba(20,24,36,.10); --line-2:rgba(20,24,36,.18);
    --chrome:#161719; --chrome-2:#1C1D20; --chrome-ink:#EDEDEE; --chrome-ink-2:#A0A0A4; --chrome-line:rgba(255,255,255,.11);
    --accent:#2F62D4; --accent-bg:#EDF2FD; --accent-line:#C4D9FB;
    --ai:#6366F1; --ai-bg:#FAFAFF; --ai-line:#DDDEFB;
    --pos:#1F7A4D; --warn:#9A6712; --neg:#C0392B;
    --pos-bg:#EAF6EF; --warn-bg:#FDF3E2; --neg-bg:#FBECEA; --slate-bg:#EFF1F5;
    --radius:6px; --radius-sm:6px;
    --shadow:0 12px 34px rgba(16,18,24,.14);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--fx-stripe:#1C212A;--fx-hover:#213130;--fx-tot:#262D38;--fx-sec:#20262F;--fx-sec-tx:#64B6C2;--fx-head:linear-gradient(180deg,#242B35,#1A1F27);
      --bg:#0F1218; --surface:#171A21; --surface-2:#1C1F27; --raise:#232732;
      --ink:#F2F4F8; --ink-2:#DFE3EA; --muted:#A6ADBC; --faint:#8B93A4;
      --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
      --chrome:#101113; --chrome-2:#17181B; --chrome-ink:#E4E4E6; --chrome-ink-2:#9A9A9E; --chrome-line:rgba(255,255,255,.11);
      --accent:#7A9CF0; --accent-bg:#1A2438; --accent-line:#31456B;
      --ai:#818CF8; --ai-bg:#161A2E; --ai-line:#2E3358;
      --pos:#4FBF88; --warn:#D6A24E; --neg:#E8756B;
      --pos-bg:#12281E; --warn-bg:#2A2213; --neg-bg:#2C1613; --slate-bg:#232732;
      --shadow:0 14px 38px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --raise:#EFF1F5;
    --ink:#141824; --ink-2:#252B3B; --muted:#565E72; --faint:#6B7285;
    --line:rgba(20,24,36,.10); --line-2:rgba(20,24,36,.18);
    --chrome:#161719; --chrome-2:#1C1D20; --chrome-ink:#EDEDEE; --chrome-ink-2:#A0A0A4; --chrome-line:rgba(255,255,255,.11);
    --accent:#2F62D4; --accent-bg:#EDF2FD; --accent-line:#C4D9FB;
    --ai:#6366F1; --ai-bg:#FAFAFF; --ai-line:#DDDEFB;
    --pos:#1F7A4D; --warn:#9A6712; --neg:#C0392B;
    --pos-bg:#EAF6EF; --warn-bg:#FDF3E2; --neg-bg:#FBECEA; --slate-bg:#EFF1F5;
    --shadow:0 12px 34px rgba(16,18,24,.14);
  }
  :root[data-theme="dark"]{--fx-stripe:#1C212A;--fx-hover:#213130;--fx-tot:#262D38;--fx-sec:#20262F;--fx-sec-tx:#64B6C2;--fx-head:linear-gradient(180deg,#242B35,#1A1F27);
    --bg:#0F1218; --surface:#171A21; --surface-2:#1C1F27; --raise:#232732;
    --ink:#F2F4F8; --ink-2:#DFE3EA; --muted:#A6ADBC; --faint:#8B93A4;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
    --chrome:#101113; --chrome-2:#17181B; --chrome-ink:#E4E4E6; --chrome-ink-2:#9A9A9E; --chrome-line:rgba(255,255,255,.11);
    --accent:#7A9CF0; --accent-bg:#1A2438; --accent-line:#31456B;
    --ai:#818CF8; --ai-bg:#161A2E; --ai-line:#2E3358;
    --pos:#4FBF88; --warn:#D6A24E; --neg:#E8756B;
    --pos-bg:#12281E; --warn-bg:#2A2213; --neg-bg:#2C1613; --slate-bg:#232732;
    --shadow:0 14px 38px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,p{margin:0}
  button{font-family:inherit;cursor:pointer}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
  .mono{font-family:var(--mono)}

  /* Ribbon */
  .ribbon{position:sticky;top:0;z-index:30;height:52px;background:var(--chrome);color:var(--chrome-ink);
    display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--chrome-line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-lockup{height:19px;width:auto;display:block}
  .rb-ctx{display:flex;align-items:center;gap:8px;color:var(--chrome-ink-2);font-size:12px;padding-left:4px;border-left:1px solid var(--chrome-line);margin-left:2px}
  .rb-ctx b{color:var(--chrome-ink);font-weight:500}
  /* active-period switcher (global close context) */
  .rb-period-wrap{position:relative;display:flex}
  .rb-period{display:flex;align-items:center;gap:7px;color:var(--chrome-ink-2);font-size:12px;padding:6px 9px;margin-left:2px;
    background:none;border:0;border-left:1px solid var(--chrome-line);font-family:inherit;cursor:pointer;border-radius:0}
  .rb-period:hover{color:var(--chrome-ink)}
  .rb-period b{color:var(--chrome-ink);font-weight:500}
  .rb-period .rp-cv{opacity:.6}
  .period-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:224px;background:var(--surface);border:1px solid var(--line-2);
    border-radius:var(--radius);box-shadow:var(--shadow);z-index:50;display:none;padding:5px}
  .period-menu.open{display:block}
  .pm-yr{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:8px 10px 3px}
  .pm-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:7px 10px;border:0;background:none;
    font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;border-radius:var(--radius-sm);text-align:left}
  .pm-item:hover{background:var(--surface-2)}
  .pm-item.on{background:var(--accent-bg);color:var(--accent);font-weight:500}
  .pm-st{font-size:11px} .pm-st.op{color:var(--warn)} .pm-st.lk{color:var(--faint)}
  .ribbon .grow{flex:1}
  .rb-search{display:flex;align-items:center;gap:8px;background:var(--chrome-2);border:1px solid var(--chrome-line);
    border-radius:20px;padding:6px 13px;width:300px;max-width:34vw}
  .rb-search input{flex:1;background:transparent;border:0;color:var(--chrome-ink);font-family:inherit;font-size:12.5px;outline:none}
  .rb-search input::placeholder{color:var(--chrome-ink-2)}
  .rb-search svg{opacity:.6}
  .rb-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--chrome-ink-2);position:relative;background:transparent;border:0}
  .rb-ic:hover{color:var(--chrome-ink)}
  .rb-dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .rb-user{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:500}

  /* App grid */
  .app{display:grid;grid-template-columns:248px minmax(0,1fr)}
  /* the sidebar lives on the CONTENT plane (light in light mode, dark in dark mode); the ribbon
     stays dark chrome — so light mode gives a light sidebar under a dark top bar. */
  .nav{border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - 52px);padding:10px 10px;
    position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);overflow:auto;display:flex;flex-direction:column}
  .nav .ng{margin-bottom:6px}
  .nav .nh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500;padding:11px 10px 3px}
  .nitem{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:var(--radius-sm);color:var(--ink-2);font-size:13px;
    font-weight:400;cursor:pointer;border-left:2px solid transparent;position:relative}
  .nitem:hover{background:var(--surface-2)}
  .nitem.on{background:var(--accent-bg);color:var(--ink);font-weight:500;border-left-color:var(--accent)}
  .nitem svg{flex:0 0 auto;opacity:.85}
  .nitem>span:not(.nc){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nitem .nc{margin-left:auto;font-size:11px;color:var(--muted);background:var(--raise);border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
  .nitem.on .nc{background:var(--surface);color:var(--accent)}
  .nav .nsp{display:none}
  /* optional DARK sidebar (matches the ribbon) — body.chrome-nav, set from Settings */
  body.chrome-nav .nav{background:var(--chrome);border-right-color:var(--chrome-line)}
  body.chrome-nav .nav .nh{color:var(--chrome-ink-2)}
  body.chrome-nav .nitem{color:var(--chrome-ink-2)}
  body.chrome-nav .nitem:hover{background:var(--chrome-lift);color:var(--chrome-ink)}
  body.chrome-nav .nitem.on{background:var(--chrome-lift-on);color:var(--chrome-ink);border-left-color:var(--chrome-accent)}
  body.chrome-nav .nitem .nc{color:var(--chrome-ink-2);background:var(--chrome-badge)}
  body.chrome-nav .nitem.on .nc{background:var(--chrome-badge-on);color:var(--chrome-ink)}
  body.chrome-nav .nav .nsp{background:var(--chrome-line)}
  body.chrome-nav .navcollapse{color:var(--chrome-ink-2)}
  body.chrome-nav .navcollapse:hover{background:var(--chrome-lift);color:var(--chrome-ink)}
  /* collapse toggle, pinned to the bottom of the rail */
  .navcollapse{display:flex;align-items:center;gap:10px;width:100%;margin-top:auto;padding:8px 10px;border:0;background:transparent;
    color:var(--muted);font-family:inherit;font-size:12.5px;cursor:pointer;border-radius:var(--radius-sm)}
  .navcollapse:hover{background:var(--surface-2);color:var(--ink)}
  .navcollapse svg{flex:0 0 auto}
  /* collapsed = 60px icon rail: labels, counts and group headings drop; icons center */
  body.nav-collapsed .app{grid-template-columns:60px minmax(0,1fr)}
  body.nav-collapsed .nav{padding:16px 8px}
  body.nav-collapsed .nitem{justify-content:center;padding:8px 0;gap:0}
  body.nav-collapsed .nitem>span:not(.nc){display:none}
  body.nav-collapsed .nitem .nc{display:none}
  body.nav-collapsed .nav .nh{height:9px;padding:0;overflow:hidden;color:transparent}
  body.nav-collapsed .navcollapse{justify-content:center;padding:8px 0}
  body.nav-collapsed .navcollapse .nctxt{display:none}
  body.nav-collapsed.ai-full .aipanel{left:60px}
  /* settings page */
  .set-opts{display:flex;gap:10px;flex-wrap:wrap}
  .set-opt{flex:1;min-width:130px;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
    padding:12px 14px;cursor:pointer;font-family:inherit;transition:.13s}
  .set-opt:hover{border-color:var(--muted)}
  .set-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .set-opt-t{font-size:13px;font-weight:500;color:var(--ink)}
  .set-opt-d{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* ---- color themes (chrome-only): ribbon + sidebar, constant across light/dark ---- */
  :root[data-chrome="midnight"]{--chrome:#0F1729;--chrome-2:#172138;--chrome-accent:#7FA0F5}
  :root[data-chrome="carbon"]{--chrome:#0C0C0D;--chrome-2:#161617;--chrome-accent:#7A9CF0}
  :root[data-chrome="evergreen"]{--chrome:#12211B;--chrome-2:#1A2E26;--chrome-accent:#5CC08D}
  :root[data-chrome="ocean"]{--chrome:#0D1E24;--chrome-2:#152C34;--chrome-accent:#48C0CE}
  :root[data-chrome="plum"]{--chrome:#1C1522;--chrome-2:#281E30;--chrome-accent:#B79CF5}
  :root[data-chrome="sand"]{--chrome:#211D17;--chrome-2:#2E2921;--chrome-accent:#E0B978}
  :root[data-chrome="black"]{--chrome:#000000;--chrome-2:#0B0B0C;--chrome-accent:#7A9CF0}
  /* light chrome themes: dark text + dark-translucent washes; the white wordmark is inverted */
  :root[data-chrome^="light-"]{--chrome-ink:#1A1D24;--chrome-ink-2:#5A6273;--chrome-line:rgba(20,24,36,.12);
    --chrome-lift:rgba(20,24,36,.05);--chrome-lift-on:rgba(20,24,36,.08);--chrome-badge:rgba(20,24,36,.07);--chrome-badge-on:rgba(20,24,36,.13);--chrome-accent:#2F62D4}
  :root[data-chrome^="light-"] .brand-lockup{filter:brightness(0)}
  :root[data-chrome^="light-"] .ribai svg{color:#5B62E8}
  :root[data-chrome="light-snow"]{--chrome:#FFFFFF;--chrome-2:#F0F2F5}
  :root[data-chrome="light-mist"]{--chrome:#F2F4F7;--chrome-2:#E7EAF0}
  :root[data-chrome="light-sky"]{--chrome:#EEF3FB;--chrome-2:#E1EAF7}
  :root[data-chrome="light-paper"]{--chrome:#F7F5F0;--chrome-2:#EDE9E0}
  /* ---- settings page ---- */
  .set-wrap{display:grid;grid-template-columns:196px minmax(0,1fr);gap:28px;align-items:start}
  .set-nav{position:sticky;top:72px;display:flex;flex-direction:column;gap:1px}
  .set-nav a{padding:8px 11px;border-radius:var(--radius-sm);color:var(--muted);font-size:13px;cursor:pointer}
  .set-nav a:hover{background:var(--surface-2);color:var(--ink-2)}
  .set-nav a.on{background:var(--accent-bg);color:var(--ink);font-weight:500}
  .set-main{min-width:0}
  .set-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:2px 18px;margin-bottom:18px}
  .sb-h{font-size:13px;font-weight:500;color:var(--ink);padding:13px 0 2px}
  .sb-d{font-size:12px;color:var(--muted);margin:2px 0 4px}
  .set-row{display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}
  .set-block .set-row:last-child{border-bottom:0}
  .srx{flex:1;min-width:0}
  .srt{font-size:13px;color:var(--ink);font-weight:500}
  .srd{font-size:12px;color:var(--muted);margin-top:2px}
  .src{flex:0 0 auto;display:flex;align-items:center;gap:12px}
  .set-val{font-size:13px;color:var(--ink-2)}
  .set-ibtn{padding:7px 13px;font-size:12.5px}
  .tgl{width:38px;height:22px;border-radius:12px;background:var(--line-2);border:0;position:relative;cursor:pointer;flex:0 0 auto;transition:.15s;padding:0}
  .tgl:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tgl.on{background:var(--accent)}
  .tgl.on:after{left:18px}
  .set-sel{font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;min-width:150px}
  .thm-grid{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 10px}
  .thm-sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin-top:8px}
  .thm-sub:first-of-type{margin-top:2px}
  .thm{width:104px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;font-family:inherit;text-align:left;transition:.13s}
  .thm:hover{border-color:var(--muted)}
  .thm.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .thm-bar{display:flex;align-items:center;justify-content:flex-end;height:38px;padding:0 9px}
  .thm-bar.lt{box-shadow:inset 0 0 0 1px var(--line)}
  .thm-dot{width:12px;height:12px;border-radius:50%}
  .thm-l{display:block;font-size:12px;color:var(--ink-2);padding:7px 9px}
  .thm.on .thm-l{color:var(--ink);font-weight:500}
  .sess{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .set-block .sess:last-child{border-bottom:0}
  .sess-x{flex:1}
  .sess-d{font-size:13px;color:var(--ink);font-weight:500}
  .sess-cur{font-size:11px;color:var(--pos);font-weight:500;margin-left:6px}
  .sess-m{font-size:12px;color:var(--muted);margin-top:2px}
  .sess-revoke{padding:6px 12px;font-size:12px}
  .set-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 6px}
  .set-tbl th{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line-2)}
  .set-tbl th:first-child{text-align:left}
  .set-tbl td{text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);color:var(--ink-2)}
  .set-tbl td.rl{text-align:left;color:var(--ink);font-weight:500}
  .set-tbl tr:last-child td{border-bottom:0}
  .set-tbl .ck{color:var(--pos)} .set-tbl .xk{color:var(--faint)}
  .intg-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
  .intg-st .d{width:7px;height:7px;border-radius:50%}
  .intg-st.ok{color:var(--pos)} .intg-st.ok .d{background:var(--pos)}
  .intg-st.warn{color:var(--warn)} .intg-st.warn .d{background:var(--warn)}
  .intg-when{font-size:11.5px;color:var(--faint)}
  .ev2{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
  .set-block .ev2:last-child{border-bottom:0}
  .ev2-x{flex:1}
  .ev2-t{font-size:12.5px;color:var(--ink)}
  .ev2-m{font-size:11.5px;color:var(--muted);margin-top:1px}
  .ev2-w{font-size:11.5px;color:var(--faint)}
  .cmp-badges{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px}
  .cmp{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;font-weight:500}
  .set-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--surface);font-size:12.5px;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s;z-index:60;max-width:80vw}
  .set-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){ .set-wrap{grid-template-columns:1fr} .set-nav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;margin-bottom:14px} }
  /* compact density — a real, visible effect */
  body.compact table.rev tbody td{height:44px}
  body.compact .ins,body.compact .act{padding-top:9px;padding-bottom:9px}
  body.compact .set-row{padding:10px 0}
  /* ---- GL <-> TB tie-out ledger ---- */
  .ldg-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 16px}
  .ldg-mo{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:7px 13px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted)}
  .ldg-mo:hover{border-color:var(--muted)}
  .ldg-mo.on{border-color:var(--accent);color:var(--ink);font-weight:500;box-shadow:0 0 0 2px var(--accent-bg)}
  .ldg-mo-s{width:6px;height:6px;border-radius:50%}
  .ldg-mo-s.ok{background:var(--pos)} .ldg-mo-s.ex{background:var(--warn)}
  .ldg-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .ldg-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px}
  .ldg-kpi .lk{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
  .ldg-kpi .lv{font-size:17px;font-weight:500;color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums}
  .ldg-kpi .lv.ok{color:var(--pos)} .ldg-kpi .lv.ex{color:var(--warn)}
  .ldg-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}

  .hero{display:flex;align-items:center;gap:26px;padding:20px 24px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:26px}
  .hero .ht{flex:0 0 auto}
  .hero .ht .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
  .hero .ht h1{font-size:21px;font-weight:500;letter-spacing:.01em;margin-top:3px}
  .hero .ht .d{font-size:12px;color:var(--muted);margin-top:3px}
  .hero .prog{flex:1;min-width:0}
  .hero .prog .pr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .hero .prog .pr-top .pl{font-size:12px;color:var(--muted)}
  .hero .prog .pr-top .pv{font-size:13px;color:var(--ink);font-weight:500}
  .bar{height:7px;background:var(--raise);border-radius:5px;overflow:hidden;display:flex}
  .bar .seg{height:100%}
  .bar .seg.done{background:var(--pos)}
  .bar .seg.prog{background:var(--accent)}
  .hero .stats{display:flex;gap:22px;flex:0 0 auto}
  .hero .stat{text-align:right}
  .hero .stat .sv{font-size:18px;font-weight:500}
  .hero .stat .sl{font-size:11px;color:var(--muted);margin-top:1px}
  .hero .stat.att .sv{color:var(--warn)}

  /* Section */
  .sec{margin-bottom:26px}
  .sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .sec-h h2{font-size:15px;font-weight:500;letter-spacing:.01em}
  .sec-h .note{font-size:12px;color:var(--muted)}
  .sec-h .grow{flex:1}
  .sec-h .link{font-size:12px;color:var(--accent);cursor:pointer}

  /* Reviews table */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.rev{width:100%;border-collapse:collapse}
  table.rev thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;
    padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  table.rev thead th.r{text-align:right}
  table.rev tbody td{padding:0 16px;height:54px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  table.rev tbody tr:last-child td{border-bottom:0}
  table.rev tbody tr{cursor:pointer}
  table.rev tbody tr:hover td{background:var(--surface-2)}
  .rev-nm{font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
  .rev-nm .ico{width:26px;height:26px;border-radius:7px;background:var(--slate-bg);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
  .rev-nm .sub{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
  td.r{text-align:right}
  .st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .st .d{width:6px;height:6px;border-radius:50%}
  .st.approved{background:var(--pos-bg);color:var(--pos)} .st.approved .d{background:var(--pos)}
  .st.review{background:var(--accent-bg);color:var(--accent)} .st.review .d{background:var(--accent)}
  .st.attention{background:var(--warn-bg);color:var(--warn)} .st.attention .d{background:var(--warn)}
  .st.draft{background:var(--slate-bg);color:var(--muted)} .st.draft .d{background:var(--faint)}
  .st.notstarted{background:transparent;color:var(--faint);border:1px solid var(--line-2)} .st.notstarted .d{background:var(--faint)}
  .who{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px}
  .ava{width:22px;height:22px;border-radius:50%;background:var(--slate-bg);color:var(--muted);display:inline-grid;place-items:center;font-size:10px;font-weight:500;flex:0 0 auto}
  .qn{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:500;padding:0 6px}
  .qn.has{background:var(--warn-bg);color:var(--warn)} .qn.zero{color:var(--faint)}
  .evn{color:var(--ink-2)} .last{color:var(--muted);font-size:12px}
  .due{color:var(--ink-2)} .due.soon{color:var(--warn);font-weight:500}

  /* Two-up */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

  /* Insights */
  .ins{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .ins:last-child{border-bottom:0}
  .ins:hover{background:var(--surface-2)}
  .ins .sp{flex:0 0 auto;margin-top:1px;color:var(--ai)}
  .ins .ix{flex:1;min-width:0}
  .ins .it{font-size:13px;color:var(--ink);line-height:1.45}
  .ins .im{font-size:11.5px;color:var(--muted);margin-top:3px}
  .ins .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .ins .dot.watch{background:var(--warn)} .ins .dot.info{background:var(--faint)}

  /* Activity */
  .act{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .ava{width:26px;height:26px;font-size:10px;background:var(--accent);color:#fff}
  .act .ava.sys{background:var(--ai)}
  .act .ax{flex:1;min-width:0}
  .act .at{font-size:13px;color:var(--ink-2);line-height:1.4}
  .act .at b{color:var(--ink);font-weight:500}
  .act .am{font-size:11.5px;color:var(--faint);margin-top:2px}

  /* Knowledge timeline */
  .kn{position:relative;padding:0 15px 0 15px}
  .krow{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
  .krow:last-child{border-bottom:0}
  .kmark{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ai-bg);border:1px solid var(--ai-line);
    display:grid;place-items:center;color:var(--ai)}
  .kx{flex:1;min-width:0}
  .kt{font-size:13px;color:var(--ink);line-height:1.45}
  .km{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .kpill{background:var(--slate-bg);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}

  /* Evidence */
  .evrow{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .evrow:last-child{border-bottom:0}
  .evrow:hover{background:var(--surface-2)}
  .evext{flex:0 0 auto;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;letter-spacing:.02em}
  .evx{flex:1;min-width:0}
  .evn2{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evm2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .evt{font-size:11.5px;color:var(--faint);flex:0 0 auto}

  /* ---- Review workspace ---- */
  .wsback{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;cursor:pointer;margin-bottom:14px}
  .wsback:hover{color:var(--ink)}
  .wshead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .wshead .wt{font-size:22px;font-weight:500;letter-spacing:.01em}
  .wshead .wsub{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .wshead .grow{flex:1}
  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-weight:500}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .wsgrid{display:grid;grid-template-columns:194px minmax(0,1fr);gap:26px;align-items:start}
  .wsnav{position:sticky;top:72px;display:flex;flex-direction:column;gap:1px}
  .wsnav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--muted);font-size:12.5px;text-decoration:none;cursor:pointer}
  .wsnav a:hover{background:var(--surface-2);color:var(--ink-2)}
  .wsnav a .n{margin-left:auto;font-size:10px;color:var(--faint)}
  .wsnav a.done{color:var(--ink-2)}
  .wsnav a .chk{color:var(--pos)}
  .wsec{margin-bottom:26px;scroll-margin-top:72px}
  .wsec h3{font-size:14px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .wsec .wp{font-size:12px;color:var(--muted);margin-bottom:11px}
  .wsec .num{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:500}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .panel.ai{background:var(--ai-bg);border-color:var(--ai-line)}
  .ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ai);font-weight:500;margin-bottom:9px}
  .obs{display:flex;gap:9px;padding:6px 0;font-size:13px;color:var(--ink-2)}
  .obs .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .obs .d.watch{background:var(--warn)} .obs .d.info{background:var(--faint)}
  .exectxt{font-size:13.5px;color:var(--ink-2);line-height:1.65}
  .stub{color:var(--muted);font-size:12.5px;line-height:1.55;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:13px 15px}
  .stub b{color:var(--ink-2);font-weight:500}
  .minibars{display:flex;align-items:flex-end;gap:5px;height:56px;margin:6px 0 10px}
  .minibars .mb{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
  .minibars .mb.hl{background:var(--warn)}
  .cmt{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .cmt:last-child{border-bottom:0}
  .cmt .cb{flex:1}
  .cmt .ch{font-size:12.5px;margin-bottom:2px}
  .cmt .ch b{font-weight:500}
  .cmt .ch .tm{color:var(--faint);font-size:11px;margin-left:6px}
  .cmt .ctx{font-size:12.5px;color:var(--ink-2)}
  .hitem{display:flex;gap:10px;padding:8px 0;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
  .hitem:last-child{border-bottom:0}
  .hitem .ht2{flex:0 0 120px;color:var(--faint);font-size:11.5px}
  .aud{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
  .aud:last-child{border-bottom:0}
  .aud .ck{color:var(--pos)} .aud .xk{color:var(--faint)}
  .aud .grow{flex:1}
  .aud .lk{color:var(--accent);cursor:pointer;font-size:12px}

  /* ===== wired review engine (real GL) ===== */
  :root{--s1:#2F62D4;--s2:#0E9AA6;--s3:#7C4DD6;--s4:#C24D8A;--s5:#B8722E;--sother:#98A0AD}
  .exec-ul{margin:0;padding-left:18px}
  .exec-ul li{margin:5px 0;color:var(--ink-2);font-size:13.5px;line-height:1.55}
  .exec-ul li b{color:var(--ink);font-weight:500}
  .ectrl{display:flex;gap:22px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
  .eseg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px;gap:2px;margin-left:8px}
  .eseg button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:5px 11px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer}
  .eseg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .elegend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
  .elg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .elg .sw{width:11px;height:11px;border-radius:3px}
  .echart-wrap{position:relative;width:100%}
  svg.echart{width:100%;height:auto;display:block;overflow:visible}
  .echart .gridln{stroke:var(--line);stroke-width:1}
  .echart .zeroln{stroke:var(--line-2);stroke-width:1}
  .echart .axtx{fill:var(--faint);font-size:10px;font-family:var(--sans)}
  .echart .ser{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .echart .cross{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
  .etip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:9px 11px;font-size:12px;min-width:150px;visibility:hidden}
  .etip .tp{font-size:11px;color:var(--muted);margin-bottom:6px}
  .etip .tr{display:flex;align-items:center;gap:7px;padding:2px 0}
  .etip .tr .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .etip .tr .nm{color:var(--ink-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .etip .tr .vl{font-weight:500}
  .evwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:2px}
  table.evt{border-collapse:collapse;width:100%;font-size:12px}
  table.evt th,table.evt td{padding:0 11px;height:38px;white-space:nowrap}
  table.evt thead th{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;text-align:right;border-bottom:1px solid var(--line-2)}
  table.evt thead th.l{text-align:left}
  table.evt td{text-align:right;border-bottom:1px solid var(--line)}
  table.evt tbody tr:last-child td{border-bottom:0}
  table.evt td.g{text-align:left;position:relative;padding-left:16px;max-width:230px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  table.evt td.g.nod{cursor:default}
  table.evt td.g .sw{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:2px}
  table.evt td.g .ex{color:var(--faint);margin-right:5px;font-size:10px;display:inline-block;width:8px}
  table.evt tr.gr:hover td{background:var(--surface-2)}
  table.evt tr.gr.op td{background:var(--surface-2)}
  table.evt tr.mtl td.g::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
  table.evt tfoot td{height:40px;font-weight:500;border-top:1px solid var(--line-2);background:var(--surface-2)}
  .ematl{display:inline-block;font-size:10px;font-weight:500;padding:1px 7px;border-radius:20px}
  .ematl.y{background:var(--warn-bg);color:var(--warn)} .ematl.n{color:var(--faint)}
  .edelta{display:inline-flex;align-items:center;gap:3px;color:var(--ink-2)} .edelta .ar{color:var(--faint);font-size:10px}
  .epct{color:var(--faint);font-size:11px}
  tr.edr td{background:var(--raise);padding:0;border-bottom:1px solid var(--line-2)}
  .edrbox{padding:10px 14px 12px 22px}
  .edrbox .dh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  table.edtx{width:100%;border-collapse:collapse;font-size:11.5px}
  table.edtx td{padding:4px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
  table.edtx td.n{text-align:right;font-variant-numeric:tabular-nums}
  table.edtx tr:last-child td{border-bottom:0}
  .eerp{font-size:11px;color:var(--accent);cursor:pointer}
  .espark{display:block}

  @media (max-width:1080px){ .grid2{grid-template-columns:1fr} .wsgrid{grid-template-columns:1fr} .wsnav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;margin-bottom:16px} .hero{flex-wrap:wrap} }
  @media (max-width:760px){ .app,body.nav-collapsed .app{grid-template-columns:1fr} .nav{display:none} .rb-search{display:none} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ===== Ask Korvyn (agentic AI panel) ===== */
  .ribai{display:inline-flex;align-items:center;gap:7px;background:var(--chrome-2);border:1px solid var(--chrome-line);color:var(--chrome-ink);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer}
  .ribai:hover{background:var(--chrome-lift-on)}
  .ribai svg{color:#9DA2F7}
  body.ai-open .ribai{background:#2b2c4d;border-color:#3a3c66}
  .app{transition:margin-right .2s ease}
  body.ai-open:not(.ai-full) .app{margin-right:380px}
  .aipanel{position:fixed;top:52px;right:0;width:380px;height:calc(100vh - 52px);background:var(--surface);border-left:1px solid var(--line);
    display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease,left .16s ease,width .16s ease;z-index:40}
  body.ai-open .aipanel{transform:translateX(0);box-shadow:var(--shadow)}
  /* FULL workspace — the panel fills the content area; ribbon + left nav stay put and usable. */
  body.ai-full .aipanel{left:248px;width:auto;box-shadow:none;border-left:1px solid var(--line-2)}
  body.ai-full .ai-scroll,body.ai-full .ai-foot{max-width:900px;margin-left:auto;margin-right:auto;width:100%}
  body.ai-full .ai-hd{padding-left:26px;padding-right:26px}
  .ai-hd{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
  .ai-hd .ai-mark{color:var(--ai);display:flex}
  .ai-hd .htx .t{font-size:13.5px;font-weight:500}
  .ai-hd .htx .g{font-size:11px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:5px}
  .ai-hd .htx .g .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .ai-hd .htx .g.live .dot{background:var(--pos)} .ai-hd .htx .g.live{color:var(--pos)}
  .ai-hd .htx .g.offline .dot{background:var(--faint)}
  .ai-hd .sp{flex:1}
  .ai-hd .ib{width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:14px;display:grid;place-items:center;font-family:inherit}
  .ai-hd .ib:hover{background:var(--surface-2);color:var(--ink)}
  .ai-hd .ib svg{width:15px;height:15px}
  body.ai-full .ribai{background:#2b2c4d;border-color:#3a3c66}
  /* COLLAPSED — a live session is parked; page handed back, one small edge tab to return to it. */

    width:32px;height:40px;padding:0;cursor:pointer;background:var(--surface);color:var(--ai);
    border:1px solid var(--line-2);border-right:none;border-radius:6px 0 0 6px;box-shadow:-2px 0 8px rgba(16,22,35,.06);transition:.16s}
  body.ai-min .ai-mintab{display:grid}
  .ai-mintab:hover{background:var(--ai-bg);border-color:var(--ai-line)}
  .ai-mintab svg{width:16px;height:16px}
  body.ai-min .ribai{background:rgba(107,163,245,.10)}
  .ai-scroll{flex:1;overflow:auto;padding:15px}
  .ai-greet{font-size:16px;font-weight:500;margin-bottom:4px}
  .ai-greet-s{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .ai-offnote{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
  .ai-offnote b{color:var(--ink-2);font-weight:500}
  .ai-link{color:var(--accent);cursor:pointer}
  .ai-sugs{display:flex;flex-direction:column;gap:8px}
  .ai-sug{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit}
  .ai-sug:hover{border-color:var(--accent-line);background:var(--accent-bg);color:var(--ink)}
  .aimsg{margin-bottom:14px}
  .aimsg.u{display:flex;justify-content:flex-end}
  .aimsg.u .ub{background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--ink);border-radius:10px 10px 3px 10px;padding:9px 12px;font-size:12.5px;max-width:86%}
  .aimsg.a{background:var(--surface);border:1px solid var(--line);border-radius:3px 10px 10px 10px;padding:12px 13px;box-shadow:var(--shadow)}
  .ai-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}

  /* ---------- Knowledge Timeline: multi-year GL + recurrence detection ---------- */
  var MABBR=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MNAME=MABBR;
  var HMONTHS=(function(){var a=[];var y=2023,mo=8;for(var i=0;i<36;i++){a.push(y+'-'+(mo<10?'0'+mo:mo));mo++;if(mo>12){mo=1;y++;}}return a;})();
  function countYears(){return HMONTHS.length/12;}
  function monLabel(m){return MABBR[+m.slice(5)]+' '+m.slice(2,4);}
  function monthDiff(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));}
  function monthRange(a,b){var out=[];var y=+a.slice(0,4),mo=+a.slice(5);while(true){out.push(y+'-'+(mo<10?'0'+mo:mo));if(y===+b.slice(0,4)&&mo===+b.slice(5))break;mo++;if(mo>12){mo=1;y++;}}return out;}
  function fyMonthCal(yi){return ((yi+7)%12)+1;}
  function acctArea(acc){return acc.type==='Revenue'?{area:'Revenue',reviewId:'rev'}:{area:'Operating Expense',reviewId:'opex'};}
  function effScale(acc){var s=0;E_ENT.forEach(function(e){s+=e.s*((acc.aff&&acc.aff[e.id])||1);});return s;}
  function histNat(acc,gmi){
    var yi=gmi%12;var ac=acc.acct;var nat;
    if(ac==='55000'){nat=(yi===4)?505000*Math.pow(1.03,Math.floor(gmi/12)):37000;}
    else if(ac==='53000'){nat=(gmi===31)?381000:56000*Math.pow(1.002,gmi);}
    else if(ac==='15000'){nat=(gmi===29)?1010000:120000*Math.pow(1.003,gmi);}
    else if(ac==='16000'){nat=(gmi>=24)?(gmi===29?-905000:(gmi<29?150000:42000)):150000;}
    else if(ac==='52000'){nat=208000+(gmi>=29?92000:0);}
    else{nat=acc.base*Math.pow(1+acc.g,gmi);var isSummer=(yi<=1)||(yi>=10);if(acc.season)nat*=1+(isSummer?acc.season:(yi===2||yi===9?acc.season*0.4:0));if(ac==='50000'&&gmi===35)nat*=1.24;}
    nat*=effScale(acc);
    var n=Math.abs(Math.sin(gmi*131+ac.charCodeAt(0)*17))%1;
    nat*=1+(n-0.5)*0.04;
    return Math.round(nat);
  }
  var _hist={};

  /* stored close-history (the small, labelled prior-close records; matching is computed) */
  var RECON_ITEMS=[{desc:'In-transit wire (operating account)',firstSeen:'2026-04',amount:12000,reviewId:'cash',area:'Cash'}];

    {memo:'Soft/hard cost reclass',closes:['2026-04','2026-05','2026-06','2026-07'],reviewId:'cip',area:'CIP'},
    {memo:'Depreciation true-up (post-CIP)',closes:['2026-01','2026-07'],reviewId:'fa',area:'Fixed Asset'}
  ];

    {title:'Controller explanation reused from FY25',tags:['Operating Expense','Reused'],note:'Last July’s temporary-power narrative applies again; Korvyn carried it forward and flagged it for confirmation.',reviewId:'opex',prior:'FY25 close',text:'July increase is seasonal cooling load at the data-center campuses; no adjustment proposed.'},
    {title:'Prior audit comment resurfaced',tags:['Debt','FY25 audit'],note:'The interest-classification question from the FY25 audit was raised again this close.',reviewId:'debt',prior:'FY25 audit',text:'Confirm interest classification agrees to the amortization schedule.'}

  function movingAvg(s){var n=s.length,t=[];for(var i=0;i<n;i++){var lo=Math.max(0,i-6),hi=Math.min(n-1,i+5),sum=0,c=0;for(var j=lo;j<=hi;j++){sum+=s[j];c++;}t[i]=sum/c;}return t;}
  function seasonalItems(){
    var out=[];
    E_ACC.forEach(function(acc){
      if(acc.type!=='Expense'&&acc.type!=='Revenue')return;
      var s=histSeries(acc.acct);var trend=movingAvg(s);
      var dev=s.map(function(v,i){return trend[i]?v/trend[i]:1;});
      var byDev=[];for(var yi=0;yi<12;yi++)byDev[yi]=[];
      dev.forEach(function(d,gmi){byDev[gmi%12].push(d);});
      var avgDev=byDev.map(function(a){return a.reduce(function(x,y){return x+y},0)/a.length;});
      var pm=0;for(var j=1;j<12;j++)if(avgDev[j]>avgDev[pm])pm=j;
      var lift=(avgDev[pm]-1)*100;
      if(lift<15)return;
      var years=byDev[0].length,recurs=true;
      for(var y=0;y<years;y++){if(byDev[pm][y]<1.10){recurs=false;break;}}
      if(!recurs)return;
      var byRaw=[];for(var z=0;z<12;z++)byRaw[z]=[];
      s.forEach(function(v,gmi){byRaw[gmi%12].push(v);});
      var yrMean=[];for(var yy=0;yy<years;yy++){var sm=0;for(var k=0;k<12;k++)sm+=s[yy*12+k];yrMean[yy]=sm/12;}
      var mean=s.reduce(function(a,b){return a+b},0)/s.length;
      var cal=fyMonthCal(pm),area=acctArea(acc);
      out.push({id:'sea-'+acc.acct,kind:'seasonal',t:'Recurring '+MNAME[cal]+' increase in '+acc.name,
        tags:[area.area,'Seen '+years+' years'],
        note:MNAME[cal]+' runs about +'+Math.round(lift)+'% above the surrounding months in every one of the last '+years+' years.',
        ev:{pm:pm,cal:cal,mean:mean,liftPct:lift,perYear:byRaw[pm].map(function(v,i){return {fy:'FY'+(24+i),v:v,lift:Math.round((v-yrMean[i])/yrMean[i]*100)};}),series:s},
        reviewId:area.reviewId,rank:lift*Math.abs(byRaw[pm][years-1])});
    });
    out.sort(function(a,b){return b.rank-a.rank;});
    return out;
  }
  function agingItems(){

      h+='<td>'+rpUpMark(p.id,'GL')+'</td>';

      h+='<td>'+rpMark(p.coa)+'</td><td>'+rpMark(p.val)+'</td><td>'+rpMark(p.recon)+'</td><td>'+rpMark(p.trend)+'</td><td>'+rpMark(p.wp)+'</td>';
      h+='<td>'+rpReviewPill(p.review)+'</td>';
      h+='<td>'+(p.locked?'<span class="rp-lock on">'+RP_LOCKED+'Locked</span>':'<span class="rp-lock">'+RP_UNLOCK+'Open</span>')+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    $('#view').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#view tr[data-pid]'),function(r){r.onclick=function(){openPeriod(this.getAttribute('data-pid'));};});
  }

  /* ---- page: a single period workspace (scaffold — sections light up over time) ---- */
  function openPeriod(id){
    var p=rpPeriodById(id);if(!p)return;
    activeNav='repo-workspaces';renderNav();
    var gl=rpActive(id,'GL'),tb=rpActive(id,'TB');
    var h='<div class="wsback" id="rpBack">&larr; Monthly Workspaces</div>';
    h+='<div class="wshead"><div><div class="wt">'+p.label+'</div><div class="wsub">'+rpStPill(p.status)+'<span>'+(p.close?(p.close+(p.target?' &middot; target sign-off '+p.target:'')):(p.lockedOn?('Locked '+p.lockedOn):''))+'</span></div></div><span class="grow"></span>';
    if(!p.locked){h+='<button class="btn" id="rpGoUpload">Upload data</button><button class="btn" id="rpGoCoa">Chart of accounts</button>';}
    h+='</div>';
    h+='<div class="rp-lifecycle">';
    h+=rpLcCard('General ledger',gl?('v'+gl.ver+' active'):'Not uploaded',gl?'done':'na');
    h+=rpLcCard('Trial balance',tb?('v'+tb.ver+' active'):'Not uploaded',tb?'done':'na');
    h+=rpLcCard('CoA mapping',rpStateWord(p.coa),p.coa);
    h+=rpLcCard('Validation',rpStateWord(p.val),p.val);
    h+=rpLcCard('BS reconciliations',rpStateWord(p.recon),p.recon);
    h+=rpLcCard('Trend analysis',rpStateWord(p.trend),p.trend);
    h+=rpLcCard('Workpapers',rpStateWord(p.wp),p.wp);
    h+='</div>';
    h+='<div class="sec-h"><h2>Inside this workspace</h2><span class="note">everything for '+p.label+' lives here &middot; sections activate as Korvyn connects them</span></div>';
    h+=wsec(0,'Trial Balance','The period trial balance, versioned.')+(tb?('<div class="stub"><b>Active v'+tb.ver+'.</b> '+esc(tb.file)+' &middot; '+rpNum(tb.rows)+' accounts &middot; '+tb.at+'. Statement views build on this in a later phase.</div>'):stub('No trial balance uploaded yet. Upload one from Financial Data Upload.'))+'</div>';
    h+=wsec(1,'General Ledger','Full GL detail for the period.')+(gl?('<div class="stub"><b>Active v'+gl.ver+'.</b> '+esc(gl.file)+' &middot; '+rpNum(gl.rows)+' lines &middot; '+gl.at+'. Drill-down, trending and variance read from this.</div>'):stub('No general ledger uploaded yet. Upload one from Financial Data Upload.'))+'</div>';
    h+=wsec(2,'Chart of Accounts Mapping','Every account classified through the mapping engine, not the raw ERP chart.')+stub('Reporting, financial-statement and business categories are managed in Chart of Accounts Mapping. New accounts appearing in this period are flagged there for classification.')+'</div>';
    var future=[['Balance Sheet Reconciliations','Account-by-account reconciliation with supporting evidence.'],['Trending','Multi-period movement across accounts, departments and entities.'],['Variance Analysis','Period-over-period explanations, materiality-flagged.'],['Supporting Workpapers','Attached schedules and calculations backing each balance.'],['Comments','Threaded discussion at every account and balance.'],['Audit Support','Evidence packages and audit readiness for the period.'],['AI Insights','Korvyn narrates what changed and why &mdash; grounded in this period&rsquo;s own data.']];
    future.forEach(function(f,i){h+=wsec(3+i,f[0],f[1])+stub('Connects in a later phase. The architecture already scopes this section to '+p.label+'.')+'</div>';});
    $('#view').innerHTML=h;
    var b=document.getElementById('rpBack');if(b)b.onclick=function(){renderRepoWorkspaces();window.scrollTo(0,0);};
    var gu=document.getElementById('rpGoUpload');if(gu)gu.onclick=function(){rpUpPeriod=id;navTo('repo-upload');};
    var gc=document.getElementById('rpGoCoa');if(gc)gc.onclick=function(){navTo('repo-coa');};
  }

  /* ---- page: Financial Data Upload ---- */
  var rpUpPeriod=null;
  function rpInitUpPeriod(){if(!rpUpPeriod||!rpPeriodById(rpUpPeriod)||rpPeriodById(rpUpPeriod).locked){var op=RP_PERIODS.filter(function(p){return !p.locked;});rpUpPeriod=(op[0]||RP_PERIODS[0]).id;}}
  function renderRepoUpload(){
    rpInitUpPeriod();
    var h='<div class="kv-hd"><div><div class="k">Monthly close</div><h1>Financial Data</h1><div class="kv-sub">Upload the general ledger and trial balance for a period. Every upload is retained &mdash; the latest becomes <b>Active</b>, earlier versions stay available. Nothing is ever overwritten, and a locked period accepts no further uploads.</div></div></div>';
    h+='<div class="lbl" style="margin-bottom:8px">Accounting period</div><div class="rp-pchips">';
    RP_PERIODS.forEach(function(p){
      if(p.locked){h+='<span class="rp-pchip lk" title="Locked — no further uploads">'+RP_LOCKED+p.label+'</span>';}
      else{h+='<button class="rp-pchip'+(p.id===rpUpPeriod?' on':'')+'" data-pid="'+p.id+'">'+p.label+'</button>';}
    });
    h+='</div>';
    h+='<div class="rp-up">'+rpUpTile('General Ledger Detail','GL','rpFileGL')+rpUpTile('Trial Balance','TB','rpFileTB')+'</div>';
    $('#view').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#view .rp-pchip[data-pid]'),function(b){b.onclick=function(){rpUpPeriod=this.getAttribute('data-pid');renderRepoUpload();};});
    rpWireFile('rpFileGL','GL');rpWireFile('rpFileTB','TB');
  }
  function rpUpTile(title,type,inputId){
    var vs=rpVersions(rpUpPeriod,type);
    var h='<div class="rp-uptile"><h3>'+RP_UPIC+title+'</h3><div class="rp-up-p">Belongs to <b>'+rpPeriodById(rpUpPeriod).label+'</b> &middot; appends a new version</div>';
    h+='<div class="rp-drop"><div class="rp-ic2">'+RP_UPIC+'</div>Drop a file here, or<br><button class="btn" data-trig="'+inputId+'" style="margin-top:8px">Choose file…</button><input type="file" id="'+inputId+'" style="display:none"></div>';
    if(vs.length){h+='<div class="lbl" style="margin-bottom:4px">Version history</div>';vs.forEach(function(u,i){h+='<div class="rp-vrow"><span class="rp-vn">v'+u.ver+' &middot; '+esc(u.file)+'</span><span class="rp-vm">'+u.by+'</span><span class="rp-badge '+(i===0?'active':'super')+'">'+(i===0?'Active':'Superseded')+'</span></div>';});}
    else{h+='<div class="stub">No '+(type==='GL'?'general ledger':'trial balance')+' uploaded for this period yet.</div>';}
    h+='</div>';return h;
  }
  function rpWireFile(inputId,type){
    var inp=document.getElementById(inputId);if(!inp)return;
    var trig=document.querySelector('#view .btn[data-trig="'+inputId+'"]');if(trig)trig.onclick=function(){inp.click();};
    inp.onchange=function(){var nm=(inp.files&&inp.files[0])?inp.files[0].name:'';rpAppend(rpUpPeriod,type,nm);};
  }
  function rpAppend(period,type,name){
    var next=(rpActive(period,type)?rpActive(period,type).ver:0)+1;
    var nm=name||((type==='GL'?'GL_Detail_':'TrialBalance_')+period.replace('-','_')+'_v'+next+(type==='GL'?'.xlsx':'.csv'));
    RP_UPLOADS.unshift({id:'U-'+(9000+RP_UPLOADS.length),period:period,type:type,file:nm,ver:next,by:'Sarah Chen',at:'Just now',rows:(type==='GL'?18000+next*20:210+next)});
    renderRepoUpload();renderNav();
  }

  /* ---- page: Chart of Accounts Mapping ---- */
  function renderRepoCoa(){
    var mapped=RP_COA.filter(function(c){return c.status==='mapped';}).length;
    var neu=RP_COA.filter(function(c){return c.status==='new';}).length;
    var pend=RP_COA.filter(function(c){return c.status==='pending';}).length;
    var h='<div class="kv-hd"><div><div class="k">Monthly close</div><h1>Account Mapping</h1><div class="kv-sub">Every report, reconciliation, statement and insight reads through this mapping engine &mdash; never the raw ERP chart of accounts. One ERP account carries many classifications: financial-statement, reporting and business categories, all user-defined.</div></div></div>';
    h+='<div class="kv-stats"><div class="kv-stat"><div class="v">'+mapped+'</div><div class="l">Mapped</div></div><div class="kv-stat"><div class="v">'+neu+'</div><div class="l">New &middot; needs mapping</div></div><div class="kv-stat"><div class="v">'+pend+'</div><div class="l">Pending</div></div></div>';
    if(neu+pend>0){h+='<div class="rp-flag"><span class="rp-fi">'+RP_WARN+'</span><div><b>'+(neu+pend)+' account'+((neu+pend)>1?'s':'')+' need mapping.</b> The latest GL introduced accounts Korvyn has not classified before. Nothing maps automatically &mdash; assign each to a reporting category, or leave it pending.</div></div>';}
    h+='<div class="evwrap"><table class="rev"><thead><tr><th>ERP account</th><th>FS category</th><th>Reporting category</th><th>Business category</th><th>Status</th></tr></thead><tbody>';
    var order={new:0,pending:1,mapped:2};
    var rows=RP_COA.slice().sort(function(a,b){return (order[a.status]-order[b.status])||(a.acct<b.acct?-1:1);});
    rows.forEach(function(c){
      h+='<tr>';
      h+='<td><div class="rev-nm">'+c.acct+' '+esc(c.name)+'<span class="sub">'+c.type+'</span></div></td>';
      if(c.status==='mapped'){
        h+='<td>'+esc(c.fs||'—')+'</td><td>'+esc(c.report||'—')+'</td><td>'+esc(c.biz||'—')+'</td>';
        h+='<td><span class="st approved"><span class="d"></span>Mapped</span></td>';
      }else{
        h+='<td colspan="3"><div class="rp-assign"><span class="lbl2">Map to reporting category:</span>'+RP_REPORT.map(function(r){return '<button class="rp-catchip" data-acct="'+c.acct+'" data-cat="'+esc(r)+'">'+esc(r)+'</button>';}).join('')+'<button class="rp-pend-lnk" data-acct="'+c.acct+'">Leave pending</button></div></td>';
        h+='<td>'+(c.status==='new'?'<span class="rp-new">'+RP_WARN.replace('16','13').replace('16','13')+'New &middot; needs mapping</span>':'<span class="st attention"><span class="d"></span>Pending</span>')+'</td>';
      }
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="sec-h" style="margin-top:26px"><h2>Category model</h2><span class="note">user-defined and unlimited &middot; companies organize accounts differently</span></div>';
    h+='<div class="rp-up"><div class="rp-uptile"><h3>Financial statement</h3><div class="rp-up-p">Maps to the primary statements.</div><div class="kv-tags">'+RP_FS.map(function(x){return '<span class="kpill">'+esc(x)+'</span>';}).join('')+'</div></div>';
    h+='<div class="rp-uptile"><h3>Reporting</h3><div class="rp-up-p">Management reporting rollups.</div><div class="kv-tags">'+RP_REPORT.map(function(x){return '<span class="kpill">'+esc(x)+'</span>';}).join('')+'</div></div>';
    h+='<div class="rp-uptile"><h3>Business</h3><div class="rp-up-p">Custom, company-defined dimensions.</div><div class="kv-tags">'+RP_BIZ.map(function(x){return '<span class="kpill">'+esc(x)+'</span>';}).join('')+'</div></div></div>';
    $('#view').innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#view .rp-catchip'),function(b){b.onclick=function(){rpMap(this.getAttribute('data-acct'),this.getAttribute('data-cat'));};});
    Array.prototype.forEach.call(document.querySelectorAll('#view .rp-pend-lnk'),function(b){b.onclick=function(){rpPend(this.getAttribute('data-acct'));};});
  }
  function rpMap(acct,report){var c=rpCoaByAcct(acct);if(!c)return;c.report=report;c.fs=rpFsFor(report);if(!c.biz)c.biz=(c.type==='Asset'?'Capital program':c.type==='Liability'?'Corporate':'Data center');c.status='mapped';renderRepoCoa();renderNav();}
  function rpPend(acct){var c=rpCoaByAcct(acct);if(c)c.status='pending';renderRepoCoa();renderNav();}

  /* ---- page: Upload History ---- */
  function renderRepoHistory(){
    var h='<div class="kv-hd"><div><div class="k">Monthly close</div><h1>Upload History</h1><div class="kv-sub">Every general ledger and trial balance ever uploaded, across all periods. The repository <b>appends</b> &mdash; prior versions are never discarded, so historical data stays available for trending and audit.</div></div></div>';
    var rows=RP_UPLOADS.slice().sort(function(a,b){return a.period<b.period?1:a.period>b.period?-1:(b.ver-a.ver);});
    h+='<div class="evwrap"><table class="rev"><thead><tr><th>Period</th><th>Type</th><th>File</th><th class="r">Version</th><th class="r">Rows</th><th>Uploaded by</th><th>Uploaded</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function(u){
      var active=rpActive(u.period,u.type);var isA=active&&active.id===u.id;
      h+='<tr><td>'+rpPeriodById(u.period).label+'</td><td>'+(u.type==='GL'?'General ledger':'Trial balance')+'</td><td><div class="rev-nm" style="font-weight:400">'+esc(u.file)+'</div></td><td class="r">v'+u.ver+'</td><td class="r">'+rpNum(u.rows)+'</td><td><span class="who"><span class="ava">'+initials(u.by)+'</span>'+esc(u.by)+'</span></td><td>'+u.at+'</td><td>'+(isA?'<span class="st approved"><span class="d"></span>Active</span>':'<span class="st draft"><span class="d"></span>Superseded</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    $('#view').innerHTML=h;
  }

  /* ---------- Reminders (docked slide panel, like Ask Korvyn) ---------- */
  var TODAY_D=new Date(2026,6,25); // Jul 25 2026 (close day 4 of 8)
  var _MOMAP={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  function dueDate(s){var p=s.trim().split(/\s+/);return new Date(2026,_MOMAP[p[0]],+p[1]);}
  function daysUntil(s){return Math.round((dueDate(s)-TODAY_D)/86400000);}
  function dueWord(d){return d<0?('overdue by '+(-d)+'d'):d===0?'today':d===1?'tomorrow':'in '+d+'d';}
  function reminders(){
    var now=[],later=[];
    REVIEWS.forEach(function(r){
      if(r.status==='approved')return;
      var d=daysUntil(r.due);
      var item={kind:'due',rid:r.id,d:d,name:r.name,due:r.due,sev:d<0?'over':(d<=1?'warn':'info')};
      if(d<=2)now.push(item); else if(d<=6)later.push(item);
    });
    now.sort(function(a,b){return a.d-b.d;});later.sort(function(a,b){return a.d-b.d;});
    var extra=[];
    REVIEWS.forEach(function(r){if(r.status!=='approved'&&/auditor/i.test(r.last))extra.push({kind:'audit',rid:r.id,sev:'info',name:r.name});});
    var oq=REVIEWS.reduce(function(a,r){return a+r.q},0),nrev=REVIEWS.filter(function(r){return r.q>0}).length;
    if(oq>0)extra.push({kind:'q',sev:'info',oq:oq,nrev:nrev});
    return {now:now.concat(extra),later:later};
  }
  function remNowCount(){return reminders().now.length;}
  function renderNotifBadge(){var b=document.getElementById('ribCount');if(!b)return;var c=remNowCount();b.textContent=c;b.classList.toggle('show',c>0);}
  function notifRow(x){
    var txt,cls=x.rid?' link':'',data=x.rid?' data-rid="'+esc(x.rid)+'"':'',tag=x.rid?'button':'div';
    if(x.kind==='due')txt='<b>'+esc(x.name)+'</b><span class="nd-when">due '+dueWord(x.d)+' &middot; '+esc(x.due)+'</span>';
    else if(x.kind==='audit')txt='<b>Auditor requested support</b><span class="nd-when">'+esc(x.name)+' &middot; open the review to respond</span>';
    else txt='<b>'+x.oq+' open questions</b><span class="nd-when">across '+x.nrev+' reviews need a response</span>';
    return '<'+tag+' class="nd-row'+cls+'"'+data+'><span class="nd-dot '+x.sev+'"></span><span class="nd-tx">'+txt+'</span>'+(x.rid?'<span class="nd-go">&rarr;</span>':'')+'</'+tag+'>';
  }
  var NP_BELL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>';
  function renderNotif(){
    var r=reminders();
    var h='<div class="ai-hd"><span class="ai-mark np-ic">'+NP_BELL+'</span><div class="htx"><div class="t">Reminders</div><div class="g">Close July 2026 &middot; day 4 of 8</div></div><span class="sp"></span><button class="ib" id="notifX" title="Close">&#10005;</button></div>';
    h+='<div class="nd-body">';
    if(!r.now.length&&!r.later.length){h+='<div class="nd-empty">Nothing due right now &mdash; you&rsquo;re clear.</div>';}
    else{
      if(r.now.length){h+='<div class="nd-sec">Needs attention</div>'+r.now.map(notifRow).join('');}
      if(r.later.length){h+='<div class="nd-sec">Later this week</div>'+r.later.map(notifRow).join('');}
    }
    h+='</div><div class="nd-ft"><span class="lk" id="ndAll">See all reviews &rarr;</span></div>';
    var el=document.getElementById('notifPanel');el.innerHTML=h;
    document.getElementById('notifX').onclick=notifClose;
    Array.prototype.forEach.call(el.querySelectorAll('.nd-row.link'),function(b){b.onclick=function(){var id=this.getAttribute('data-rid');notifClose();openReview(id);};});
    var all=document.getElementById('ndAll');if(all)all.onclick=function(){notifClose();navTo('my');};
  }
  function notifOpen(){if(typeof aiClose==='function')aiClose();if(typeof fluxInspClose==='function')fluxInspClose();renderNotif();document.body.classList.add('notif-open');}
  function notifClose(){document.body.classList.remove('notif-open');}
  function notifToggle(){document.body.classList.contains('notif-open')?notifClose():notifOpen();}
  function dueStripHTML(){
    var r=reminders();var due=r.now.filter(function(x){return x.kind==='due';}).concat(r.later).sort(function(a,b){return a.d-b.d;}).slice(0,4);
    if(!due.length)return '';
    return '<div class="duestrip"><span class="due-lbl">Due soon</span>'+due.map(function(x){return '<button class="due-chip'+(x.d<=1?' urg':'')+'" data-rid="'+esc(x.rid)+'"><span class="dd"></span>'+esc(x.name)+' <span class="dw">'+dueWord(x.d)+'</span></button>';}).join('')+'</div>';
  }
  function renderDueStrip(){var el=document.getElementById('dueStrip');if(!el)return;el.innerHTML=dueStripHTML();Array.prototype.forEach.call(el.querySelectorAll('.due-chip'),function(b){b.onclick=function(){openReview(this.getAttribute('data-rid'));};});}
  (function(){var b=document.getElementById('ribBell');if(b)b.onclick=notifToggle;})();
  (function(){var ov=document.getElementById('reviewModal');if(ov)ov.onclick=function(e){if(e.target===ov)closeReviewModal();};document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('reviewModal').classList.contains('open'))closeReviewModal();});})();

  /* ---------- global active-period switcher (the whole app scopes to one close period) ---------- */
  function reRenderCurrent(){var k=activeNav;
    if(k==='close-dash')renderCloseDash();
    else if(k==='controls')renderControls();
    else if(k==='repo-ledger')renderLedger();
    else if(k==='mfs')renderMonthlyFS();
    else if(k==='filing')renderFiling();
    else if(k==='mtrend')renderMonthlyTrend();
    else if(k==='repo-upload')renderRepoUpload();
    else if(k==='repo-coa')renderRepoCoa();
    else if(k==='repo-history')renderRepoHistory();}
  function setActivePeriod(m){ACTIVE_PERIOD=m;ldgMonth=m;curPeriod=m;ldgExpand=null;paintPeriodChip();closePeriodMenu();reRenderCurrent();}
  function paintPeriodChip(){var b=document.getElementById('ribPeriod');if(!b)return;var p=rpPeriodById(ACTIVE_PERIOD);var right=p?(p.locked?'Locked':p.close):'';b.innerHTML='Close <b>'+(p?p.label:ACTIVE_PERIOD)+'</b>'+(right?' &middot; '+right:'')+'<svg class="rp-cv" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>';}
  function renderPeriodMenu(){var el=document.getElementById('periodMenu');if(!el)return;var h='';periodYears().forEach(function(g){h+='<div class="pm-yr">FY '+g.year+'</div>';g.periods.forEach(function(p){h+='<button class="pm-item'+(p.id===ACTIVE_PERIOD?' on':'')+'" data-mo="'+p.id+'"><span>'+p.label+'</span><span class="pm-st '+(p.locked?'lk':'op')+'">'+(p.locked?'Locked':'Open')+'</span></button>';});});el.innerHTML=h;Array.prototype.forEach.call(el.querySelectorAll('.pm-item'),function(b){b.onclick=function(){setActivePeriod(this.getAttribute('data-mo'));};});}
  function closePeriodMenu(){var el=document.getElementById('periodMenu');if(el)el.classList.remove('open');}
  function togglePeriodMenu(){var el=document.getElementById('periodMenu');if(!el)return;if(el.classList.contains('open')){closePeriodMenu();}else{renderPeriodMenu();el.classList.add('open');}}
  (function(){var b=document.getElementById('ribPeriod');if(b)b.onclick=function(e){e.stopPropagation();togglePeriodMenu();};
    document.addEventListener('click',function(e){var w=document.querySelector('.rb-period-wrap');if(w&&!w.contains(e.target))closePeriodMenu();});})();

  /* ---------- boot: land on the close Dashboard ---------- */
  try{if(localStorage.getItem('korvyn.nav')==='1')document.body.classList.add('nav-collapsed');}catch(e){}
  activeNav='close-dash';
  renderNav();
  renderCloseDash();
  paintPeriodChip();
  renderNotifBadge();
})();
</script>
