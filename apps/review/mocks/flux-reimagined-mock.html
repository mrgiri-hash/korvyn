<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korvyn · Flux &amp; Analysis — re-imagined (mockup)</title>
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --raise:#EFF1F5;
    --ink:#141824; --ink-2:#252B3B; --muted:#565E72; --faint:#6B7285;
    --line:rgba(20,24,36,.10); --line-2:rgba(20,24,36,.18);
    --chrome:#161719; --chrome-2:#1C1D20; --chrome-ink:#EDEDEE; --chrome-ink-2:#A0A0A4; --chrome-line:rgba(255,255,255,.11);
    --chrome-lift:rgba(255,255,255,.06); --chrome-lift-on:rgba(255,255,255,.10); --chrome-badge:rgba(255,255,255,.09);
    --chrome-accent:#7A9CF0;
    --accent:#2F62D4; --accent-bg:#EDF2FD; --accent-line:#C4D9FB;
    --ai:#6366F1; --ai-bg:#F4F4FF; --ai-line:#DDDEFB; --ai-ink:#4B4ED6;
    --pos:#1F7A4D; --warn:#9A6712; --neg:#C0392B;
    --pos-bg:#EAF6EF; --warn-bg:#FDF3E2; --neg-bg:#FBECEA;
    --teal:#1C6B7A;
    --fx-stripe:#F4F6F8; --fx-tot:#E9EDF2; --fx-sec:#EAEEF2; --fx-sec-tx:#17646F; --fx-head:linear-gradient(180deg,#F3F6F9,#E7ECF1);
    --radius:6px; --shadow:0 12px 34px rgba(16,18,24,.14);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --ribbon-h:50px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0F1218; --surface:#171A21; --surface-2:#1C1F27; --raise:#232732;
      --ink:#F2F4F8; --ink-2:#DFE3EA; --muted:#A6ADBC; --faint:#8B93A4;
      --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
      --accent:#7A9CF0; --accent-bg:#1A2438; --accent-line:#31456B;
      --ai:#818CF8; --ai-bg:#171B30; --ai-line:#2E3358; --ai-ink:#AEB4FF;
      --pos:#4FBF88; --warn:#D6A24E; --neg:#E8756B;
      --pos-bg:#12281E; --warn-bg:#2A2213; --neg-bg:#2C1613;
      --teal:#5BB6C4;
      --fx-stripe:#1C212A; --fx-tot:#262D38; --fx-sec:#20262F; --fx-sec-tx:#64B6C2; --fx-head:linear-gradient(180deg,#242B35,#1A1F27);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- ribbon ---------- */
  .ribbon{height:var(--ribbon-h);background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--chrome-line);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.14em;font-size:15px}
  .brand .mk{width:15px;height:15px;border:1.6px solid var(--chrome-ink);border-radius:50%;position:relative;display:inline-block}
  .brand .mk::before{content:"";position:absolute;left:-4px;top:6px;width:8px;height:1.6px;background:var(--chrome-ink)}
  .brand .mk::after{content:"";position:absolute;left:5.4px;top:5.4px;width:4px;height:4px;border-radius:50%;background:var(--chrome-accent)}
  .rb-crumb{color:var(--chrome-ink-2);font-size:12px;display:flex;align-items:center;gap:8px}
  .rb-crumb b{color:var(--chrome-ink);font-weight:500}
  .rb-sp{flex:1}
  .rb-ai{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--chrome-ink);background:var(--chrome-lift);border:1px solid var(--chrome-line);padding:5px 11px;border-radius:20px}
  .rb-ai .spk{color:var(--chrome-accent)}
  .rb-user{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5570c7,#3f52a0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .rb-org{color:var(--chrome-ink-2)}
  .rb-close{color:var(--chrome-ink-2);font-size:12px;padding-right:4px}
  .rb-close span{opacity:.65}

  /* ---------- analysis strip: labeled facets, each a click-to-edit popover ---------- */
  .smartbar{display:flex;align-items:center;gap:1px;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--ribbon-h);z-index:25;flex-wrap:wrap}
  .lens{display:inline-flex;align-items:center;gap:9px;border:0;background:none;cursor:pointer;font-family:var(--sans);padding:4px 12px 4px 9px;border-radius:8px}
  .lens:hover{background:var(--surface-2)}
  .lens-dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7C4DD6);box-shadow:0 0 0 3px var(--accent-bg);flex-shrink:0}
  .lens-tt{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .lens-l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;line-height:1}
  .lens-nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;line-height:1.15}
  .lens svg{color:var(--faint);align-self:center}
  .strip-div{width:1px;height:28px;background:var(--line);margin:0 8px;flex-shrink:0}
  .fct{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;cursor:pointer;font-family:var(--sans);padding:4px 13px;border-radius:7px}
  .fct:hover{background:var(--surface-2)}
  .fct .fct-l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;line-height:1}
  .fct .fct-vw{display:inline-flex;align-items:center;gap:4px}
  .fct .fct-v{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;line-height:1.25}
  .fct .fct-c{color:var(--faint);display:flex;opacity:0;transition:opacity .12s}
  .fct:hover .fct-c{opacity:.9}
  /* active-refinement chips + Filter dropdown */
  .rchip{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:20px;background:var(--surface);height:28px;margin-right:6px;overflow:hidden}
  .rchip:hover{border-color:var(--faint)}
  .rchip .rchip-l{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-left:11px}
  .rchip .rchip-v{font-size:12.5px;color:var(--ink);font-weight:500;padding:0 7px 0 6px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;height:100%}
  .rchip .rchip-x{border:0;background:none;cursor:pointer;color:var(--faint);font-size:11px;line-height:1;padding:0 10px 0 3px;height:100%;font-family:var(--sans)}
  .rchip .rchip-x:hover{color:var(--neg)}
  .rchip.sf.t-accent{background:var(--accent-bg);border-color:var(--accent-line)} .rchip.sf.t-accent .rchip-v{color:var(--accent)}
  .rchip.sf.t-warn{background:var(--warn-bg);border-color:rgba(154,103,18,.3)} .rchip.sf.t-warn .rchip-v{color:var(--warn)}
  .rchip.sf.t-neg{background:var(--neg-bg);border-color:rgba(192,57,43,.25)} .rchip.sf.t-neg .rchip-v{color:var(--neg)}
  .rchip.sf.t-pos{background:var(--pos-bg);border-color:rgba(31,122,77,.25)} .rchip.sf.t-pos .rchip-v{color:var(--pos)}
  .rchip.sf .rchip-v{padding-left:11px;cursor:default}
  .rchip.sf .rchip-x{color:inherit;opacity:.7} .rchip.sf .rchip-x:hover{opacity:1}
  .rchip-empty{font-size:12.5px;color:var(--faint);margin-right:8px}
  .stmt-badge{display:inline-flex;align-items:center;gap:7px;height:28px;border:1px solid var(--line-2);border-radius:20px;background:var(--surface);padding:0 9px 0 11px;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .stmt-badge:hover{border-color:var(--faint);background:var(--surface-2)}
  .stmt-badge svg{color:var(--faint)}
  .stmt-badge .sb-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .stmt-badge.s-is .sb-dot{background:var(--accent)}
  .stmt-badge.s-bs .sb-dot{background:#7C4DD6}
  .stmt-badge.s-all .sb-dot{background:linear-gradient(135deg,var(--accent) 0 50%,#7C4DD6 50% 100%)}
  .refine-btn{display:inline-flex;align-items:center;gap:6px;height:28px;border:1px dashed var(--line-2);background:none;color:var(--muted);border-radius:20px;padding:0 10px 0 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
  .refine-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-bg)}
  .refine-btn svg:first-child{opacity:.85}
  .expmenu.refine{min-width:258px;padding-top:0}
  .rm-title{font-size:12px;font-weight:600;color:var(--ink);padding:10px 12px 9px;border-bottom:1px solid var(--line);margin:0 -5px 0;position:sticky;top:0;background:var(--surface)}
  .rm-search-wrap{display:flex;align-items:center;gap:7px;margin:0 -5px 4px;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--faint)}
  .rm-search{flex:1;border:0;background:none;font-family:var(--sans);font-size:12.5px;color:var(--ink);padding:2px 0}
  .rm-search:focus{outline:none}
  .rm-search::placeholder{color:var(--faint)}
  .rm-row{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-family:var(--sans)}
  .rm-row:hover{background:var(--surface-2)}
  .rm-row .rm-l{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;width:72px;text-align:left;flex-shrink:0}
  .rm-row.set .rm-l{color:var(--accent)}
  .rm-row .rm-v{flex:1;font-size:12.5px;color:var(--ink);font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rm-row > svg{color:var(--faint);flex-shrink:0}
  .rm-flt{display:flex;align-items:flex-start;gap:8px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--ink);text-align:left}
  .rm-flt:hover{background:var(--surface-2)}
  .rm-flt .rm-chk{width:14px;flex-shrink:0;color:var(--accent);display:flex;margin-top:1px}
  .rm-flt .sf-dot{width:8px;height:8px;border-radius:2px;border:1px solid;flex-shrink:0;margin-top:3px}
  .rm-fn{display:flex;flex-direction:column;line-height:1.3}
  .rm-fh{font-size:10.5px;color:var(--faint);font-weight:400}
  .expmenu .mm-sec.first{border-top:0;margin-top:0;padding-top:3px}
  .strip-filters{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sf-lead{color:var(--faint);display:flex;padding:0 2px}
  .sb-sp{flex:1;min-width:8px}
  .ic-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:none;border-radius:var(--radius);color:var(--muted);cursor:pointer;margin:0 1px}
  .ic-btn:hover{background:var(--surface-2);color:var(--ink)}
  /* facet / lens popover — small, focused, immediate apply */
  .fpop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:206px;max-width:290px}
  .fpop[hidden]{display:none}
  .fpop-h{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:6px 10px 5px}
  .fpop button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;font-size:12.5px;color:var(--ink);border-radius:6px;cursor:pointer;font-family:var(--sans);line-height:1.25}
  .fpop button:hover{background:var(--surface-2)}
  .fpop button.on{color:var(--accent);font-weight:500}
  .fpop .fpop-ck{width:14px;flex-shrink:0;color:var(--accent);display:flex}
  .fpop-sep{height:1px;background:var(--line);margin:4px 6px}
  .mat-cust{display:flex;align-items:center;gap:6px;padding:3px 10px 6px}
  .mat-cust input{width:76px;height:28px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;font-size:12px;font-family:var(--sans);color:var(--ink);background:var(--surface)}
  .mat-cust input#matPctIn{width:46px}
  .mat-cust input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .mat-cust span{color:var(--faint);font-size:11px}
  .mat-apply-wrap{padding:0 10px 6px;text-align:right}
  .mat-apply-wrap .btn-apply{padding:5px 16px;font-size:12px}
  .sv-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--faint)}
  .sv-filters > svg{opacity:.7;flex-shrink:0}
  .sf-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 5px 3px 10px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:500}
  .sf-chip .sf-x{border:0;background:none;cursor:pointer;font-size:10px;line-height:1;padding:2px 3px;opacity:.65;color:inherit;font-family:var(--sans)}
  .sf-chip .sf-x:hover{opacity:1}
  .sf-chip.t-accent{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-line)}
  .sf-chip.t-warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(154,103,18,.3)}
  .sf-chip.t-neg{background:var(--neg-bg);color:var(--neg);border-color:rgba(192,57,43,.25)}
  .sf-chip.t-pos{background:var(--pos-bg);color:var(--pos);border-color:rgba(31,122,77,.25)}
  .sv-addf{border:1px dashed var(--line-2);background:none;color:var(--muted);font-size:11.5px;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .sv-addf:hover{color:var(--accent);border-color:var(--accent-line)}
  .expmenu .sf-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;border:1px solid}
  .expmenu .sf-dot.t-accent{background:var(--accent-bg);border-color:var(--accent)}
  .expmenu .sf-dot.t-warn{background:var(--warn-bg);border-color:var(--warn)}
  .expmenu .sf-dot.t-neg{background:var(--neg-bg);border-color:var(--neg)}
  .expmenu .sf-dot.t-pos{background:var(--pos-bg);border-color:var(--pos)}
  .expmenu .hint{display:block;font-size:10.5px;color:var(--faint);font-weight:400;margin-top:1px;white-space:normal;max-width:190px}
  .expmenu button{align-items:flex-start}
  .fm-empty{padding:8px 10px;font-size:12px;color:var(--faint)}
  .expmenu .mm-sec{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:7px 10px 3px;font-weight:600;border-top:1px solid var(--line);margin-top:3px}
  #moreMenu button{align-items:center}
  .ep-note{font-size:10.5px;color:var(--faint);line-height:1.4;margin-top:2px}
  .demo-chip{font-size:11px;color:var(--warn);background:var(--warn-bg);border:1px solid rgba(154,103,18,.25);padding:3px 10px;border-radius:20px;white-space:nowrap}

  /* ---------- edit-view panel (staged apply) ---------- */
  .editpanel{position:fixed;top:calc(var(--ribbon-h) + 47px);right:14px;z-index:60;width:min(900px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:18px 20px 14px}
  .editpanel[hidden]{display:none}
  .ep-backdrop{position:fixed;inset:0;z-index:55}
  .ep-backdrop[hidden]{display:none}
  .ep-x{position:absolute;right:14px;top:13px;cursor:pointer;color:var(--faint);font-size:17px;line-height:1;background:none;border:0}
  .ep-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:16px 24px}
  .eg-h{font-size:11px;font-weight:600;color:var(--accent);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .ep-f{margin-bottom:11px}
  .ep-f > label{display:block;font-size:10.5px;color:var(--faint);margin-bottom:4px}
  .ep-f select{width:100%;height:31px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:0 24px 0 9px;-webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236B7285' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .ep-f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .ep-chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:10px;cursor:pointer}
  .ep-chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .ep-add{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--sans);padding:2px 0}
  .ep-ft{display:flex;align-items:center;gap:10px;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
  .ep-ft .sp{flex:1}
  .ep-reset{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .ep-reset:hover{color:var(--accent)}
  .btn-ghost{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .btn-ghost:hover{background:var(--surface-2)}
  .btn-apply{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--radius);padding:7px 18px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:var(--sans)}
  .btn-apply:hover{background:#2857C4}

  /* export menu + toast */
  .expmenu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;min-width:172px}
  .expmenu[hidden]{display:none}
  .expmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;font-size:12.5px;color:var(--ink);border-radius:var(--radius);cursor:pointer;font-family:var(--sans)}
  .expmenu button:hover{background:var(--surface-2)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:12.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- evidence / supporting-docs cell ---------- */
  td.ev{text-align:left;white-space:nowrap;min-width:118px}
  .evdrop{font-size:11px;color:var(--faint);border:1px dashed var(--line-2);border-radius:20px;padding:2px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.1s}
  td.ev:hover .evdrop{border-color:var(--accent-line);color:var(--accent)}
  td.ev.dragover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-bg)}
  .evdoc{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-right:4px;max-width:130px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .evdoc:hover{border-color:var(--accent-line)}
  .evmore{font-size:10.5px;color:var(--faint);cursor:pointer}

  /* ---------- context strip ---------- */
  .ctx{display:flex;align-items:center;gap:0;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ctx .cx{display:flex;flex-direction:column;padding:0 16px;border-right:1px solid var(--line)}
  .ctx .cx:first-child{padding-left:0}
  .ctx .cx .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .ctx .cx .v{font-size:13px;color:var(--ink);font-weight:500}
  .ctx .cx .v small{font-weight:400;color:var(--muted)}
  .ctx-sp{flex:1}
  .demo{font-size:11px;color:var(--warn);background:var(--warn-bg);border:1px solid rgba(154,103,18,.25);padding:3px 9px;border-radius:20px;white-space:nowrap}

  /* ---------- kpi chips ---------- */
  .kpis{display:flex;gap:10px;padding:12px 18px 4px;flex-wrap:wrap}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 14px;min-width:150px}

  var ACCBY={}; ACC.forEach(function(a){ACCBY[a.a]=a;});

  function seed(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
  function seasonF(sea,i){if(!sea)return 0;var mn=mMonthNum(i);var summer=(mn>=6&&mn<=8);var shoulder=(mn===5||mn===9);return summer?sea:(shoulder?sea*0.4:0);}

  // FACT[entId][acct] = {actual:[24], budget:[24], forecast:[24]}  (all in USD)
  var FACT=(function(){
    var F={};
    ENT.forEach(function(e){
      F[e.id]={};
      var rnd=seed(e.id.split('').reduce(function(a,c){return a+c.charCodeAt(0);},7));
      ACC.forEach(function(ac){
        var shareBase=ac.base*(e.sc/SUMSC);
        var actual=[],budget=[],forecast=[];
        for(var i=0;i<NM;i++){
          var growth=Math.pow(1+ac.g,i);
          var seas=1+seasonF(ac.sea,i);
          var noise=1+(rnd()-0.5)*0.05;
          // BUDGET = smooth plan (no spikes / heat / step-in-year beyond planned)
          var b=shareBase*growth*(1+seasonF(ac.sea,i)*0.6)*noise;
          if(ac.step&&i>=ac.step.at)b+=ac.step.add*(e.sc/SUMSC)*0.9; // step partly budgeted
          // ACTUAL
          var v=shareBase*growth*seas*noise*(1+ac.varf);
          if(ac.step&&i>=ac.step.at)v+=ac.step.add*(e.sc/SUMSC);
          if(ac.jul&&mMonthNum(i)===7&&i>=12)v*=ac.jul; // heat event, current-year Julys
          if(ac.spike&&ac.spike.at===i)v=ac.spike.to*(e.sc/SUMSC);
          if(ac.cip){var cy=i-0;v=(i===17? -520000000*(e.sc/SUMSC) : shareBase*(1+(rnd()-0.5)*0.1)); if(i>17)v=shareBase*0.7;}
          if(ac.bs){ // balances trend up smoothly, budget≈actual for BS
            b=v*(1+(rnd()-0.5)*0.01);
          }
          var f=(b+v)/2*(1+(rnd()-0.5)*0.02); // re-forecast
          actual.push(v); budget.push(b); forecast.push(f);
        }
        F[e.id][ac.a]={actual:actual,budget:budget,forecast:forecast};
      });
    });
    return F;
  })();

  /* =========================================================================

  var DEF={rows:'segment>account', cols:'period', measure:'amount', basis:'mom',

  /* =========================================================================
     ROW MODEL — build a tree of {key,label,sub,depth,kind,filter,expandable}

  var expanded={}; // key -> bool
  function rowTree(){
    var rows=[];

      secs.forEach(function(s){

        list.forEach(function(ac){rows.push({key:'a:'+ac.a,label:ac.n,code:ac.a,sub:ac.rep,depth:1,kind:'grp',expandable:false,filter:function(x){return x.a===ac.a;},acct:ac});});
        rows.push({key:'tot:'+s[0],label:'Total '+s[1].toLowerCase(),depth:0,kind:'tot',filter:function(x){return x.t===s[0];}});

    if(mode==='segment'){ // segment only (leaf = segment contribution)
      SEG_ORDER.forEach(function(sg){

        rows.push({key:'seg:'+sg,label:sg,depth:0,kind:'grp',expandable:false,signed:mixed,filter:(function(s){return function(x){return x.seg===s;};})(sg),seg:sg});
      });

      list.forEach(function(ac){

  // value for a given row across entities in scope (respect entOnly / entScope / accFilter / filter)
  function rowVal(row, idx, scenario, signed){

  /* =========================================================================

  function abbr(n){var s=n<0?'−':'';n=Math.abs(Math.round(n));

    if(n>=1e6)return s+'$'+(n/1e6).toFixed(1)+'M';

  function spark(vals){

    var pts=vals.map(function(v,i){var x=pad+i/(vals.length-1)*(w-2*pad);var y=h-pad-((v-mn)/rng)*(h-2*pad);return [x,y];});
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    var last=pts[pts.length-1];

  function gridPeriod(rows){

  function csvq(s){s=String(s).replace(/"/g,'""');return /[",\n]/.test(s)?'"'+s+'"':s;}
  function exportCSV(){
    var rows=rowTree(),idxs=(cfg.cols==='period')?windowIdx():[CUR];
    var head=['Line item'].concat(idxs.map(function(i){return mLabel(i);})).concat(['Delta','Delta %','Explanation']);
    var lines=[head.map(csvq).join(',')];
    rows.forEach(function(r){
      if(r.hidden||r.kind==='sec')return;
      var vals=idxs.map(function(i){return Math.round(rowVal(r,i,'actual',r.signed));});
      var cur=vals[vals.length-1],base=(cfg.basis==='budget'||cfg.basis==='forecast')?Math.round(rowVal(r,CUR,cfg.basis,r.signed)):Math.round(rowVal(r,basisIdx(CUR),'actual',r.signed));
      var e=EXPL[explKey(r)];
      var cells=[csvq((r.code?r.code+' ':'')+r.label)].concat(vals).concat([cur-base,(base?((cur-base)/Math.abs(base)*100).toFixed(1):'')]).concat([csvq(e?e.text:'')]);
      lines.push(cells.join(','));
    });
    var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(lines.join('\n'));a.download='flux-'+cfg.statement+'-'+mLabel(CUR).replace(' ','')+'.csv';document.body.appendChild(a);a.click();a.remove();
    setToast('CSV exported');
  }

    $('#foot').innerHTML='<b>One cube, sliced any way you need.</b> The window is a live pivot over the consolidated GL — choose rows, columns, comparison basis, window, measure, scope and currency, and save any slice as a named view. '+
      'The review layer (materiality flag → Korvyn-drafted explanation → reviewer accept → sign-off) rides on whatever slice you build, and its explanations persist as you re-pivot. '+
      'Numbers derive from a synthesized full cube (7 legal entities standing in for 512 subsidiaries across 3 regions and 4 functional currencies, with Budget / Forecast / prior-year scenarios) — illustrative, to show the model end to end.';
  }

  function renderAll(){renderSmartbar();renderGrid();renderInspector();renderFoot();}
  document.addEventListener('click',function(e){
    var em=$('#expMenu');if(em&&!em.hidden&&!e.target.closest('#expMenu')&&!e.target.closest('#svExport'))em.hidden=true;
    var fm=$('#filterMenu');if(fm&&!fm.hidden&&!e.target.closest('#filterMenu')&&!e.target.closest('#svAddFilter'))fm.hidden=true;
    var mm=$('#moreMenu');if(mm&&!mm.hidden&&!e.target.closest('#moreMenu')&&!e.target.closest('#svMore'))mm.hidden=true;
    var fp=$('#facetPop');if(fp&&!fp.hidden&&!e.target.closest('#facetPop')&&!e.target.closest('.rchip-v')&&!e.target.closest('.rm-row')&&!e.target.closest('#lensBtn')&&!e.target.closest('#stmtBadge'))fp.hidden=true;
    var rm=$('#refineMenu');if(rm&&!rm.hidden&&!e.target.closest('#refineMenu')&&!e.target.closest('#refineBtn'))rm.hidden=true;
  });
  applyView('v1');
})();
</script>
